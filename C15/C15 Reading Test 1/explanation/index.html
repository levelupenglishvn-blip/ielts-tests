ze:15px}.vocab-table th{background:var(--soft);text-align:left;color:var(--muted);font-size:12px}.vocab-table th,.vocab-table td{padding:16px;border-bottom:1px solid var(--line);vertical-align:top}.vocab-table td:first-child{min-width:160px}.phonetic{display:block;font-size:12px;color:var(--muted);margin-top:4px}.vocab-table td:last-child{width:28%;min-width:210px}.vocab-table summary{cursor:pointer;color:var(--brand);font-size:13px}.vocab-table details[open] summary{margin-bottom:6px}.dock{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:30;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:7px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 30px #0002;width:360px;max-width:calc(100% - 20px)}.dock button{font-size:12px;padding:5px 11px;border-color:transparent;white-space:nowrap}.dock button[aria-current=page]{background:var(--brand);color:#fff}.help{font-size:12px;color:var(--muted);margin-bottom:14px}code{font:inherit}#toast{font-size:12px;color:var(--muted)}@media(min-width:1650px){.workspace{grid-template-columns:minmax(0,1.65fr) minmax(420px,1fr)}}

<header><div><div class="logo">LEVEL UP · READING STUDIO</div><h1>Cambridge 15 · Reading Test 1</h1><small id="subtitle">Reading correction · 3 passages / 40 questions</small></div><div class="toolbar"><button id="reset">Ẩn lời giải</button><button id="theme" aria-label="Đổi chế độ sáng tối">◐ Dark mode</button></div></header>
<main id="app"></main><nav class="dock" aria-label="Điều hướng bài đọc và từ vựng"></nav><script>
const DATA=[{"title": "Nutmeg – a valuable spice", "passage": ["The nutmeg tree, Myristica fragrans, is a large evergreen tree native to Southeast Asia. Until the late 18th century, it only grew in one place in the world: a small group of islands in the Banda Sea, part of the Moluccas – or Spice Islands – in northeastern Indonesia. The tree is thickly branched with dense foliage of tough, dark green oval leaves, and produces small, yellow, bell-shaped flowers and pale yellow pear-shaped fruits. The fruit is encased in a fleshy husk. When the fruit is ripe, this husk splits into two halves along a ridge running the length of the fruit. Inside is a purple-brown shiny seed, 2-3 cm long by about 2 cm across, surrounded by a lacy red or crimson covering called an ‘aril’. These are the sources of the two spices nutmeg and mace, the former being produced from the dried seed and the latter from the aril.", "Nutmeg was a highly prized and costly ingredient in European cuisine in the Middle Ages, and was used as a flavouring, medicinal, and preservative agent. Throughout this period, the Arabs were the exclusive importers of the spice to Europe. They sold nutmeg for high prices to merchants based in Venice, but they never revealed the exact location of the source of this extremely valuable commodity. The Arab-Venetian dominance of the trade finally ended in 1512, when the Portuguese reached the Banda Islands and began exploiting its precious resources.", "Always in danger of competition from neighbouring Spain, the Portuguese began subcontracting their spice distribution to Dutch traders. Profits began to flow into the Netherlands, and the Dutch commercial fleet swiftly grew into one of the largest in the world. The Dutch quietly gained control of most of the shipping and trading of spices in Northern Europe. Then, in 1580, Portugal fell under Spanish rule, and by the end of the 16th century the Dutch found themselves locked out of the market. As prices for pepper, nutmeg, and other spices soared across Europe, they decided to fight back.", "In 1602, Dutch merchants founded the VOC, a trading corporation better known as the Dutch East India Company. By 1617, the VOC was the richest commercial operation in the world. The company had 50,000 employees worldwide, with a private army of 30,000 men and a fleet of 200 ships. At the same time, thousands of people across Europe were dying of the plague, a highly contagious and deadly disease. Doctors were desperate for a way to stop the spread of this disease, and they decided nutmeg held the cure. Everybody wanted nutmeg, and many were willing to spare no expense to have it. Nutmeg bought for a few pennies in Indonesia could be sold for 68,000 times its original cost on the streets of London. The only problem was the short supply. And that’s where the Dutch found their opportunity.", "The Banda Islands were ruled by local sultans who insisted on maintaining a neutral trading policy towards foreign powers. This allowed them to avoid the presence of Portuguese or Spanish troops on their soil, but it also left them unprotected from other invaders. In 1621, the Dutch arrived and took over. Once securely in control of the Bandas, the Dutch went to work protecting their new investment. They concentrated all nutmeg production into a few easily guarded areas, uprooting and destroying any trees outside the plantation zones. Anyone caught growing a nutmeg seedling or carrying seeds without the proper authority was severely punished. In addition, all exported nutmeg was covered with lime to make sure there was no chance a fertile seed which could be grown elsewhere would leave the islands. There was only one obstacle to Dutch domination. One of the Banda Islands, a sliver of land called Run, only 3 km long by less than 1 km wide, was under the control of the British. After decades of fighting for control of this tiny island, the Dutch and British arrived at a compromise settlement, the Treaty of Breda, in 1667. Intent on securing their hold over every nutmeg-producing island, the Dutch offered a trade: if the British would give them the island of Run, they would in turn give Britain a distant and much less valuable island in North America. The British agreed. That other island was Manhattan, which is how New Amsterdam became New York. The Dutch now had a monopoly over the nutmeg trade which would last for another century.", "Then, in 1770, a Frenchman named Pierre Poivre successfully smuggled nutmeg plants to safety in Mauritius, an island off the coast of Africa. Some of these were later exported to the Caribbean where they thrived, especially on the island of Grenada. Next, in 1778, a volcanic eruption in the Banda region caused a tsunami that wiped out half the nutmeg groves. Finally, in 1809, the British returned to Indonesia and seized the Banda Islands by force. They returned the islands to the Dutch in 1817, but not before transplanting hundreds of nutmeg seedlings to plantations in several locations across southern Asia. The Dutch nutmeg monopoly was over.", "Today, nutmeg is grown in Indonesia, the Caribbean, India, Malaysia, Papua New Guinea and Sri Lanka, and world nutmeg production is estimated to average between 10,000 and 12,000 tonnes per year."], "targets": {"ev1": 0, "ev2": 0, "ev3": 0, "ev4": 0, "ev5": 1, "ev8": 1, "ev6": 3, "ev9": 3, "ev10": 4, "ev11": 4, "ev7": 4, "ev12": 5, "ev13": 5}, "questions": "\n                <div class=\"section-title\">Questions 1-4 (Note Completion)</div>\n                \n                <div data-target=\"ev1\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>1.</strong> The leaves of the tree are <span class=\"blank-space\" id=\"b1\">__________</span> in shape.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans1')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans1\">\n                        <strong>Đáp án: oval</strong><br>\n                        <em>Giải thích:</em> Đoạn 1 viết: \"...tough, dark green oval leaves\". Từ \"oval\" mô tả hình dạng lá cây.\n                    </div>\n                </div>\n\n                <div data-target=\"ev2\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>2.</strong> The <span class=\"blank-space\" id=\"b2\">__________</span> surrounds the fruit and breaks open when the fruit is ripe.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans2')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans2\">\n                        <strong>Đáp án: husk</strong><br>\n                        <em>Giải thích:</em> Đoạn 1 nêu: \"The fruit is encased in a flesh husk. When the fruit is ripe, this husk splits into two halves...\".\n                    </div>\n                </div>\n\n                <div data-target=\"ev3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>3.</strong> The <span class=\"blank-space\" id=\"b3\">__________</span> is used to produce the spice nutmeg.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans3')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans3\">\n                        <strong>Đáp án: seed</strong><br>\n                        <em>Giải thích:</em> Cuối đoạn 1 ghi rõ: \"...the former being produced from the dried seed...\", trong đó \"former\" đại diện cho nutmeg.\n                    </div>\n                </div>\n\n                <div data-target=\"ev4\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>4.</strong> The covering known as the aril is used to produce <span class=\"blank-space\" id=\"b4\">__________</span>.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans4')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans4\">\n                        <strong>Đáp án: mace</strong><br>\n                        <em>Giải thích:</em> Cuối đoạn 1: \"...and the latter from the aril\", \"latter\" ở đây là gia vị mace.\n                    </div>\n                </div>\n\n                <div class=\"section-title\">Questions 5-7 (True/False/Not Given)</div>\n\n                <div data-target=\"ev5\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>5.</strong> In the Middle Ages, most Europeans knew where nutmeg was grown.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans5')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans5\">\n                        <strong>Đáp án: FALSE</strong><br>\n                        <em>Giải thích:</em> Đoạn 2 ghi người Ả Rập giữ kín vị trí: \"...they never revealed the exact location of the source...\". Do đó người Châu Âu không thể biết nơi trồng.\n                    </div>\n                </div>\n\n                <div data-target=\"ev6\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>6.</strong> The VOC was the world’s first major trading company.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans6')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans6\">\n                        <strong>Đáp án: NOT GIVEN</strong><br>\n                        <em>Giải thích:</em> Đoạn 4 nói VOC là \"richest commercial operation\" (giàu nhất), chứ không đề cập đây có phải công ty đầu tiên (first) hay không.\n                    </div>\n                </div>\n\n                <div data-target=\"ev7\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>7.</strong> Following the Treaty of Breda, the Dutch had control of all the islands where nutmeg grew.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans7')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans7\">\n                        <strong>Đáp án: TRUE</strong><br>\n                        <em>Giải thích:</em> Đoạn 5 đề cập sau khi đổi đảo Manhattan lấy đảo Run từ tay Anh qua hiệp ước Treaty of Breda, Hà Lan đã hoàn toàn độc quyền: \"The Dutch now had a monopoly over the nutmeg trade...\".\n                    </div>\n                </div>\n\n                <div class=\"section-title\">Questions 8-13 (Table Completion)</div>\n\n                <div data-target=\"ev8\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>8.</strong> Nutmeg was brought to Europe by the <span class=\"blank-space\" id=\"b8\">__________</span>.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans8')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans8\">\n                        <strong>Đáp án: Arabs</strong><br>\n                        <em>Giải thích:</em> Đoạn 2: \"Throughout this period, the Arabs were the exclusive importers of the spice to Europe.\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev9\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>9.</strong> Demand for nutmeg grew, as it was believed to be effective against the disease known as the <span class=\"blank-space\" id=\"b9\">__________</span>.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans9')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans9\">\n                        <strong>Đáp án: plague</strong><br>\n                        <em>Giải thích:</em> Đoạn 4: \"...dying of the plague... Doctors... decided nutmeg held the cure.\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev10\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>10.</strong> Put <span class=\"blank-space\" id=\"b10\">__________</span> on nutmeg to avoid it being cultivated outside the islands.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans10')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans10\">\n                        <strong>Đáp án: lime</strong><br>\n                        <em>Giải thích:</em> Đoạn 5: \"...all exported nutmeg was covered with lime to make sure there was no chance a fertile seed...\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev11\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>11.</strong> Finally obtained the island of <span class=\"blank-space\" id=\"b11\">__________</span> from the British.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans11')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans11\">\n                        <strong>Đáp án: Run</strong><br>\n                        <em>Giải thích:</em> Đoạn 5: \"...if the British would give them the island of Run...\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev12\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>12.</strong> 1770 – nutmeg plants were secretly taken to <span class=\"blank-space\" id=\"b12\">__________</span>.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans12')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans12\">\n                        <strong>Đáp án: Mauritius</strong><br>\n                        <em>Giải thích:</em> Đoạn 6: \"...smuggled nutmeg plants to safety in Mauritius...\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev13\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>13.</strong> 1778 – half the Banda Islands’ nutmeg plantations were destroyed by a <span class=\"blank-space\" id=\"b13\">__________</span>.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans13')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans13\">\n                        <strong>Đáp án: tsunami</strong><br>\n                        <em>Giải thích:</em> Đoạn 6: \"...a volcanic eruption in the Banda region caused a tsunami that wiped out half...\"\n                    </div>\n                </div>\n            ", "vocab": [{"w": "nutmeg (n)", "v": "nhục đậu khấu", "e": "Nutmeg was once an extremely valuable spice.", "p": ""}, {"w": "spice (n)", "v": "gia vị", "e": "The islands supplied spices to European markets.", "p": ""}, {"w": "evergreen (adj)", "v": "thường xanh", "e": "Nutmeg is an evergreen tree native to Southeast Asia.", "p": ""}, {"w": "husk (n)", "v": "lớp vỏ bao ngoài", "e": "The husk splits open when the fruit is ripe.", "p": ""}, {"w": "seed (n)", "v": "hạt", "e": "Nutmeg is produced from the dried seed.", "p": ""}, {"w": "mace (n)", "v": "gia vị làm từ lớp áo hạt nhục đậu khấu", "e": "Mace comes from the covering around the seed.", "p": ""}, {"w": "merchant (n)", "v": "thương nhân", "e": "Merchants sold the spice at high prices.", "p": ""}, {"w": "spice trade (n)", "v": "hoạt động buôn bán gia vị", "e": "European powers competed to control the spice trade.", "p": ""}, {"w": "plantation (n)", "v": "đồn điền", "e": "Nutmeg trees were grown on guarded plantations.", "p": ""}, {"w": "monopoly (n)", "v": "sự độc quyền", "e": "The Dutch established a monopoly over the nutmeg trade.", "p": ""}, {"w": "smuggle (v)", "v": "buôn lậu; bí mật đưa qua biên giới", "e": "Plants were smuggled to Mauritius.", "p": ""}, {"w": "seedling (n)", "v": "cây con", "e": "Seedlings were transplanted to other parts of Asia.", "p": ""}]}, {"title": "Driverless cars", "passage": ["The automotive sector is well used to adapting to automation in manufacturing. The implementation of robotic car manufacture from the 1970s onwards led to significant cost savings and improvements in the reliability and flexibility of vehicle mass production. A new challenge to vehicle production is now on the horizon and, again, it comes from automation. However, this time it is not to do with the manufacturing process, but with the vehicles themselves. Research projects on vehicle automation are not new. Vehicles with limited self-driving capabilities have been around for more than 50 years, resulting in significant contributions towards driver assistance systems. But since Google announced in 2010 that it had been trialling self-driving cars on the streets of California, progress in this field has quickly gathered pace.", "There are many reasons why technology is advancing so fast. One frequently cited motive is safety; indeed, research at the UK’s Transport Research Laboratory has demonstrated that more than 90 percent of road collisions involve human error as a contributory factor, and it is the primary cause in the vast majority. Automation may help to reduce the incidence of this. Another aim is to free the time people spend driving for other purposes. If the vehicle can do some or all of the driving, it may be possible to be productive, to socialise or simply to relax while automation systems have responsibility for safe control of the vehicle. If the vehicle can do the driving, those who are challenged by existing mobility models – such as older or disabled travellers – may be able to enjoy significantly greater travel autonomy.", "Beyond these direct benefits, we can consider the wider implications for transport and society, and how manufacturing processes might need to respond as a result. At present, the average car spends more than 90 percent of its life parked. Automation means that initiatives for car-sharing become much more viable, particularly in urban areas with significant travel demand. If a significant proportion of the population choose to use shared automated vehicles, mobility demand can be met by far fewer vehicles.", "The Massachusetts Institute of Technology investigated automated mobility in Singapore, finding that fewer than 30 percent of the vehicles currently used would be required if fully automated car sharing could be implemented. If this is the case, it might mean that we need to manufacture far fewer vehicles to meet demand. However, the number of trips being taken would probably increase, partly because empty vehicles would have to be moved from one customer to the next. Modelling work by the University of Michigan Transportation Research Institute suggests automated vehicles might reduce vehicle ownership by 43 percent, but that vehicles’ average annual mileage would double as a result. As a consequence, each vehicle would be used more intensively, and might need replacing sooner. This faster rate of turnover may mean that vehicle production will not necessarily decrease.", "Automation may prompt other changes in vehicle manufacture. If we move to a model where consumers are tending not to own a single vehicle but to purchase access to a range of vehicles through a mobility provider, drivers will have the freedom to select one that best suits their needs for a particular journey, rather than making a compromise across all their requirements. Since, for most of the time, most of the seats in most cars are unoccupied, this may boost production of a smaller, more efficient range of vehicles that suit the needs of individuals. Specialised vehicles may then be available for exceptional journeys, such as going on a family camping trip or helping a son or daughter move to university.", "There are a number of hurdles to overcome in delivering automated vehicles to our roads. These include the technical difficulties in ensuring that the vehicle works reliably in the infinite range of traffic, weather and road situations it might encounter; the regulatory challenges in understanding how liability and enforcement might change when drivers are no longer essential for vehicle operation; and the societal changes that may be required for communities to trust and accept automated vehicles as being a valuable part of the mobility landscape.", "It’s clear that there are many challenges that need to be addressed but, through robust and targeted research, these can most probably be conquered within the next 10 years. Mobility will change in such potentially significant ways and in association with so many other technological developments, such as telepresence and virtual reality, that it is hard to make concrete predictions about the future. However, one thing is certain: change is coming, and the need to be flexible in response to this will be vital for those involved in manufacturing the vehicles that will deliver future mobility."], "targets": {"ev19": 1, "ev15_23": 1, "ev24": 1, "ev14": 2, "ev20": 2, "ev21_22": 3, "ev18": 3, "ev16": 4, "ev26": 5, "ev25": 5, "ev17": 6}, "questions": "\n                <div class=\"section-title\">Questions 14-18 (Matching Information)</div>\n\n                <div data-target=\"ev14\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>14.</strong> Reference to the amount of time when a car is not in use.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans14')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans14\">\n                        <strong>Đáp án: C</strong><br>\n                        <em>Giải thích:</em> Đoạn C đề cập: \"At present, the average car spends more than 90 percent of its life parked.\" (90% thời gian xe bị đỗ không dùng).\n                    </div>\n                </div>\n\n                <div data-target=\"ev15_23\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>15.</strong> Mention of several advantages of driverless vehicles for individual road-users.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans15')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans15\">\n                        <strong>Đáp án: B</strong><br>\n                        <em>Giải thích:</em> Đoạn B liệt kê các lợi ích: làm việc, giải trí, thư giãn và giúp người già/người khuyết tật di chuyển độc lập.\n                    </div>\n                </div>\n\n                <div data-target=\"ev16\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>16.</strong> Reference to the opportunity of choosing the most appropriate vehicle for each trip.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans16')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans16\">\n                        <strong>Đáp án: E</strong><br>\n                        <em>Giải thích:</em> Đoạn E: \"...drivers will have the freedom to select one that best suits their needs for a particular journey...\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev17\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>17.</strong> An estimate of how long it will take to overcome a number of problems.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans17')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans17\">\n                        <strong>Đáp án: G</strong><br>\n                        <em>Giải thích:</em> Đoạn G ước tính thời gian vượt qua thách thức: \"...conquered within the next 10 years.\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev18\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>18.</strong> A suggestion that the use of driverless cars may have no effect on the number of vehicles manufactured.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans18')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans18\">\n                        <strong>Đáp án: D</strong><br>\n                        <em>Giải thích:</em> Cuối đoạn D chỉ ra: \"This faster rate of turnover may mean that vehicle production will not necessarily decrease.\"\n                    </div>\n                </div>\n\n                <div class=\"section-title\">Questions 19-22 (Summary Completion)</div>\n\n                <div data-target=\"ev19\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>19.</strong> Most motor accidents are partly due to <span class=\"blank-space\" id=\"b19\">__________</span>.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans19')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans19\">\n                        <strong>Đáp án: human error</strong><br>\n                        <em>Giải thích:</em> Đoạn B: \"...more than 90 percent of road collisions involve human error as a contributory factor...\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev20\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>20.</strong> Schemes for <span class=\"blank-space\" id=\"b20\">__________</span> will be more workable, especially in towns and cities.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans20')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans20\">\n                        <strong>Đáp án: car-sharing (hoặc car sharing)</strong><br>\n                        <em>Giải thích:</em> Đoạn C: \"...initiatives for car-sharing become much more viable...\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev21_22\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>21.</strong> There could be a 43 percent drop in <span class=\"blank-space\" id=\"b21\">__________</span> of cars.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans21')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans21\">\n                        <strong>Đáp án: ownership</strong><br>\n                        <em>Giải thích:</em> Đoạn D: \"...suggests automated vehicles might reduce vehicle ownership by 43 percent...\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev21_22\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>22.</strong> The yearly <span class=\"blank-space\" id=\"b22\">__________</span> of each car would, on average, be twice as high as it currently is.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans22')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans22\">\n                        <strong>Đáp án: mileage</strong><br>\n                        <em>Giải thích:</em> Đoạn D: \"...vehicles’ average annual mileage double as a result.\"\n                    </div>\n                </div>\n\n                <div class=\"section-title\">Questions 23 &amp; 24 (Multiple Choice - Choose TWO)</div>\n\n                <div data-target=\"ev15_23\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>23 &amp; 24.</strong> Which TWO benefits of automated vehicles does the writer mention?</p>\n                    <ul class=\"options-list\">\n                        <li class=\"reference-option\">A. Car travellers could enjoy considerable cost savings.</li>\n                        <li class=\"reference-option\">B. It would be easier to find parking spaces in urban areas.</li>\n                        <li class=\"reference-option\">C. Travellers could spend journeys doing something other than driving.</li>\n                        <li class=\"reference-option\">D. People who find driving physically difficult could travel independently.</li>\n                        <li class=\"reference-option\">E. A reduction in the number of cars would mean a reduction in pollution.</li>\n                    </ul>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans2324')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans2324\">\n                        <strong>Đáp án: C &amp; D</strong><br>\n                        <em>Giải thích:</em> Trong đoạn B:<br>\n                        - C tương ứng với \"productive, to socialise or simply to relax\".<br>\n                        - D tương ứng với \"older or disabled travellers... enjoy significantly greater travel autonomy\".\n                    </div>\n                </div>\n\n                <div class=\"section-title\">Questions 25 &amp; 26 (Multiple Choice - Choose TWO)</div>\n\n                <div data-target=\"ev25\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>25 &amp; 26.</strong> Which TWO challenges to automated vehicle development does the writer mention?</p>\n                    <ul class=\"options-list\">\n                        <li class=\"reference-option\">A. making sure the general public has confidence in automated vehicles</li>\n                        <li class=\"reference-option\">B. managing the pace of transition from conventional to automated vehicles</li>\n                        <li class=\"reference-option\">C. deciding how to compensate professional drivers who become redundant</li>\n                        <li class=\"reference-option\">D. setting up the infrastructure to make roads suitable for automated vehicles</li>\n                        <li class=\"reference-option\">E. getting automated vehicles to adapt to various different driving conditions</li>\n                    </ul>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans2526')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans2526\">\n                        <strong>Đáp án: A &amp; E</strong><br>\n                        <em>Giải thích:</em> Trong đoạn F đề cập 2 thách thức:<br>\n                        - E: \"works reliably in the infinite range of traffic, weather and road situations\" (Thích nghi nhiều điều kiện).<br>\n                        - A: \"communities to trust and accept automated vehicles\" (Công chúng tin tưởng).\n                    </div>\n                </div>\n            ", "vocab": [{"w": "driverless vehicle (n)", "v": "phương tiện không người lái", "e": "Driverless vehicles may change how people travel.", "p": ""}, {"w": "automation (n)", "v": "sự tự động hóa", "e": "Automation can take over some driving tasks.", "p": ""}, {"w": "driver assistance (n)", "v": "sự hỗ trợ người lái", "e": "Research has contributed to driver assistance systems.", "p": ""}, {"w": "road collision (n)", "v": "vụ va chạm giao thông", "e": "Human error contributes to many road collisions.", "p": ""}, {"w": "human error (n)", "v": "lỗi do con người", "e": "Automation may reduce accidents involving human error.", "p": ""}, {"w": "travel autonomy (n)", "v": "khả năng tự chủ trong việc đi lại", "e": "Older travellers could enjoy greater travel autonomy.", "p": ""}, {"w": "car-sharing (n)", "v": "việc dùng chung xe", "e": "Car-sharing could become more practical in cities.", "p": ""}, {"w": "vehicle ownership (n)", "v": "việc sở hữu phương tiện", "e": "Shared vehicles may reduce vehicle ownership.", "p": ""}, {"w": "annual mileage (n)", "v": "quãng đường xe đi trong một năm", "e": "Each vehicle’s annual mileage could increase.", "p": ""}, {"w": "vehicle manufacture (n)", "v": "việc sản xuất phương tiện", "e": "Automation may change vehicle manufacture.", "p": ""}, {"w": "mobility provider (n)", "v": "đơn vị cung cấp dịch vụ đi lại", "e": "A mobility provider could offer access to different vehicles.", "p": ""}, {"w": "driving conditions (n)", "v": "điều kiện lái xe", "e": "Automated vehicles must handle different driving conditions.", "p": ""}]}, {"title": "What is exploration?", "passage": ["We are all explorers. Our desire to discover, and then share that new-found knowledge, is part of what makes us human – indeed, this has played an important part in our success as a species. Long before the first caveman slumped down beside the fire and grunted news that there were plenty of wildebeest over yonder, our ancestors had learnt the value of sending out scouts to investigate the unknown. This questing nature of ours undoubtedly helped our species spread around the globe, just as it nowadays no doubt helps the last nomadic Penan maintain their existence in the depleted forests of Borneo, and a visitor negotiate the subways of New York.", "Over the years, we’ve come to think of explorers as a peculiar breed – different from the rest of us, different from those of us who are merely ‘well travelled’, even; and perhaps there is a type of person more suited to seeking out the new, a type of caveman more inclined to risk venturing out. That, however, doesn’t take away from the fact that we all have this enquiring instinct, even today; and that in all sorts of professions – whether artist, marine biologist or astronomer – borders of the unknown are being tested each day.", "Thomas Hardy set some of his novels in Egdon Heath, a fictional area of uncultivated land, and used the landscape to suggest the desires and fears of his characters. He is delving into matters we all recognise because they are common to humanity. This is surely an act of exploration, and into a world as remote as the author chooses. Explorer and travel writer Peter Fleming talks of the moment when the explorer returns to the existence he has left behind with his loved ones. The traveller ‘who has for weeks or months seen himself only as a puny and irrelevant alien crawling laboriously over a country in which he has no roots and no background, suddenly encounters his other self, a relatively solid figure, with a place in the minds of certain people’.", "In this book about the exploration of the earth’s surface, I have confined myself to those whose travels were real and who also aimed at more than personal discovery. But that still left me with another problem: the word ‘explorer’ has become associated with a past era. We think back to a golden age, as if exploration peaked somehow in the 19th century – as if the process of discovery is now on the decline, though the truth is that we have named only one and a half million of this planet’s species, and there may be more than 10 million – and that’s not including bacteria. We have studied only 5 per cent of the species we know. We have scarcely mapped the ocean floors, and know even less about ourselves; we fully understand the workings of only 10 per cent of our brains.", "Here is how some of today’s ‘explorers’ define the word. Ran Fiennes, dubbed the ‘greatest living explorer’, said, ‘An explorer is someone who has done something that no human has done before – and also done something scientifically useful.’ Chris Bonington, a leading mountaineer, felt exploration was to be found in the act of physically touching the unknown: ‘You have to have gone somewhere new.’ Then Robin Hanbury-Tenison, a campaigner on behalf of remote so-called ‘tribal’ peoples, said, ‘A traveller simply records information about some far-off world, and reports back; but an explorer changes the world.’ Wilfred Thesiger, who crossed Arabia’s Empty Quarter in 1946, and belongs to an era of unmechanised travel now lost to the rest of us, told me, ‘If I’d gone across by camel when I could have gone by car, it would have been a stunt.’ To him, exploration meant bringing back information from a remote place regardless of any great self-discovery.", "Each definition is slightly different – and tends to reflect the field of endeavour of each pioneer. It was the same whoever I asked: the prominent historian would say exploration was a thing of the past, the cutting-edge scientist would say it was of the present. And so on. They each set their own particular criteria; the common factor in their approach being that they all had, unlike many of us who simply enjoy travel or discovering new things, both a very definite objective from the outset and also a desire to record their findings.", "I’d best declare my own bias. As a writer, I’m interested in the exploration of ideas. I’ve done a great many expeditions and each one was unique. I’ve lived for months alone with isolated groups of people all around the world, even two ‘uncontacted tribes’. But none of these things is of the slightest interest to anyone unless, through my books, I’ve found a new slant, explored a new idea. Why? Because the world has moved on. The time has long passed for the great continental voyages – another walk to the poles, another crossing of the Empty Quarter. We know how the land surface of our planet lies; exploration of it is now down to the details – the habits of microbes, say, or the grazing behaviour of buffalo. Aside from the deep sea and deep underground, it’s the era of specialists. However, this is to disregard the role the human mind has in conveying remote places; and this is what interests me: how a fresh interpretation, even of a well-travelled route, can give its readers new insights."], "targets": {"ev27_p3": 0, "ev28_p3": 1, "ev29_p3": 2, "ev34_p3": 2, "ev30_p3": 3, "ev37_p3": 4, "ev35_p3": 4, "ev33_36_p3": 4, "ev31_p3": 5, "ev38_p3": 6, "ev39_p3": 6, "ev40_p3": 6, "ev32_p3": 6}, "questions": "\n                <div class=\"section-title\">Questions 27-32 (Multiple Choice)</div>\n\n                <div data-target=\"ev27_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>27.</strong> The writer refers to visitors to New York to illustrate the point that</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans27')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans27\">\n                        <strong>Đáp án: A (exploration is an intrinsic element of being human)</strong><br>\n                        <em>Giải thích:</em> Đoạn 1 nêu bản chất khao khát khám phá (\"questing nature of ours\") là thứ có sẵn ở con người, từ người nguyên thủy đến người đi tàu điện ngầm ở NY.\n                    </div>\n                </div>\n\n                <div data-target=\"ev28_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>28.</strong> According to the second paragraph, what is the writer’s view of explorers?</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans28')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans28\">\n                        <strong>Đáp án: C (They act on an urge that is common to everyone)</strong><br>\n                        <em>Giải thích:</em> Đoạn 2 viết: \"...doesn’t take away from the fact that we all have this enquiring instinct, even today\".\n                    </div>\n                </div>\n\n                <div data-target=\"ev29_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>29.</strong> The writer refers to a description of Egdon Heath to suggest that</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans29')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans29\">\n                        <strong>Đáp án: C (Hardy’s aim was to investigate people’s emotional states)</strong><br>\n                        <em>Giải thích:</em> Đoạn 3: \"...used the landscape to suggest the desires and fears of his characters... delving into matters we all recognise...\" (Khai thác cảm xúc nhân vật).\n                    </div>\n                </div>\n\n                <div data-target=\"ev30_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>30.</strong> In the fourth paragraph, the writer refers to ‘a golden age’ to suggest that</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans30')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans30\">\n                        <strong>Đáp án: D (we are wrong to think that exploration is no longer necessary)</strong><br>\n                        <em>Giải thích:</em> Đoạn 4 phản bác quan niệm thám hiểm đã suy giảm bằng cách chỉ ra vô số loài/đại dương/bộ não ta chưa hề khám phá hết.\n                    </div>\n                </div>\n\n                <div data-target=\"ev31_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>31.</strong> In the sixth paragraph, when discussing the definition of exploration, the writer argues that</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans31')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans31\">\n                        <strong>Đáp án: A (people tend to relate exploration to their own professional interests)</strong><br>\n                        <em>Giải thích:</em> Đoạn 6: \"Each definition is slightly different – and tends to reflect the field of endeavour of each pioneer.\" (Gắn liền với lĩnh vực chuyên môn).\n                    </div>\n                </div>\n\n                <div data-target=\"ev32_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>32.</strong> In the last paragraph, the writer explains that he is interested in</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans32')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans32\">\n                        <strong>Đáp án: B (the human ability to cast new light on places that may be familiar)</strong><br>\n                        <em>Giải thích:</em> Đoạn cuối: \"...how a fresh interpretation, even of a well-travelled route, can give its readers new insights.\"\n                    </div>\n                </div>\n\n                <div class=\"section-title\">Questions 33-37 (Matching Names)</div>\n\n                <div data-target=\"ev33_36_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>33.</strong> He referred to the relevance of the form of transport used.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans33')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans33\">\n                        <strong>Đáp án: E (Wilfred Thesiger)</strong><br>\n                        <em>Giải thích:</em> Đoạn 5: \"If I’d gone across by camel when I could have gone by car, it would have been a stunt.\" (Nhắc đến lạc đà vs xe ô tô).\n                    </div>\n                </div>\n\n                <div data-target=\"ev34_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>34.</strong> He described feelings on coming back home after a long journey.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans34')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans34\">\n                        <strong>Đáp án: A (Peter Fleming)</strong><br>\n                        <em>Giải thích:</em> Đoạn 3: \"Peter Fleming talks of the moment when the explorer returns to the existence he has left behind with his loved ones.\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev35_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>35.</strong> He worked for the benefit of specific groups of people.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans35')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans35\">\n                        <strong>Đáp án: D (Robin Hanbury-Tenison)</strong><br>\n                        <em>Giải thích:</em> Đoạn 5: \"...a campaigner on behalf of remote so-called ‘tribal’ peoples...\" (Vận động cho các bộ lạc).\n                    </div>\n                </div>\n\n                <div data-target=\"ev33_36_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>36.</strong> He did not consider learning about oneself an essential part of exploration.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans36')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans36\">\n                        <strong>Đáp án: E (Wilfred Thesiger)</strong><br>\n                        <em>Giải thích:</em> Cuối đoạn 5: \"...exploration meant bringing back information from a remote place regardless of any great self-discovery.\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev37_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>37.</strong> He defined exploration as being both unique and of value to others.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans37')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans37\">\n                        <strong>Đáp án: B (Ran Fiennes)</strong><br>\n                        <em>Giải thích:</em> Đoạn 5: \"...done something that no human has done before (unique) – and also done something scientifically useful (value to others).\"\n                    </div>\n                </div>\n\n                <div class=\"section-title\">Questions 38-40 (Summary Completion)</div>\n\n                <div data-target=\"ev38_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>38.</strong> The writer has experience of a large number of <span class=\"blank-space\" id=\"b38\">__________</span>.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans38')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans38\">\n                        <strong>Đáp án: expeditions (hoặc unique expeditions)</strong><br>\n                        <em>Giải thích:</em> Đoạn cuối: \"I’ve done a great many expeditions and each one was unique.\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev39_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>39.</strong> And was the first stranger that certain previously <span class=\"blank-space\" id=\"b39\">__________</span> people had encountered.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans39')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans39\">\n                        <strong>Đáp án: uncontacted / isolated</strong><br>\n                        <em>Giải thích:</em> Đoạn cuối: \"...isolated groups of people all around the world, even two ‘uncontacted tribes’.\"\n                    </div>\n                </div>\n\n                <div data-target=\"ev40_p3\" class=\"question-block\" onclick=\"handleQuestionClick(this)\">\n                    <p><strong>40.</strong> He believes there is no need for further exploration of Earth’s <span class=\"blank-space\" id=\"b40\">__________</span>.</p>\n                    <button class=\"btn-answer\" onclick=\"toggleAnswerBox(event, 'ans40')\">Answer</button>\n                    <div class=\"explanation-box\" id=\"ans40\">\n                        <strong>Đáp án: land surface (hoặc surface)</strong><br>\n                        <em>Giải thích:</em> Đoạn cuối: \"We know how the land surface of our planet lies; exploration of it is now down to the details...\"\n                    </div>\n                </div>\n            ", "vocab": [{"w": "exploration (n)", "v": "sự khám phá; hoạt động thám hiểm", "e": "Exploration can involve places as well as ideas.", "p": ""}, {"w": "explorer (n)", "v": "nhà thám hiểm", "e": "Each explorer has a different view of exploration.", "p": ""}, {"w": "enquiring instinct (n)", "v": "bản năng tìm hiểu, khám phá", "e": "The writer argues that we all have an enquiring instinct.", "p": ""}, {"w": "venture (v)", "v": "mạo hiểm đi tới", "e": "Some people are more willing to venture into the unknown.", "p": ""}, {"w": "expedition (n)", "v": "chuyến thám hiểm", "e": "The writer has taken part in many expeditions.", "p": ""}, {"w": "remote (adj)", "v": "xa xôi, hẻo lánh", "e": "An explorer may bring back information from a remote place.", "p": ""}, {"w": "tribal peoples (n)", "v": "các cộng đồng bộ lạc", "e": "Some explorers campaign on behalf of tribal peoples.", "p": ""}, {"w": "self-discovery (n)", "v": "sự khám phá bản thân", "e": "Exploration does not always involve self-discovery.", "p": ""}, {"w": "uncontacted (adj)", "v": "chưa tiếp xúc với người ngoài", "e": "The writer lived with uncontacted tribes.", "p": ""}, {"w": "land surface (n)", "v": "bề mặt đất liền", "e": "Much of Earth’s land surface has already been mapped.", "p": ""}, {"w": "fresh interpretati function highlightWords(text,m){
 if(!m)return esc(text);
 let ranges=[];
 for(const [kind,terms] of [['subject',m.s],['action',m.a]])for(const term of terms){
  let pos=0,low=text.toLowerCase(),needle=term.toLowerCase();
  while((pos=low.indexOf(needle,pos))>=0){
   const end=pos+term.length;
   if(!/[a-z]/i.test(text[pos-1]||'')&&!/[a-z]/i.test(text[end]||''))ranges.push({start:pos,end,kind});
   pos=end;
  }
 }
 ranges.sort((a,b)=>a.start-b.start||b.end-a.end);
 let out='',last=0;
 for(const r of ranges){if(r.start<last)continue;out+=esc(text.slice(last,r.start))+'<mark class="'+r.kind+'"><strong>'+esc(text.slice(r.start,r.end))+'</strong></mark>';last=r.end}
 return out+esc(text.slice(last));
}
function highlight(text,m){

  return relevant?'<u class="evidence-context">'+html+'</u>':html;
 }).join('');

// Bold the actual clue phrases in explanations without changing their wording.
$$('.explanation-box,.mcq-explain-dropdown').forEach(box=>{
 const q=box.closest('.question-block').dataset.q,m=MARKS[q];
 const terms=[...(m?m.s.concat(m.a):[]),'the former','the latter','never revealed','human error','car-sharing','ownership','mileage','self-discovery','new insights','first','all the islands','as if'];
 const walker=document.createTreeWalker(box,4);let node;const nodes=[];
 while(node=walker.nextNode())if(!node.parentElement.closest('strong,button,.context-note'))nodes.push(node);
 for(const node of nodes){
  let text=node.textContent,ranges=[];
  for(const term of terms){if(term.length<4)continue;let pos=0;while((pos=text.toLowerCase().indexOf(term.toLowerCase(),pos))>=0){let end=pos+term.length;if(!/[a-z]/i.test(text[pos-1]||'')&&!/[a-z]/i.test(text[end]||''))ranges.push({start:pos,end});pos=end;}}
  ranges.sort((a,b)=>a.start-b.start||b.end-a.end);let last=0,html='';
  for(const r of ranges){if(r.start<last)continue;html+=esc(text.slice(last,r.start))+'<strong class="explanation-key">'+esc(text.slice(r.start,r.end))+'</strong>';last=r.end}
  if(last){html+=esc(text.slice(last));const span=document.createElement('span');span.innerHTML=html;node.replaceWith(span)}
 }
});
