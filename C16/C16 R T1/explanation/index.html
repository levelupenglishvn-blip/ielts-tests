<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C16 R T1 Correction</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/theme.css">
<style>
:root{
  color-scheme:light;
  --font-heading:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;
  --brand:#15934E;--brand-dark:#119446;--brand-tint:#ECF6F1;
  --bg:#f5f6f5;--card:#ffffff;--text:#202020;--muted:#6f7771;--line:#dce0dc;--soft:#f4f5f3;--edge:#b2ada3;--focus:#8a7534;
  --gold:#ffe563;--goldtext:#000000;
  --ref:#2563EB;--ref-strong:#1D4ED8;--ref-bg:#2563eb1f;
  --ctx-bg:#fbe4e1;--ctx-border:#000000;
  --shadow:0 8px 28px #24312a12;
  --correct-bg:#e3f4ea;--wrong-bg:#fdecea;--wrong:#c0392b;
}
[data-theme=dark]{
  color-scheme:dark;
  --brand:#34D399;--brand-dark:#10B981;--brand-tint:#113124;
  --bg:#191b1a;--card:#222523;--text:#eeeeee;--muted:#afb7b0;--line:#404640;--soft:#292d29;--edge:#867f73;--focus:#d2b960;
  --ctx-bg:#4b2a28;--ctx-border:#e6e6e6;
  --ref:#60A5FA;--ref-bg:#3b82f633;
  --shadow:0 8px 28px #0006;
  --correct-bg:#173a29;--wrong-bg:#3a1f20;--wrong:#ef5350;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.65 Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--edge)}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- header ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px;padding:12px 26px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--brand)}
h1{margin:2px 0 0;font:700 21px/1.25 var(--font-heading)}
header small{color:var(--muted);font-size:12.5px}
.toolbar{display:flex;gap:10px}

/* ---------- pages / panes ---------- */
.page{display:none}
.page.active{display:block}
.workspace{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;padding:18px 22px 108px;height:calc(100vh - 84px)}
.pane{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-y:auto;padding:22px 26px;min-height:0}
.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--brand)}
.passage-title{margin:4px 0 8px;font:700 24px/1.3 var(--font-heading)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 16px;font-size:12.5px;color:var(--muted);align-items:center}
.legend .lg-box{display:inline-block;width:18px;height:12px;vertical-align:-1px;margin-right:6px;background:var(--ctx-bg);border:1px solid var(--ctx-border);border-radius:3px}
.legend mark.answer-hl{padding:0 4px}

/* ---------- passage paragraphs ---------- */
.passage-p{margin:0 0 14px;padding:10px 12px 8px;border-radius:12px;border-left:3px solid transparent;scroll-margin-top:12px}
.passage-p.active-context{border-left-color:var(--brand);background:var(--soft)}
.paragraph-text{font-size:17.5px;line-height:1.85;text-align:left;color:var(--text)}

/* Paragraph labels — SAME values as the Test file (size / weight / shape / colour) */
.para-label{
  display:flex;align-items:center;width:fit-content;
  font-family:var(--font-heading);font-size:16px;font-weight:700;letter-spacing:.02em;line-height:1.3;
  color:var(--brand-dark);background:var(--brand-tint);border:1px solid var(--brand);border-radius:999px;
  padding:4px 14px;margin:4px 0 10px 0;text-align:left;-webkit-user-select:none;user-select:none;
}

/* Layer 1: Context Box — thin black rectangle, light-red fill, around the whole context.
   Layer 2: Answer Highlight — yellow, black text, only the decisive words. Both show together. */
.context-box{
  display:block;margin:8px 0;padding:9px 14px;
  background:var(--ctx-bg);border:1px solid var(--ctx-border);border-radius:6px;
}
mark.answer-hl{background:var(--gold);color:var(--goldtext);border-radius:4px;padding:1px 3px;font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone}
/* Layer 3 (Matching Names only): person / reference chain — medium blue, never green, never louder than the yellow */
.ref-name{color:var(--ref);background:var(--ref-bg);border-bottom:2px solid var(--ref);border-radius:3px;padding:0 2px;font-weight:700}
mark.answer-hl .ref-name{color:var(--ref-strong);background:transparent}
[data-theme=dark] mark.answer-hl .ref-name{color:#1D4ED8}
.legend .ref-name{font-weight:700}

/* ---------- question pane ---------- */
.hint{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.section-title{font:700 18px/1.4 var(--font-heading);border-bottom:1px solid var(--line);border-left:3px solid var(--brand);padding:6px 0 6px 10px;margin:22px 0 6px}
.section-title:first-of-type{margin-top:6px}
.q-instr{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.word-box{margin:10px 0 14px;border:1px solid var(--edge);border-radius:8px;overflow:hidden;background:var(--soft)}
.word-box-title{padding:8px 12px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:1.4px;font-weight:700}
.word-options{border-collapse:collapse;width:100%;table-layout:fixed;font-size:14px}
.word-options td{width:50%;border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;overflow-wrap:anywhere}
.word-options td+td{border-left:1px solid var(--line)}
.word-options tr:last-child td{border-bottom:0}
.option-letter{display:inline-block;font-size:12px;font-weight:700;min-width:22px;color:var(--focus)}

.question-block{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px;background:var(--card);transition:border-color .18s,box-shadow .18s}
.question-block:hover{border-color:var(--edge)}
.question-block.active-question{border:1.5px solid var(--brand);box-shadow:0 0 0 5px #15934e0f}
.question-block p{margin:0 0 8px}
.question-number{display:inline-block;background:#202020;color:#fff;border-radius:6px;padding:1px 8px;margin-right:6px;font-weight:700;line-height:1.6}
[data-theme=dark] .question-number{background:#e7e7e7;color:#202020}
.q-label{font-size:12.5px;color:var(--muted)}
.btn-answer{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;padding:5px 14px;border-radius:8px;font-size:13.5px}
[data-theme=dark] .btn-answer{color:#0b1a12}
.btn-answer:hover{filter:brightness(1.1);border-color:var(--brand)}
.explanation-box{display:none;margin-top:10px;padding:10px 14px;background:var(--soft);border-left:3px solid var(--brand);border-radius:8px;font-size:14.5px}
.explanation-box.show{display:block}
.explanation-box .ans{font-weight:700}
.explanation-box p{margin:6px 0 0}

/* MCQ */
.choice-item{border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:7px 0;cursor:pointer;font-size:14.5px;display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap}
.choice-item:hover{border-color:var(--edge)}
.choice-item .cl{display:inline-flex;align-items:center;justify-content:center;flex:0 0 26px;width:26px;height:26px;border:1.5px solid var(--edge);border-radius:50%;font-weight:600;font-size:12.5px;color:var(--muted)}
.choice-item .ct{flex:1 1 200px}
.choice-item.selected{border-color:var(--brand);box-shadow:0 0 0 2px #15934e14}
.choice-item.is-correct{border-color:var(--brand);background:var(--correct-bg)}
.choice-item.is-correct .cl{background:var(--brand);border-color:var(--brand);color:#fff}
.choice-item.is-wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.mcq-info-box{display:none;flex-basis:100%;margin:4px 0 0 35px;padding:7px 10px;border-left:2px solid var(--edge);background:var(--soft);border-radius:6px;font-size:13.5px}
.mcq-info-box.show{display:block}

/* summary with gaps — inline correction */
.gap-wrap{white-space:nowrap}
.ans-btn{display:inline;font-size:11.5px;font-weight:700;line-height:1.5;padding:0 7px;margin-left:3px;border-radius:6px;color:var(--brand-dark);background:var(--brand-tint);border:1px solid var(--brand);vertical-align:baseline}
.ans-btn:hover{filter:brightness(.96);border-color:var(--brand)}
.ans-btn[aria-expanded=true]{background:var(--brand);color:#fff}
[data-theme=dark] .ans-btn[aria-expanded=true]{color:#08130d}
.inline-exp{display:block;margin:8px 0 12px;padding:10px 14px;background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;font-size:14.5px;line-height:1.65;white-space:normal}
.inline-exp .ie-head{display:block;font:700 12px/1.4 var(--font-heading);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.inline-exp .ie-ans{display:block;font-weight:700;margin-bottom:4px}
.inline-exp .ie-quote{display:block;margin:2px 0 4px}
.inline-exp .ie-loc{font-size:12px;font-weight:700;color:var(--brand-dark);margin-right:6px}
.inline-exp .ie-body{display:block;margin-top:4px}
/* summary with gaps */
.summary-group{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 16px;background:var(--card)}
.summary-prose{padding:14px 16px;font-size:15px;line-height:1.95}
.summary-prose h3{font:700 17px/1.5 var(--font-heading);margin:0 0 8px}
.summary-prose p{margin:0 0 12px}
.summary-gap{display:inline;border:0;border-bottom:1px solid var(--edge);border-radius:3px;padding:1px 4px;font:inherit;line-height:inherit;background:transparent;color:inherit}
.summary-gap strong{font-size:12px;margin-right:3px}
.summary-gap:hover,.summary-gap.active-gap{background:var(--soft);border-bottom-color:var(--brand)}
.summary-gap.filled{color:var(--brand-dark);font-weight:700;border-bottom-color:var(--brand)}
.summary-gap.filled .blank-space{font-weight:700}
.pending-note{font-size:12.5px;color:var(--muted);margin:0 0 8px}
/* notes completion: section headings + bullet lines, same card as a summary */
.summary-prose p.notes-h{font:700 15px/1.5 var(--font-heading);color:var(--brand-dark);margin:14px 0 2px}
.summary-prose p.notes-h:first-of-type{margin-top:2px}
.summary-prose p.notes-li{position:relative;margin:0 0 6px;padding-left:20px}
.summary-prose p.notes-li::before{content:'•';position:absolute;left:5px;color:var(--muted)}
/* matching headings: the dashed box at the head of each section shows the correct heading */
.head-box{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 10px;width:100%;box-sizing:border-box;margin:0 0 10px;padding:8px 12px;border:1.5px dashed var(--brand);border-radius:8px;background:var(--brand-tint);color:var(--text);font:inherit;cursor:pointer;text-align:center}
.head-box:hover{filter:brightness(.97)}
.head-box.active{border-style:solid;box-shadow:0 0 0 4px #15934e1f}
.head-box .hb-n{font:800 16px var(--font-heading)}
.head-box .hb-sec{font-size:12.5px;font-weight:600;color:var(--muted)}
.head-box .hb-ans{font-weight:700;color:var(--brand-dark)}
.option-letter.lbl{min-width:34px}
.summary-prose p.notes-li2{padding-left:42px}
.summary-prose p.notes-li2::before{content:'\25E6';left:26px}

/* ---------- vocabulary pages ---------- */
.vocab-wrap{max-width:900px;margin:0 auto;padding:22px 22px 120px}
.vocab-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.vocab-head h2{margin:0;font:700 22px var(--font-heading)}
.vocab-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.vocab-list details{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 8px;padding:0}
.vocab-list summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.vocab-list summary::-webkit-details-marker{display:none}
.vocab-list summary .pos{font-weight:400;color:var(--muted);font-size:13px}
.vocab-list details[open]{border-color:var(--brand)}
.vocab-list .vbody{padding:0 14px 12px;font-size:14.5px}
.vocab-list .vbody p{margin:4px 0}
.vocab-list .ex{color:var(--muted)}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;width:780px;max-width:calc(100% - 24px);padding:7px;background:#202020;border-radius:999px;box-shadow:0 10px 28px #0003}
.dock button{background:transparent;border:0;color:#c6c6c6;border-radius:999px;padding:10px 8px;font-weight:600;font-size:13px}
.dock button:hover{background:#303030;color:#fff}
.dock button[aria-current=page]{background:var(--brand);color:#fff}
[data-theme=dark] .dock button[aria-current=page]{color:#08130d}

/* ---------- vocabulary pop-up (centre of screen) ---------- */
.vmodal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(20,27,46,.5);padding:16px}
.vmodal[hidden]{display:none}
.vcard{position:relative;width:100%;max-width:440px;background:var(--card);color:var(--text);border-radius:16px;box-shadow:0 18px 50px #0005;padding:24px 24px 18px;border-top:5px solid var(--brand)}
.vclose{position:absolute;right:10px;top:10px;width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;background:transparent}
.vword{font:700 26px/1.25 var(--font-heading);margin:0 34px 10px 0;overflow-wrap:anywhere}
.vexample{font-size:16px;line-height:1.6;margin:0 0 14px}
.vexample .k{color:var(--muted);font-weight:600;margin-right:4px}
.vexample strong{background:var(--gold);color:var(--goldtext);border-radius:3px;padding:0 3px}
.vmeaning{font-size:16px;line-height:1.6;margin:0 0 14px;padding:10px 12px;background:var(--soft);border-left:3px solid var(--brand);border-radius:8px}
.vmeaning .k{font-weight:700;margin-right:4px}
.vnone{font-size:15px;color:var(--muted);margin:0 0 12px}
.vactions{display:flex;justify-content:flex-end;gap:8px}
.btn-reveal{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
[data-theme=dark] .btn-reveal{color:#08130d}

/* ---------- responsive / print ---------- */
@media(max-width:900px){
  header{padding:12px 16px}
  h1{font-size:17px}
  .workspace{display:block;height:auto;padding:12px 12px 108px}
  .pane{overflow:visible;margin-bottom:14px;padding:16px}
  .paragraph-text{font-size:16.5px}
  .dock{width:380px;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:24px}
  .dock button{padding:8px;font-size:12px}
}
@media print{
  header,.dock,.btn-answer,.vmodal{display:none!important}
  .page.active{display:block}
  .workspace{display:block;height:auto}
  .pane{overflow:visible;border:0;box-shadow:none}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">LEVEL UP · READING STUDIO</div>
    <h1>Cambridge 16 · Reading Test 1</h1>
    <small id="subtitle">Reading correction · 3 passages / 40 questions</small>
  </div>
  <div class="toolbar">
    <button id="reset" type="button">Ẩn lời giải</button>
    <button id="theme" type="button" aria-pressed="false">◐ Dark mode</button>
  </div>
</header>
<main id="app"></main>
<nav class="dock" aria-label="Điều hướng bài đọc và từ vựng"></nav>

<div class="vmodal" id="vmodal" hidden role="dialog" aria-modal="true" aria-labelledby="vm-word">
  <div class="vcard">
    <button type="button" class="vclose" id="vm-close" aria-label="Đóng">×</button>
    <div class="vword" id="vm-word"></div>
    <div class="vexample" id="vm-example"></div>
    <div class="vmeaning" id="vm-meaning" hidden></div>
    <div class="vnone" id="vm-none" hidden></div>
    <div class="vactions"><button type="button" class="btn-reveal" id="vm-reveal">Reveal meaning</button></div>
  </div>
</div>

<script>
const DATA={"parts": [{"title": "Why we need to protect polar bears", "subtitle": null, "paras": [{"label": null, "text": "Polar bears are being increasingly threatened by the effects of climate change, but their disappearance could have far-reaching consequences. They are uniquely adapted to the extreme conditions of the Arctic Circle, where temperatures can reach -40°C. One reason for this is that they have up to 11 centimetres of fat underneath their skin. Humans with comparative levels of adipose tissue would be considered obese and would be likely to suffer from diabetes and heart disease. Yet the polar bear experiences no such consequences."}, {"label": null, "text": "A 2014 study by Shi Ping Liu and colleagues sheds light on this mystery. They compared the genetic structure of polar bears with that of their closest relatives from a warmer climate, the brown bears. This allowed them to determine the genes that have allowed polar bears to survive in one of the toughest environments on Earth. Liu and his colleagues found the polar bears had a gene known as APoB, which reduces levels of low-density lipoproteins (LDLs) - a form of ‘bad’ cholesterol. In humans, mutations of this gene are associated with increased risk of heart disease. Polar bears may therefore be an important study model to understand heart disease in humans."}, {"label": null, "text": "The genome of the polar bear may also provide the solution for another condition, one that particularly affects our older generation: osteoporosis. This is a disease where bones show reduced density, usually caused by insufficient exercise, reduced calcium intake or food starvation. Bone tissue is constantly being remodelled, meaning that bone is added or removed, depending on nutrient availability and the stress that the bone is under. Female polar bears, however, undergo extreme conditions during every pregnancy. Once autumn comes around, these females will dig maternity dens in the snow and will remain there throughout the winter, both before and after the birth of their cubs. This process results in about six months of fasting, where the female bears have to keep themselves and their cubs alive, depleting their own calcium and calorie reserves. Despite this, their bones remain strong and dense."}, {"label": null, "text": "Physiologists Alanda Lennox and Allen Goodship found an explanation for this paradox in 2008. They discovered that pregnant bears were able to increase the density of their bones before they started to build their dens. In addition, six months later, when they finally emerged from the den with their cubs, there was no evidence of significant loss of bone density. Hibernating brown bears do not have this capacity and must therefore resort to major bone reformation in the following spring. If the mechanism of bone remodelling in polar bears can be understood, many bedridden humans, and even astronauts, could potentially benefit."}, {"label": null, "text": "The medical benefits of the polar bear for humanity certainly have their importance in our conservation efforts, but these should not be the only factors taken into consideration. We tend to want to protect animals we think are intelligent and possess emotions, such as elephants and primates. Bears, on the other hand, seem to be perceived as stupid and in many cases violent. And yet anecdotal evidence from the field challenges those assumptions, suggesting for example that polar bears have good problem-solving abilities. A male bear called GoGo in Tennoji Zoo, Osaka, has even been observed making use of a tool to manipulate his environment. The bear used a tree branch on multiple occasions to dislodge a piece of meat hung out of his reach. Problem-solving ability has also been witnessed in wild polar bears, although not as obviously as with GoGo. A calculated move by a male bear involved running and jumping onto barrels in an attempt to get to a photographer standing on a platform four metres high."}, {"label": null, "text": "In other studies, such as one by Alison Ames in 2008, polar bears showed deliberate and focused manipulation. For example, Ames observed bears putting objects in piles and then knocking them over in what appeared to be a game. The study demonstrates that bears are capable of agile and thought-out behaviours. These examples suggest bears have greater creativity and problem-solving abilities than previously thought."}, {"label": null, "text": "As for emotions, while the evidence is once again anecdotal, many bears have been seen to hit out at ice and snow - seemingly out of frustration - when they have just missed out on a kill. Moreover, polar bears can form unusual relationships with other species, including playing with the dogs used to pull sleds in the Arctic. Remarkably, one hand-raised polar bear called Agee has formed a close relationship with her owner Mark Dumas to the point where they even swim together. This is even more astonishing since polar bears are known to actively hunt humans in the wild."}, {"label": null, "text": "If climate change were to lead to their extinction, this would mean not only the loss of potential breakthroughs in human medicine, but more importantly, the disappearance of an intelligent, majestic animal."}], "groups": [{"kind": "tfng", "title": "Questions 1–7", "instr": "Do the following statements agree with the information given in Reading Passage 1? TRUE if the statement agrees with the information · FALSE if the statement contradicts the information · NOT GIVEN if there is no information on this.", "qs": [1, 2, 3, 4, 5, 6, 7]}, {"kind": "summary", "title": "Questions 8–13", "instr": "Complete the table below. Choose ONE WORD ONLY from the passage for each answer.", "qs": [8, 9, 10, 11, 12, 13], "summary": {"title": "Reasons why polar bears should be protected", "paras": ["People think of bears as unintelligent and {8}.", "However, this may not be correct. For example:", "In Tennoji Zoo, a bear has been seen using a branch as a {9}. This allowed him to knock down some {10}.", "A wild polar bear worked out a method of reaching a platform where a {11} was located.", "Polar bears have displayed behaviour such as conscious manipulation of objects and activity similar to a {12}.", "Bears may also display emotions. For example:", "They may make movements suggesting {13} if disappointed when hunting.", "They may form relationships with other species."], "styles": ["", "", "li", "li", "li", "", "li", "li"]}}]}, {"title": "The Step Pyramid of Djoser", "subtitle": null, "paras": [{"label": null, "sec": "A", "hq": 14, "text": "The pyramids are the most famous monuments of ancient Egypt and still hold enormous interest for people in the present day. These grand, impressive tributes to the memory of the Egyptian kings have become linked with the country even though other cultures, such as the Chinese and Mayan, also built pyramids. The evolution of the pyramid form has been written and argued about for centuries. However, there is no question that, as far as Egypt is concerned, it began with one monument to one king designed by one brilliant architect: the Step Pyramid of Djoser at Saqqara."}, {"label": null, "sec": "B", "hq": 15, "text": "Djoser was the first king of the Third Dynasty of Egypt and the first to build in stone. Prior to Djoser’s reign, tombs were rectangular monuments made of dried clay brick, which covered underground passages where the deceased person was buried. For reasons which remain unclear, Djoser’s main official, whose name was Imhotep, conceived of building a taller, more impressive tomb for his king by stacking stone slabs on top of one another, progressively making them smaller, to form the shape now known as the Step Pyramid. Djoser is thought to have reigned for 19 years, but some historians and scholars attribute a much longer time for his rule, owing to the number and size of the monuments he built."}, {"label": null, "sec": "C", "hq": 16, "text": "The Step Pyramid has been thoroughly examined and investigated over the last century, and it is now known that the building process went through many different stages. Historian Marc Van de Mieroop comments on this, writing ‘Much experimentation was involved, which is especially clear in the construction of the pyramid in the center of the complex. It had several plans … before it became the first Step Pyramid in history, piling six levels on top of one another … The weight of the enormous mass was a challenge for the builders, who placed the stones at an inward incline in order to prevent the monument breaking up.’"}, {"label": null, "sec": "D", "hq": 17, "text": "When finally completed, the Step Pyramid rose 62 meters high and was the tallest structure of its time. The complex in which it was built was the size of a city in ancient Egypt and included a temple, courtyards, shrines, and living quarters for the priests. It covered a region of 16 hectares and was surrounded by a wall 10.5 meters high. The wall had 13 false doors cut into it with only one true entrance cut into the south-east corner; the entire wall was then ringed by a trench 750 meters long and 40 meters wide. The false doors and the trench were incorporated into the complex to discourage unwanted visitors. If someone wished to enter, he or she would have needed to know in advance how to find the location of the true opening in the wall. Djoser was so proud of his accomplishment that he broke the tradition of having only his own name on the monument and had Imhotep’s name carved on it as well."}, {"label": null, "sec": "E", "hq": 18, "text": "The burial chamber of the tomb, where the king’s body was laid to rest, was dug beneath the base of the pyramid, surrounded by a vast maze of long tunnels that had rooms off them to discourage robbers. One of the most mysterious discoveries found inside the pyramid was a large number of stone vessels. Over 40,000 of these vessels, of various forms and shapes, were discovered in storerooms off the pyramid’s underground passages. They are inscribed with the names of rulers from the First and Second Dynasties of Egypt and made from different kinds of stone. There is no agreement among scholars and archaeologists on why the vessels were placed in the tomb of Djoser or what they were supposed to represent. The archaeologist Jean-Philippe Lauer, who excavated most of the pyramid and complex, believes they were originally stored and then given a ‘proper burial’ by Djoser in his pyramid to honor his predecessors. There are other historians, however, who claim the vessels were dumped into the shafts as yet another attempt to prevent grave robbers from getting to the king’s burial chamber."}, {"label": null, "sec": "F", "hq": 19, "text": "Unfortunately, all of the precautions and intricate design of the underground network did not prevent ancient robbers from finding a way in. Djoser’s grave goods, and even his body, were stolen at some point in the past and all archaeologists found were a small number of his valuables overlooked by the thieves. There was enough left throughout the pyramid and its complex, however, to astonish and amaze the archaeologists who excavated it."}, {"label": null, "sec": "G", "hq": 20, "text": "Egyptologist Miroslav Verner writes, ‘Few monuments hold a place in human history as significant as that of the Step Pyramid in Saqqara … It can be said without exaggeration that this pyramid complex constitutes a milestone in the evolution of monumental stone architecture in Egypt and in the world as a whole.’ The Step Pyramid was a revolutionary advance in architecture and became the archetype which all the other great pyramid builders of Egypt would follow."}], "groups": [{"kind": "match", "title": "Questions 14–20", "instr": "Reading Passage 2 has seven paragraphs, A–G. Choose the correct heading for each paragraph from the list of headings below. Write the correct number, i–ix. Mỗi ô nét đứt ở đầu đoạn hiển thị heading đúng; bấm vào ô để xem giải thích.", "qs": [14, 15, 16, 17, 18, 19, 20], "bank": {"title": "List of Headings", "items": ["The areas and artefacts within the pyramid itself", "A difficult task for those involved", "A king who saved his people", "A single certainty among other less definite facts", "An overview of the external buildings and areas", "A pyramid design that others copied", "An idea for changing the design of burial structures", "An incredible experience despite the few remains", "The answers to some unexpected questions"], "labels": ["i", "ii", "iii", "iv", "v", "vi", "vii", "viii", "ix"]}}, {"kind": "summary", "title": "Questions 21–24", "instr": "Complete the notes below. Choose ONE WORD ONLY from the passage for each answer.", "qs": [21, 22, 23, 24], "summary": {"title": "The Step Pyramid of Djoser", "paras": ["The complex that includes the Step Pyramid and its surroundings is considered to be as big as an Egyptian {21} of the past. The area outside the pyramid included accommodation that was occupied by {22}, along with many other buildings and features.", "A wall ran around the outside of the complex and a number of false entrances were built into this. In addition, a long {23} encircled the wall. As a result, any visitors who had not been invited were cleverly prevented from entering the pyramid grounds unless they knew the {24} of the real entrance."], "styles": ["", ""]}}, {"kind": "mcq2", "title": "Questions 25 and 26", "instr": "Choose TWO letters, A–E.", "qs": [25, 26]}]}, {"title": "The future of work", "subtitle": null, "paras": [{"label": null, "text": "According to a leading business consultancy, 3-14% of the global workforce will need to switch to a different occupation within the next 10-15 years, and all workers will need to adapt as their occupations evolve alongside increasingly capable machines. Automation - or ‘embodied artificial intelligence’ (AI) - is one aspect of the disruptive effects of technology on the labour market. ‘Disembodied AI’, like the algorithms running in our smartphones, is another."}, {"label": null, "text": "Dr Stella Pachidi from Cambridge Judge Business School believes that some of the most fundamental changes are happening as a result of the ‘algorithmication’ of jobs that are dependent on data rather than on production - the so-called knowledge economy. Algorithms are capable of learning from data to undertake tasks that previously needed human judgement, such as reading legal contracts, analysing medical scans and gathering market intelligence."}, {"label": null, "text": "‘In many cases, they can outperform humans,’ says Pachidi. ‘Organisations are attracted to using algorithms because they want to make choices based on what they consider is “perfect information”, as well as to reduce costs and enhance productivity.’"}, {"label": null, "text": "‘But these enhancements are not without consequences,’ says Pachidi. ‘If routine cognitive tasks are taken over by AI, how do professions develop their future experts?’ she asks. ‘One way of learning about a job is “legitimate peripheral participation” - a novice stands next to experts and learns by observation. If this isn’t happening, then you need to find new ways to learn.’"}, {"label": null, "text": "Another issue is the extent to which the technology influences or even controls the workforce. For over two years, Pachidi monitored a telecommunications company. ‘The way telecoms salespeople work is through personal and frequent contact with clients, using the benefit of experience to assess a situation and reach a decision. However, the company had started using a(n) … algorithm that defined when account managers should contact certain customers about which kinds of campaigns and what to offer them.’"}, {"label": null, "text": "The algorithm - usually built by external designers - often becomes the keeper of knowledge, she explains. In cases like this, Pachidi believes, a short-sighted view begins to creep into working practices whereby workers learn through the ‘algorithm’s eyes’ and become dependent on its instructions. Alternative explorations - where experimentation and human instinct lead to progress and new ideas - are effectively discouraged."}, {"label": null, "text": "Pachidi and colleagues even observed people developing strategies to make the algorithm work to their own advantage. ‘We are seeing cases where workers feed the algorithm with false data to reach their targets,’ she reports."}, {"label": null, "text": "It’s scenarios like these that many researchers are working to avoid. Their objective is to make AI technologies more trustworthy and transparent, so that organisations and individuals understand how AI decisions are made. In the meantime, says Pachidi, ‘We need to make sure we fully understand the dilemmas that this new world raises regarding expertise, occupational boundaries and control.’"}, {"label": null, "text": "Economist Professor Hamish Low believes that the future of work will involve major transitions across the whole life course for everyone: ‘The traditional trajectory of full-time education followed by full-time work followed by a pensioned retirement is a thing of the past,’ says Low. Instead, he envisages a multistage employment life: one where retraining happens across the life course, and where multiple jobs and no job happen by choice at different stages."}, {"label": null, "text": "On the subject of job losses, Low believes the predictions are founded on a fallacy: ‘It assumes that the number of jobs is fixed. If in 30 years, half of 100 jobs are being carried out by robots, that doesn’t mean we are left with just 50 jobs for humans. The number of jobs will increase: we would expect there to be 150 jobs.’"}, {"label": null, "text": "Dr Ewan McGaughey, at Cambridge’s Centre for Business Research and King’s College London, agrees that ‘apocalyptic’ views about the future of work are misguided. ‘It’s the laws that restrict the supply of capital to the job market, not the advent of new technologies that causes unemployment.’"}, {"label": null, "text": "His recently published research answers the question of whether automation, AI and robotics will mean a ‘jobless future’ by looking at the causes of unemployment. ‘History is clear that change can mean redundancies. But social policies can tackle this through retraining and redeployment.’"}, {"label": null, "text": "He adds: ‘If there is going to be change to jobs as a result of AI and robotics then I’d like to see governments seizing the opportunity to improve policy to enforce good job security. We can “reprogramme” the law to prepare for a fairer future of work and leisure.’ McGaughey’s findings are a call to arms to leaders of organisations, governments and banks to pre-empt the coming changes with bold new policies that guarantee full employment, fair incomes and a thriving economic democracy."}, {"label": null, "text": "‘The promises of these new technologies are astounding. They deliver humankind the capacity to live in a way that nobody could have once imagined,’ he adds. ‘Just as the industrial revolution brought people past subsistence agriculture, and the corporate revolution enabled mass production, a third revolution has been pronounced. But it will not only be one of technology. The next revolution will be social.’"}], "groups": [{"kind": "mcq", "title": "Questions 27–30", "instr": "Choose the correct letter, A, B, C or D.", "qs": [27, 28, 29, 30]}, {"kind": "wordlist", "title": "Questions 31–34", "instr": "Complete the summary using the list of words, A–G, below. Write the correct letter, A–G.", "qs": [31, 32, 33, 34], "summary": {"title": "The ‘algorithmication’ of jobs", "paras": ["Stella Pachidi of Cambridge Judge Business School has been focusing on the ‘algorithmication’ of jobs which rely not on production but on {31}.", "While monitoring a telecommunications company, Pachidi observed a growing {32} on the recommendations made by AI, as workers begin to learn through the ‘algorithm’s eyes’. Meanwhile, staff are deterred from experimenting and using their own {33}, and are therefore prevented from achieving innovation.", "To avoid the kind of situations which Pachidi observed, researchers are trying to make AI’s decision-making process easier to comprehend, and to increase users’ {34} with regard to the technology."]}, "bank": {"title": "List of Words", "items": ["pressure", "satisfaction", "intuition", "promotion", "reliance", "confidence", "information"]}}, {"kind": "match", "title": "Questions 35–40", "instr": "Look at the following statements (35–40) and the list of people below. Match each statement with the correct person, A, B or C. NB You may use any letter more than once.", "qs": [35, 36, 37, 38, 39, 40], "bank": {"title": "List of People", "items": ["Stella Pachidi", "Hamish Low", "Ewan McGaughey"]}}]}], "questions": {"1": {"exp": "Paragraph 1: “Humans with comparative levels of adipose tissue would be considered obese and would be likely to suffer from diabetes and heart disease. Yet the polar bear experiences no such consequences” → gấu Bắc Cực KHÔNG gặp vấn đề sức khỏe nào do lớp mỡ dưới da, trái với câu hỏi (suffer from various health problems) → FALSE.", "ev": [{"p": 0, "s": 252, "e": 531, "hl": [[479, 530]], "blue": []}], "ansShow": "FALSE", "text": "Polar bears suffer from various health problems due to the build-up of fat under their skin.", "qhl": [[12, 47], [48, 91]]}, "2": {"exp": "Paragraph 2: “They compared the genetic structure of polar bears with that of their closest relatives from a warmer climate, the brown bears” → nghiên cứu so sánh gấu Bắc Cực với gấu nâu, KHÔNG phải so sánh các nhóm gấu Bắc Cực khác nhau → FALSE.", "ev": [{"p": 1, "s": 73, "e": 200, "hl": [[78, 199]], "blue": []}], "ansShow": "FALSE", "text": "The study done by Liu and his colleagues compared different groups of polar bears.", "qhl": [[41, 81]]}, "3": {"exp": "Paragraph 2 chỉ nói nghiên cứu năm 2014 của Liu và đồng nghiệp so sánh gen của gấu Bắc Cực với gấu nâu. Bài KHÔNG nói họ là những nhà nghiên cứu đầu tiên làm việc này (the first researchers) → NOT GIVEN.", "ev": [{"p": 1, "s": 0, "e": 200, "hl": [[0, 43]], "blue": []}], "ansShow": "NOT GIVEN", "text": "Liu and colleagues were the first researchers to compare polar bears and brown bears genetically.", "qhl": [[19, 96]]}, "4": {"exp": "Paragraph 2: “polar bears had a gene known as APoB, which reduces levels of low-density lipoproteins (LDLs) - a form of ‘bad’ cholesterol” → gấu Bắc Cực kiểm soát (giảm) lượng cholesterol xấu nhờ một gen (by genetic means) → TRUE.", "ev": [{"p": 1, "s": 329, "e": 486, "hl": [[378, 485]], "blue": []}], "ansShow": "TRUE", "text": "Polar bears are able to control their levels of ‘bad’ cholesterol by genetic means.", "qhl": [[24, 82]]}, "5": {"exp": "Paragraph 3: “This process results in about six months of fasting, where the female bears have to keep themselves and their cubs alive” → gấu cái nhịn ăn khoảng sáu tháng mà vẫn sống sót (fasting ≈ without food; keep … alive ≈ survive) → TRUE.", "ev": [{"p": 2, "s": 521, "e": 860, "hl": [[713, 809]], "blue": []}], "ansShow": "TRUE", "text": "Female polar bears are able to survive for about six months without food.", "qhl": [[31, 72]]}, "6": {"exp": "Paragraph 4: “when they finally emerged from the den with their cubs, there was no evidence of significant loss of bone density” (và Paragraph 3: “Despite this, their bones remain strong and dense”) → xương của gấu cái KHÔNG yếu khi chúng rời hang → FALSE.", "ev": [{"p": 3, "s": 220, "e": 365, "hl": [[307, 364]], "blue": []}], "ansShow": "FALSE", "text": "It was found that the bones of female polar bears were very weak when they came out of their dens in spring.", "qhl": [[18, 64], [75, 107]]}, "7": {"exp": "Paragraph 4: gấu cái tăng mật độ xương trước khi làm hang; “If the mechanism of bone remodelling in polar bears can be understood, many bedridden humans, and even astronauts, could potentially benefit” → cơ chế này có thể giúp ích cho con người trong tương lai (one day ≈ potentially) → TRUE.", "ev": [{"p": 3, "s": 94, "e": 634, "hl": [[115, 178], [493, 633]], "blue": []}], "ansShow": "TRUE", "text": "The polar bear’s mechanism for increasing bone density could also be used by people one day.", "qhl": [[17, 54], [55, 91]]}, "8": {"exp": "Paragraph 5: “Bears, on the other hand, seem to be perceived as stupid and in many cases violent” → People think of bears as unintelligent (≈ stupid) and {8} ≈ violent. Chỗ trống cần tính từ đứng sau “and” → violent.", "ev": [{"p": 4, "s": 180, "e": 377, "hl": [[320, 376]], "blue": []}], "ansShow": "violent", "gapShow": "violent", "qp": 0, "qhl": [[0, 42]]}, "9": {"exp": "Paragraph 5: “A male bear called GoGo in Tennoji Zoo, Osaka, has even been observed making use of a tool to manipulate his environment. The bear used a tree branch …” → a bear has been seen using a branch as a {9} ≈ making use of a tool (a tree branch = a tool). Sau mạo từ “a” cần danh từ số ít → tool.", "ev": [{"p": 4, "s": 527, "e": 749, "hl": [[574, 647], [649, 676]], "blue": []}], "ansShow": "tool", "gapShow": "tool", "qp": 2, "qhl": [[0, 56]]}, "10": {"exp": "Paragraph 5: “The bear used a tree branch on multiple occasions to dislodge a piece of meat hung out of his reach” → This allowed him to knock down some {10} ≈ dislodge a piece of meat (dislodge ≈ knock down). Đáp án: meat.", "ev": [{"p": 4, "s": 649, "e": 749, "hl": [[699, 748]], "blue": []}], "ansShow": "meat", "gapShow": "meat", "qp": 2, "qhl": [[62, 97]]}, "11": {"exp": "Paragraph 5: “A calculated move by a male bear involved running and jumping onto barrels in an attempt to get to a photographer standing on a platform four metres high” → A wild polar bear worked out a method of reaching a platform where a {11} was located ≈ a photographer standing on a platform. Đáp án: photographer.", "ev": [{"p": 4, "s": 750, "e": 1013, "hl": [[901, 1012]], "blue": []}], "ansShow": "photographer", "gapShow": "photographer", "qp": 3, "qhl": [[0, 68], [74, 85]]}, "12": {"exp": "Paragraph 6: “Ames observed bears putting objects in piles and then knocking them over in what appeared to be a game” → behaviour such as conscious manipulation of objects (≈ deliberate and focused manipulation) and activity similar to a {12} ≈ in what appeared to be a game. Đáp án: game.", "ev": [{"p": 5, "s": 0, "e": 226, "hl": [[54, 108], [177, 225]], "blue": []}], "ansShow": "game", "gapShow": "game", "qp": 4, "qhl": [[45, 78], [83, 104]]}, "13": {"exp": "Paragraph 7: “many bears have been seen to hit out at ice and snow - seemingly out of frustration - when they have just missed out on a kill” → movements suggesting {13} if disappointed when hunting ≈ hit out … out of frustration when they have just missed out on a kill. Đáp án: frustration.", "ev": [{"p": 6, "s": 61, "e": 188, "hl": [[90, 187]], "blue": []}], "ansShow": "frustration", "gapShow": "frustration", "qp": 6, "qhl": [[0, 34], [40, 68]]}, "14": {"exp": "Paragraph A: tác giả nói nguồn gốc kim tự tháp “has been written and argued about for centuries” (nhiều điều còn tranh cãi), nhưng “there is no question that, as far as Egypt is concerned, it began with one monument to one king designed by one brilliant architect” → một điều chắc chắn (single certainty) giữa những thông tin kém rõ ràng hơn ≈ iv. A single certainty among other less definite facts.", "ev": [{"p": 0, "s": 309, "e": 572, "hl": [[343, 390], [401, 532]], "blue": []}], "ansShow": "iv — A single certainty among other less definite facts", "hdText": "iv. A single certainty among other less definite facts", "text": "Paragraph A", "qhl": []}, "15": {"exp": "Paragraph B: trước Djoser, mộ là “rectangular monuments made of dried clay brick”; Imhotep “conceived of building a taller, more impressive tomb for his king by stacking stone slabs on top of one another, progressively making them smaller” → một ý tưởng thay đổi thiết kế công trình mai táng ≈ vii. An idea for changing the design of burial structures.", "ev": [{"p": 1, "s": 89, "e": 524, "hl": [[114, 171], [328, 439]], "blue": []}], "ansShow": "vii — An idea for changing the design of burial structures", "hdText": "vii. An idea for changing the design of burial structures", "text": "Paragraph B", "qhl": []}, "16": {"exp": "Paragraph C: “Much experimentation was involved … The weight of the enormous mass was a challenge for the builders, who placed the stones at an inward incline in order to prevent the monument breaking up” → công việc khó khăn đối với những người tham gia xây dựng ≈ ii. A difficult task for those involved.", "ev": [{"p": 2, "s": 225, "e": 623, "hl": [[225, 258], [468, 532]], "blue": []}], "ansShow": "ii — A difficult task for those involved", "hdText": "ii. A difficult task for those involved", "text": "Paragraph C", "qhl": []}, "17": {"exp": "Paragraph D: mô tả khu phức hợp bên ngoài kim tự tháp: “a temple, courtyards, shrines, and living quarters for the priests”, diện tích 16 hecta, tường cao 10,5 m với 13 cửa giả, hào dài 750 m → tổng quan các công trình và khu vực bên ngoài ≈ v. An overview of the external buildings and areas.", "ev": [{"p": 3, "s": 104, "e": 619, "hl": [[182, 257], [302, 339], [476, 519]], "blue": []}], "ansShow": "v — An overview of the external buildings and areas", "hdText": "v. An overview of the external buildings and areas", "text": "Paragraph D", "qhl": []}, "18": {"exp": "Paragraph E: mô tả bên trong kim tự tháp: buồng chôn cất, “a vast maze of long tunnels”, hơn 40.000 bình đá tìm thấy trong các kho (“stone vessels”) → các khu vực và hiện vật bên trong kim tự tháp ≈ i. The areas and artefacts within the pyramid itself. (ix không đúng vì bài nói “There is no agreement among scholars” – các câu hỏi vẫn chưa có lời giải.)", "ev": [{"p": 4, "s": 0, "e": 431, "hl": [[0, 30], [113, 154], [270, 301]], "blue": []}], "ansShow": "i — The areas and artefacts within the pyramid itself", "hdText": "i. The areas and artefacts within the pyramid itself", "text": "Paragraph E", "qhl": []}, "19": {"exp": "Paragraph F: kẻ trộm đã lấy mất đồ tùy táng và cả thi thể (“all of the precautions … did not prevent ancient robbers”), chỉ còn lại vài vật có giá trị – nhưng “There was enough left throughout the pyramid and its complex … to astonish and amaze the archaeologists” → trải nghiệm đáng kinh ngạc dù còn ít di vật ≈ viii. An incredible experience despite the few remains.", "ev": [{"p": 5, "s": 141, "e": 442, "hl": [[254, 311], [384, 441]], "blue": []}], "ansShow": "viii — An incredible experience despite the few remains", "hdText": "viii. An incredible experience despite the few remains", "text": "Paragraph F", "qhl": []}, "20": {"exp": "Paragraph G: “The Step Pyramid was a revolutionary advance in architecture and became the archetype which all the other great pyramid builders of Egypt would follow” → thiết kế kim tự tháp mà những người khác sao chép theo ≈ vi. A pyramid design that others copied.", "ev": [{"p": 6, "s": 313, "e": 464, "hl": [[378, 463]], "blue": []}], "ansShow": "vi — A pyramid design that others copied", "hdText": "vi. A pyramid design that others copied", "text": "Paragraph G", "qhl": []}, "21": {"exp": "Paragraph D: “The complex in which it was built was the size of a city in ancient Egypt” → as big as an Egyptian {21} of the past ≈ the size of a city in ancient Egypt. Sau “an Egyptian” cần danh từ → city.", "ev": [{"p": 3, "s": 104, "e": 177, "hl": [[138, 177]], "blue": []}], "ansShow": "city", "gapShow": "city", "qp": 0, "qhl": [[64, 105], [111, 122]]}, "22": {"exp": "Paragraph D: “The complex … included a temple, courtyards, shrines, and living quarters for the priests” → accommodation that was occupied by {22} ≈ living quarters for the priests. Đáp án: priests.", "ev": [{"p": 3, "s": 182, "e": 258, "hl": [[226, 257]], "blue": []}], "ansShow": "priests", "gapShow": "priests", "qp": 0, "qhl": [[153, 196]]}, "23": {"exp": "Paragraph D: “the entire wall was then ringed by a trench 750 meters long and 40 meters wide” → a long {23} encircled the wall ≈ ringed by a trench 750 meters long (ringed ≈ encircled). Đáp án: trench.", "ev": [{"p": 3, "s": 441, "e": 520, "hl": [[441, 519]], "blue": []}], "ansShow": "trench", "gapShow": "trench", "qp": 1, "qhl": [[112, 118], [124, 142]]}, "24": {"exp": "Paragraph D: “If someone wished to enter, he or she would have needed to know in advance how to find the location of the true opening in the wall” → visitors who had not been invited were prevented from entering unless they knew the {24} of the real entrance ≈ the location of the true opening. Đáp án: location.", "ev": [{"p": 3, "s": 620, "e": 752, "hl": [[695, 751]], "blue": []}], "ansShow": "location", "gapShow": "location", "qp": 1, "qhl": [[253, 273], [279, 299]]}, "25": {"exp": "Paragraph B: “Djoser is thought to have reigned for 19 years, but some historians and scholars attribute a much longer time for his rule” → B. There is disagreement concerning the length of his reign (có tranh cãi về thời gian trị vì). Paragraph F: “all archaeologists found were a small number of his valuables overlooked by the thieves” → D. A few of his possessions were still in his tomb when archaeologists found it. A, C, E không đúng (xem giải thích từng phương án).", "ev": [{"p": 1, "s": 525, "e": 647, "hl": [[525, 647]], "blue": []}, {"p": 5, "s": 141, "e": 312, "hl": [[224, 311]], "blue": []}], "ansShow": "B, D", "text": "Which TWO of the following points does the writer make about King Djoser?", "opts": ["Initially he had to be persuaded to build in stone rather than clay.", "There is disagreement concerning the length of his reign.", "He failed to appreciate Imhotep’s part in the design of the Step Pyramid.", "A few of his possessions were still in his tomb when archaeologists found it.", "He criticised the design and construction of other pyramids in Egypt."], "correctIdxs": [1, 3], "optExp": ["Sai: bài không nói Djoser phải được thuyết phục xây bằng đá; Imhotep là người “conceived of building a taller, more impressive tomb” bằng đá.", "Đúng: “some historians and scholars attribute a much longer time for his rule” ≈ có tranh cãi về thời gian trị vì của ông.", "Sai: ngược lại, Djoser “broke the tradition of having only his own name on the monument and had Imhotep’s name carved on it as well” → ông đánh giá cao vai trò của Imhotep.", "Đúng: “all archaeologists found were a small number of his valuables overlooked by the thieves” ≈ vài tài sản của ông vẫn còn trong mộ khi các nhà khảo cổ tìm thấy.", "Sai: bài không nói Djoser chỉ trích thiết kế hay cách xây các kim tự tháp khác; chỉ nói kim tự tháp của ông là hình mẫu cho các kim tự tháp sau này."], "ohls": [null, [0, 56], null, [0, 76], null], "qhl": []}, "27": {"exp": "Paragraph 1: “3-14% of the global workforce will need to switch to a different occupation within the next 10-15 years, and all workers will need to adapt as their occupations evolve alongside increasingly capable machines” → AI sẽ làm thay đổi bản chất (nature) công việc của con người ở mức độ nào (B).", "ev": [{"p": 0, "s": 0, "e": 253, "hl": [[45, 120], [154, 252]], "blue": []}], "ansShow": "B — the extent to which AI will alter the nature of the work that people do.", "text": "The first paragraph tells us about", "opts": ["the kinds of jobs that will be most affected by the growth of AI.", "the extent to which AI will alter the nature of the work that people do.", "the proportion of the world’s labour force who will have jobs in AI in the future.", "the difference between ways that embodied and disembodied AI will impact on workers."], "optExp": ["Sai: đoạn 1 không nêu loại công việc nào sẽ bị ảnh hưởng nhiều nhất.", "Đúng: số người phải đổi nghề và “all workers will need to adapt as their occupations evolve” ≈ mức độ AI thay đổi bản chất công việc.", "Sai: con số 3–14% là tỷ lệ lao động phải chuyển nghề, không phải tỷ lệ lao động sẽ làm việc trong lĩnh vực AI.", "Sai: đoạn 1 chỉ nhắc tới hai dạng AI (embodied và disembodied) chứ không so sánh tác động của chúng lên người lao động."], "correctIdx": 1, "qhl": [], "ohl": [0, 71]}, "28": {"exp": "Paragraph 2: “Dr Stella Pachidi … believes that some of the most fundamental changes are happening as a result of the ‘algorithmication’ of jobs that are dependent on data rather than on production - the so-called knowledge economy” → knowledge economy là yếu tố then chốt thúc đẩy những thay đổi hiện nay ở nơi làm việc (D).", "ev": [{"p": 1, "s": 0, "e": 253, "hl": [[69, 252]], "blue": [[10, 17]]}], "ansShow": "D — It is a key factor driving current developments in the workplace.", "text": "According to the second paragraph, what is Stella Pachidi’s view of the ‘knowledge economy’?", "opts": ["It is having an influence on the number of jobs available.", "It is changing people’s attitudes towards their occupations.", "It is the main reason why the production sector is declining.", "It is a key factor driving current developments in the workplace."], "optExp": ["Sai: bài không nói knowledge economy ảnh hưởng đến số lượng việc làm.", "Sai: bài không nói nó thay đổi thái độ của mọi người đối với nghề nghiệp.", "Sai: bài không nói đây là lý do chính khiến ngành sản xuất suy giảm.", "Đúng: “some of the most fundamental changes are happening as a result of the ‘algorithmication’ of jobs” ≈ a key factor driving current developments in the workplace."], "correctIdx": 3, "qhl": [], "ohl": [6, 64]}, "29": {"exp": "Paragraph 7: “Pachidi and colleagues even observed people developing strategies to make the algorithm work to their own advantage. ‘We are seeing cases where workers feed the algorithm with false data to reach their targets’” → nhân viên làm cho AI cho ra kết quả mà họ muốn (C).", "ev": [{"p": 6, "s": 0, "e": 224, "hl": [[28, 115], [144, 209]], "blue": [[0, 7]]}], "ansShow": "C — Staff making sure that AI produces the results that they want.", "text": "What did Pachidi observe at the telecommunications company?", "opts": ["Staff disagreeing with the recommendations of AI.", "Staff feeling resentful about the intrusion of AI in their work.", "Staff making sure that AI produces the results that they want.", "Staff allowing AI to carry out tasks they ought to do themselves."], "optExp": ["Sai: nhân viên không phản đối các khuyến nghị của AI; họ “become dependent on its instructions”.", "Sai: bài không nói nhân viên bực bội vì AI xen vào công việc.", "Đúng: “feed the algorithm with false data to reach their targets” ≈ staff making sure that AI produces the results that they want.", "Sai: bài nói họ phụ thuộc vào hướng dẫn của thuật toán, không nói họ để AI làm những việc họ lẽ ra phải tự làm."], "correctIdx": 2, "qhl": [], "ohl": [0, 62]}, "30": {"exp": "Paragraph 12: “‘History is clear that change can mean redundancies. But social policies can tackle this through retraining and redeployment’” → nghiên cứu của McGaughey cho thấy những thay đổi của thị trường lao động có thể được xử lý thành công (D).", "ev": [{"p": 11, "s": 0, "e": 289, "hl": [[220, 287]], "blue": [[0, 3]]}], "ansShow": "D — illustrates how changes in the job market can be successfully handled.", "text": "In his recently published research, Ewan McGaughey", "opts": ["challenges the idea that redundancy is a negative thing.", "shows the profound effect of mass unemployment on society.", "highlights some differences between past and future job losses.", "illustrates how changes in the job market can be successfully handled."], "optExp": ["Sai: ông thừa nhận “change can mean redundancies”, không phản bác việc sa thải là điều tiêu cực.", "Sai: bài không nói về tác động sâu sắc của thất nghiệp hàng loạt đối với xã hội.", "Sai: bài không so sánh việc mất việc trong quá khứ và tương lai.", "Đúng: “social policies can tackle this through retraining and redeployment” ≈ illustrates how changes in the job market can be successfully handled."], "correctIdx": 3, "qhl": [], "ohl": [0, 70]}, "31": {"exp": "Paragraph 2: “‘algorithmication’ of jobs that are dependent on data rather than on production” → jobs which rely not on production but on {31} ≈ dependent on data (data ≈ information). Sau “on” cần danh từ → G. information.", "ev": [{"p": 1, "s": 135, "e": 253, "hl": [[161, 218]], "blue": []}], "ansShow": "G (information)", "gapShow": "G · information", "qp": 0, "qhl": [[108, 137]]}, "32": {"exp": "Paragraph 6: “workers learn through the ‘algorithm’s eyes’ and become dependent on its instructions” → a growing {32} on the recommendations made by AI ≈ become dependent on its instructions (dependent ≈ reliance; instructions ≈ recommendations). Sau “growing” + trước “on” → E. reliance.", "ev": [{"p": 5, "s": 107, "e": 299, "hl": [[213, 298]], "blue": [[127, 134]]}], "ansShow": "E (reliance)", "gapShow": "E · reliance", "qp": 1, "qhl": [[64, 73], [79, 112], [134, 170]]}, "33": {"exp": "Paragraph 6: “Alternative explorations - where experimentation and human instinct lead to progress and new ideas - are effectively discouraged” → staff are deterred from experimenting and using their own {33} ≈ human instinct (instinct ≈ intuition); prevented from achieving innovation ≈ progress and new ideas. → C. intuition.", "ev": [{"p": 5, "s": 300, "e": 429, "hl": [[333, 398], [401, 428]], "blue": []}], "ansShow": "C (intuition)", "gapShow": "C · intuition", "qp": 1, "qhl": [[193, 240], [265, 300]]}, "34": {"exp": "Paragraph 8: “Their objective is to make AI technologies more trustworthy and transparent, so that organisations and individuals understand how AI decisions are made” → make AI’s decision-making process easier to comprehend (≈ transparent, understand how AI decisions are made) and increase users’ {34} (trustworthy ≈ confidence) → F. confidence.", "ev": [{"p": 7, "s": 70, "e": 222, "hl": [[92, 145], [185, 221]], "blue": []}], "ansShow": "F (confidence)", "gapShow": "F · confidence", "qp": 2, "qhl": [[82, 136], [145, 160]]}, "35": {"exp": "Paragraph 10 – Hamish Low: “If in 30 years, half of 100 jobs are being carried out by robots, that doesn’t mean we are left with just 50 jobs for humans. The number of jobs will increase: we would expect there to be 150 jobs” → tự động hóa nhiều hơn KHÔNG làm giảm việc làm. (McGaughey nói thất nghiệp do luật pháp chứ không do công nghệ mới, nhưng không nêu rằng tự động hóa sẽ không làm giảm số việc làm như Low.)", "ev": [{"p": 9, "s": 0, "e": 329, "hl": [[197, 255], [257, 327]], "blue": [[30, 33]]}], "ansShow": "B — Hamish Low", "text": "Greater levels of automation will not result in lower employment.", "qhl": [[0, 28], [29, 64]]}, "36": {"exp": "Paragraph 3 – Stella Pachidi: “Organisations are attracted to using algorithms because they want to make choices based on what they consider is ‘perfect information’, as well as to reduce costs and enhance productivity” → có nhiều lý do khiến AI hấp dẫn doanh nghiệp: thông tin “hoàn hảo”, giảm chi phí, tăng năng suất.", "ev": [{"p": 2, "s": 60, "e": 248, "hl": [[60, 194], [207, 247]], "blue": [[50, 57]]}], "ansShow": "A — Stella Pachidi", "text": "There are several reasons why AI is appealing to businesses.", "qhl": [[10, 59]]}, "37": {"exp": "Paragraph 14 – Ewan McGaughey: “Just as the industrial revolution brought people past subsistence agriculture, and the corporate revolution enabled mass production, a third revolution has been pronounced” → tiềm năng thay đổi cuộc sống của AI được so sánh với các cuộc cách mạng lớn trong quá khứ (industrial revolution, corporate revolution) ≈ parallels with major cultural shifts in previous eras.", "ev": [{"p": 13, "s": 0, "e": 409, "hl": [[56, 145], [158, 329]], "blue": [[148, 150]]}], "ansShow": "C — Ewan McGaughey", "text": "AI’s potential to transform people’s lives has parallels with major cultural shifts which occurred in previous eras.", "qhl": [[0, 42], [62, 115]]}, "38": {"exp": "Paragraph 8 – Stella Pachidi: “We need to make sure we fully understand the dilemmas that this new world raises regarding expertise, occupational boundaries and control” (và Paragraph 4: “these enhancements are not without consequences”) → cần nhận thức rõ phạm vi các vấn đề do AI gây ra.", "ev": [{"p": 7, "s": 223, "e": 394, "hl": [[255, 392]], "blue": [[245, 252]]}], "ansShow": "A — Stella Pachidi", "text": "It is important to be aware of the range of problems that AI causes.", "qhl": [[6, 67]]}, "39": {"exp": "Paragraph 9 – Hamish Low: “The traditional trajectory of full-time education followed by full-time work followed by a pensioned retirement is a thing of the past … he envisages a multistage employment life” → con đường sự nghiệp của mọi người sẽ ít theo lối truyền thống hơn trước (less conventional ≈ not the traditional trajectory).", "ev": [{"p": 8, "s": 0, "e": 463, "hl": [[139, 273], [295, 336]], "blue": [[27, 30]]}], "ansShow": "B — Hamish Low", "text": "People are going to follow a less conventional career path than in the past.", "qhl": [[27, 75]]}, "40": {"exp": "Paragraph 13 – Ewan McGaughey: “McGaughey’s findings are a call to arms to leaders of organisations, governments and banks to pre-empt the coming changes with bold new policies that guarantee full employment, fair incomes and a thriving economic democracy” → chính quyền cần có biện pháp bảo đảm việc làm được trả lương xứng đáng cho mọi người (full employment, fair incomes).", "ev": [{"p": 12, "s": 267, "e": 491, "hl": [[361, 456]], "blue": [[267, 276]]}], "ansShow": "C — Ewan McGaughey", "text": "Authorities should take measures to ensure that there will be adequately paid work for everyone.", "qhl": [[0, 32], [62, 95]]}}};

ch.", "core": true}, {"part": 2, "hw": "envisage", "pos": "v", "f": ["envisages", "envisage"], "vn": "hình dung, dự tính", "ex": "Few people envisaged such rapid change.", "core": true}, {"part": 2, "hw": "fallacy", "pos": "n", "f": ["fallacy"], "vn": "ngụy biện, quan niệm sai lầm", "ex": "It is a fallacy that more work always means more profit.", "core": true}, {"part": 2, "hw": "apocalyptic", "pos": "adj", "f": ["apocalyptic"], "vn": "mang tính tận thế", "ex": "The film paints an apocalyptic vision of the future.", "core": true}, {"part": 2, "hw": "redundancy", "pos": "n", "f": ["redundancies", "redundancy"], "vn": "sự dôi dư, sa thải do cắt giảm nhân sự", "ex": "The company announced 200 redundancies.", "core": true}, {"part": 2, "hw": "redeployment", "pos": "n", "f": ["redeployment"], "vn": "sự điều chuyển sang vị trí khác", "ex": "Staff were offered retraining and redeployment.", "core": true}, {"part": 2, "hw": "pre-empt", "pos": "v", "f": ["pre-empt"], "vn": "đón đầu, ngăn chặn từ trước", "ex": "The government acted to pre-empt a financial crisis.", "core": true}, {"part": 2, "hw": "subsistence", "pos": "n", "f": ["subsistence"], "vn": "sự tự cung tự cấp, mức sống tối thiểu", "ex": "Many families live by subsistence farming.", "core": false}, {"part": 2, "hw": "legitimate", "pos": "adj", "f": ["legitimate"], "vn": "chính đáng, hợp pháp", "ex": "He has a legitimate reason for being absent.", "core": false}, {"part": 2, "hw": "trustworthy", "pos": "adj", "f": ["trustworthy"], "vn": "đáng tin cậy", "ex": "We need trustworthy sources of information.", "core": false}, {"part": 2, "hw": "dilemma", "pos": "n", "f": ["dilemmas", "dilemma"], "vn": "tình thế tiến thoái lưỡng nan", "ex": "The new technology raises serious ethical dilemmas.", "core": false}, {"part": 2, "hw": "enhance", "pos": "v", "f": ["enhance", "enhancements"], "vn": "nâng cao, tăng cường", "ex": "The software is designed to enhance productivity.", "core": false}];
