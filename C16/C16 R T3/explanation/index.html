<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C16 R T3 Correction</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/theme.css">
<style>
:root{
  color-scheme:light;
  --font-heading:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;
  --brand:#15934E;--brand-dark:#119446;--brand-tint:#ECF6F1;
  --bg:#f5f6f5;--card:#ffffff;--text:#202020;--muted:#6f7771;--line:#dce0dc;--soft:#f4f5f3;--edge:#b2ada3;--focus:#8a7534;
  --gold:#ffe563;--goldtext:#000000;
  --ref:#2563EB;--ref-strong:#1D4ED8;--ref-bg:#2563eb1f;
  --ctx-bg:#fbe4e1;--ctx-border:#000000;
  --shadow:0 8px 28px #24312a12;
  --correct-bg:#e3f4ea;--wrong-bg:#fdecea;--wrong:#c0392b;
}
[data-theme=dark]{
  color-scheme:dark;
  --brand:#34D399;--brand-dark:#10B981;--brand-tint:#113124;
  --bg:#191b1a;--card:#222523;--text:#eeeeee;--muted:#afb7b0;--line:#404640;--soft:#292d29;--edge:#867f73;--focus:#d2b960;
  --ctx-bg:#4b2a28;--ctx-border:#e6e6e6;
  --ref:#60A5FA;--ref-bg:#3b82f633;
  --shadow:0 8px 28px #0006;
  --correct-bg:#173a29;--wrong-bg:#3a1f20;--wrong:#ef5350;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.65 Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--edge)}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- header ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px;padding:12px 26px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--brand)}
h1{margin:2px 0 0;font:700 21px/1.25 var(--font-heading)}
header small{color:var(--muted);font-size:12.5px}
.toolbar{display:flex;gap:10px}

/* ---------- pages / panes ---------- */
.page{display:none}
.page.active{display:block}
.workspace{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;padding:18px 22px 108px;height:calc(100vh - 84px)}
.pane{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-y:auto;padding:22px 26px;min-height:0}
.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--brand)}
.passage-title{margin:4px 0 8px;font:700 24px/1.3 var(--font-heading)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 16px;font-size:12.5px;color:var(--muted);align-items:center}
.legend .lg-box{display:inline-block;width:18px;height:12px;vertical-align:-1px;margin-right:6px;background:var(--ctx-bg);border:1px solid var(--ctx-border);border-radius:3px}
.legend mark.answer-hl{padding:0 4px}

/* ---------- passage paragraphs ---------- */
.passage-p{margin:0 0 14px;padding:10px 12px 8px;border-radius:12px;border-left:3px solid transparent;scroll-margin-top:12px}
.passage-p.active-context{border-left-color:var(--brand);background:var(--soft)}
.paragraph-text{font-size:17.5px;line-height:1.85;text-align:left;color:var(--text)}

/* Paragraph labels — SAME values as the Test file (size / weight / shape / colour) */
.para-label{
  display:flex;align-items:center;width:fit-content;
  font-family:var(--font-heading);font-size:16px;font-weight:700;letter-spacing:.02em;line-height:1.3;
  color:var(--brand-dark);background:var(--brand-tint);border:1px solid var(--brand);border-radius:999px;
  padding:4px 14px;margin:4px 0 10px 0;text-align:left;-webkit-user-select:none;user-select:none;
}

/* Layer 1: Context Box — thin black rectangle, light-red fill, around the whole context.
   Layer 2: Answer Highlight — yellow, black text, only the decisive words. Both show together. */
.context-box{
  display:block;margin:8px 0;padding:9px 14px;
  background:var(--ctx-bg);border:1px solid var(--ctx-border);border-radius:6px;
}
mark.answer-hl{background:var(--gold);color:var(--goldtext);border-radius:4px;padding:1px 3px;font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone}
/* Layer 3 (Matching Names only): person / reference chain — medium blue, never green, never louder than the yellow */
.ref-name{color:var(--ref);background:var(--ref-bg);border-bottom:2px solid var(--ref);border-radius:3px;padding:0 2px;font-weight:700}
mark.answer-hl .ref-name{color:var(--ref-strong);background:transparent}
[data-theme=dark] mark.answer-hl .ref-name{color:#1D4ED8}
.legend .ref-name{font-weight:700}

/* ---------- question pane ---------- */
.hint{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.section-title{font:700 18px/1.4 var(--font-heading);border-bottom:1px solid var(--line);border-left:3px solid var(--brand);padding:6px 0 6px 10px;margin:22px 0 6px}
.section-title:first-of-type{margin-top:6px}
.q-instr{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.word-box{margin:10px 0 14px;border:1px solid var(--edge);border-radius:8px;overflow:hidden;background:var(--soft)}
.word-box-title{padding:8px 12px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:1.4px;font-weight:700}
.word-options{border-collapse:collapse;width:100%;table-layout:fixed;font-size:14px}
.word-options td{width:50%;border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;overflow-wrap:anywhere}
.word-options td+td{border-left:1px solid var(--line)}
.word-options tr:last-child td{border-bottom:0}
.option-letter{display:inline-block;font-size:12px;font-weight:700;min-width:22px;color:var(--focus)}

.question-block{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px;background:var(--card);transition:border-color .18s,box-shadow .18s}
.question-block:hover{border-color:var(--edge)}
.question-block.active-question{border:1.5px solid var(--brand);box-shadow:0 0 0 5px #15934e0f}
.question-block p{margin:0 0 8px}
.question-number{display:inline-block;background:#202020;color:#fff;border-radius:6px;padding:1px 8px;margin-right:6px;font-weight:700;line-height:1.6}
[data-theme=dark] .question-number{background:#e7e7e7;color:#202020}
.q-label{font-size:12.5px;color:var(--muted)}
.btn-answer{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;padding:5px 14px;border-radius:8px;font-size:13.5px}
[data-theme=dark] .btn-answer{color:#0b1a12}
.btn-answer:hover{filter:brightness(1.1);border-color:var(--brand)}
.explanation-box{display:none;margin-top:10px;padding:10px 14px;background:var(--soft);border-left:3px solid var(--brand);border-radius:8px;font-size:14.5px}
.explanation-box.show{display:block}
.explanation-box .ans{font-weight:700}
.explanation-box p{margin:6px 0 0}

/* MCQ */
.choice-item{border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:7px 0;cursor:pointer;font-size:14.5px;display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap}
.choice-item:hover{border-color:var(--edge)}
.choice-item .cl{display:inline-flex;align-items:center;justify-content:center;flex:0 0 26px;width:26px;height:26px;border:1.5px solid var(--edge);border-radius:50%;font-weight:600;font-size:12.5px;color:var(--muted)}
.choice-item .ct{flex:1 1 200px}
.choice-item.selected{border-color:var(--brand);box-shadow:0 0 0 2px #15934e14}
.choice-item.is-correct{border-color:var(--brand);background:var(--correct-bg)}
.choice-item.is-correct .cl{background:var(--brand);border-color:var(--brand);color:#fff}
.choice-item.is-wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.mcq-info-box{display:none;flex-basis:100%;margin:4px 0 0 35px;padding:7px 10px;border-left:2px solid var(--edge);background:var(--soft);border-radius:6px;font-size:13.5px}
.mcq-info-box.show{display:block}

/* summary with gaps — inline correction */
.gap-wrap{white-space:nowrap}
.ans-btn{display:inline;font-size:11.5px;font-weight:700;line-height:1.5;padding:0 7px;margin-left:3px;border-radius:6px;color:var(--brand-dark);background:var(--brand-tint);border:1px solid var(--brand);vertical-align:baseline}
.ans-btn:hover{filter:brightness(.96);border-color:var(--brand)}
.ans-btn[aria-expanded=true]{background:var(--brand);color:#fff}
[data-theme=dark] .ans-btn[aria-expanded=true]{color:#08130d}
.inline-exp{display:block;margin:8px 0 12px;padding:10px 14px;background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;font-size:14.5px;line-height:1.65;white-space:normal}
.inline-exp .ie-head{display:block;font:700 12px/1.4 var(--font-heading);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.inline-exp .ie-ans{display:block;font-weight:700;margin-bottom:4px}
.inline-exp .ie-quote{display:block;margin:2px 0 4px}
.inline-exp .ie-loc{font-size:12px;font-weight:700;color:var(--brand-dark);margin-right:6px}
.inline-exp .ie-body{display:block;margin-top:4px}
/* summary with gaps */
.summary-group{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 16px;background:var(--card)}
.summary-prose{padding:14px 16px;font-size:15px;line-height:1.95}
.summary-prose h3{font:700 17px/1.5 var(--font-heading);margin:0 0 8px}
.summary-prose p{margin:0 0 12px}
.summary-gap{display:inline;border:0;border-bottom:1px solid var(--edge);border-radius:3px;padding:1px 4px;font:inherit;line-height:inherit;background:transparent;color:inherit}
.summary-gap strong{font-size:12px;margin-right:3px}
.summary-gap:hover,.summary-gap.active-gap{background:var(--soft);border-bottom-color:var(--brand)}
.summary-gap.filled{color:var(--brand-dark);font-weight:700;border-bottom-color:var(--brand)}
.summary-gap.filled .blank-space{font-weight:700}
.pending-note{font-size:12.5px;color:var(--muted);margin:0 0 8px}
/* notes completion: section headings + bullet lines, same card as a summary */
.summary-prose p.notes-h{font:700 15px/1.5 var(--font-heading);color:var(--brand-dark);margin:14px 0 2px}
.summary-prose p.notes-h:first-of-type{margin-top:2px}
.summary-prose p.notes-li{position:relative;margin:0 0 6px;padding-left:20px}
.summary-prose p.notes-li::before{content:'•';position:absolute;left:5px;color:var(--muted)}
/* matching headings: the dashed box at the head of each section shows the correct heading */
.head-box{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 10px;width:100%;box-sizing:border-box;margin:0 0 10px;padding:8px 12px;border:1.5px dashed var(--brand);border-radius:8px;background:var(--brand-tint);color:var(--text);font:inherit;cursor:pointer;text-align:center}
.head-box:hover{filter:brightness(.97)}
.head-box.active{border-style:solid;box-shadow:0 0 0 4px #15934e1f}
.head-box .hb-n{font:800 16px var(--font-heading)}
.head-box .hb-sec{font-size:12.5px;font-weight:600;color:var(--muted)}
.head-box .hb-ans{font-weight:700;color:var(--brand-dark)}
.option-letter.lbl{min-width:34px}
.summary-prose p.notes-li2{padding-left:42px}
.summary-prose p.notes-li2::before{content:'\25E6';left:26px}

/* ---------- vocabulary pages ---------- */
.vocab-wrap{max-width:900px;margin:0 auto;padding:22px 22px 120px}
.vocab-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.vocab-head h2{margin:0;font:700 22px var(--font-heading)}
.vocab-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.vocab-list details{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 8px;padding:0}
.vocab-list summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.vocab-list summary::-webkit-details-marker{display:none}
.vocab-list summary .pos{font-weight:400;color:var(--muted);font-size:13px}
.vocab-list details[open]{border-color:var(--brand)}
.vocab-list .vbody{padding:0 14px 12px;font-size:14.5px}
.vocab-list .vbody p{margin:4px 0}
.vocab-list .ex{color:var(--muted)}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;width:780px;max-width:calc(100% - 24px);padding:7px;background:#202020;border-radius:999px;box-shadow:0 10px 28px #0003}
.dock button{background:transparent;border:0;color:#c6c6c6;border-radius:999px;padding:10px 8px;font-weight:600;font-size:13px}
.dock button:hover{background:#303030;color:#fff}
.dock button[aria-current=page]{background:var(--brand);color:#fff}
[data-theme=dark] .dock button[aria-current=page]{color:#08130d}

/* ---------- vocabulary pop-up (centre of screen) ---------- */
.vmodal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(20,27,46,.5);padding:16px}
.vmodal[hidden]{display:none}
.vcard{position:relative;width:100%;max-width:440px;background:var(--card);color:var(--text);border-radius:16px;box-shadow:0 18px 50px #0005;padding:24px 24px 18px;border-top:5px solid var(--brand)}
.vclose{position:absolute;right:10px;top:10px;width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;background:transparent}
.vword{font:700 26px/1.25 var(--font-heading);margin:0 34px 10px 0;overflow-wrap:anywhere}
.vexample{font-size:16px;line-height:1.6;margin:0 0 14px}
.vexample .k{color:var(--muted);font-weight:600;margin-right:4px}
.vexample strong{background:var(--gold);color:var(--goldtext);border-radius:3px;padding:0 3px}
.vmeaning{font-size:16px;line-height:1.6;margin:0 0 14px;padding:10px 12px;background:var(--soft);border-left:3px solid var(--brand);border-radius:8px}
.vmeaning .k{font-weight:700;margin-right:4px}
.vnone{font-size:15px;color:var(--muted);margin:0 0 12px}
.vactions{display:flex;justify-content:flex-end;gap:8px}
.btn-reveal{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
[data-theme=dark] .btn-reveal{color:#08130d}

/* ---------- responsive / print ---------- */
@media(max-width:900px){
  header{padding:12px 16px}
  h1{font-size:17px}
  .workspace{display:block;height:auto;padding:12px 12px 108px}
  .pane{overflow:visible;margin-bottom:14px;padding:16px}
  .paragraph-text{font-size:16.5px}
  .dock{width:380px;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:24px}
  .dock button{padding:8px;font-size:12px}
}
@media print{
  header,.dock,.btn-answer,.vmodal{display:none!important}
  .page.active{display:block}
  .workspace{display:block;height:auto}
  .pane{overflow:visible;border:0;box-shadow:none}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">LEVEL UP · READING STUDIO</div>
    <h1>Cambridge 16 · Reading Test 3</h1>
    <small id="subtitle">Reading correction · 3 passages / 40 questions</small>
  </div>
  <div class="toolbar">
    <button id="reset" type="button">Ẩn lời giải</button>
    <button id="theme" type="button" aria-pressed="false">◐ Dark mode</button>
  </div>
</header>
<main id="app"></main>
<nav class="dock" aria-label="Điều hướng bài đọc và từ vựng"></nav>

<div class="vmodal" id="vmodal" hidden role="dialog" aria-modal="true" aria-labelledby="vm-word">
  <div class="vcard">
    <button type="button" class="vclose" id="vm-close" aria-label="Đóng">×</button>
    <div class="vword" id="vm-word"></div>
    <div class="vexample" id="vm-example"></div>
    <div class="vmeaning" id="vm-meaning" hidden></div>

    <div class="vactions"><button type="button" class="btn-reveal" id="vm-reveal">Reveal meaning</button></div>
  </div>
</div>

<script>
const DATA={"parts": [{"title": "Roman shipbuilding and navigation", "subtitle": null, "paras": [{"label": null, "text": "Shipbuilding today is based on science and ships are built using computers and sophisticated tools. Shipbuilding in ancient Rome, however, was more of an art relying on estimation, inherited techniques and personal experience. The Romans were not traditionally sailors but mostly land-based people, who learned to build ships from the people that they conquered, namely the Greeks and the Egyptians."}, {"label": null, "text": "There are a few surviving written documents that give descriptions and representations of ancient Roman ships, including the sails and rigging. Excavated vessels also provide some clues about ancient shipbuilding techniques. Studies of these have taught us that ancient Roman shipbuilders built the outer hull first, then proceeded with the frame and the rest of the ship. Planks used to build the outer hull were initially sewn together. Starting from the 6th century BCE, they were fixed using a method called mortise and tenon, whereby one plank locked into another without the need for stitching. Then in the first centuries of the current era, Mediterranean shipbuilders shifted to another shipbuilding method, still in use today, which consisted of building the frame first and then proceeding with the hull and the other components of the ship. This method was more systematic and dramatically shortened ship construction times. The ancient Romans built large merchant ships and warships whose size and technology were unequalled until the 16th century CE."}, {"label": null, "text": "Warships were built to be lightweight and very speedy. They had to be able to sail near the coast which is why they had no ballast or excess load and were built with a long, narrow hull. They did not sink when damaged and often would lie crippled on the sea’s surface following naval battles. They had a bronze battering ram, which was used to pierce the timber hulls or break the oars of enemy vessels. Warships used both wind (sails) and human power (oarsmen) and were therefore very fast. Eventually, Rome’s navy became the largest and most powerful in the Mediterranean, and the Romans had control over what they therefore called Mare Nostrum meaning ‘our sea’."}, {"label": null, "text": "There were many kinds of warship. The ‘trireme’ was the dominant warship from the 7th to 4th century BCE. It had rowers in the top, middle and lower levels, and approximately 50 rowers in each bank. The rowers at the bottom had the most uncomfortable position as they were under the other rowers and were exposed to the water entering through the oar-holes. It is worth noting that contrary to popular perception, rowers were not slaves but mostly Roman citizens enrolled in the military. The trireme was superseded by larger ships with even more rowers."}, {"label": null, "text": "Merchant ships were built to transport lots of cargo over long distances and at a reasonable cost. They had a wider hull, double planking and a solid interior for added stability. Unlike warships, their V-shaped hull was deep underwater, meaning that they could not sail too close to the coast. They usually had two huge side rudders located off the stern and controlled by a small tiller bar connected to a system of cables. They had from one to three masts with large square sails and a small triangular sail at the bow. Just like warships, merchant ships used oarsmen, but coordinating the hundreds of rowers in both types of ship was not an easy task. In order to assist them, music would be played on an instrument, and oars would then keep time with this."}, {"label": null, "text": "The cargo on merchant ships included raw materials (e.g. iron bars, copper, marble and granite), and agricultural products (e.g. grain from Egypt’s Nile valley). During the Empire, Rome was a huge city by ancient standards of about one million inhabitants. Goods from all over the world would come to the city through the port of Pozzuoli situated west of the bay of Naples in Italy and through the gigantic port of Ostia situated at the mouth of the Tiber River. Large merchant ships would approach the destination port and, just like today, be intercepted by a number of towboats that would drag them to the quay."}, {"label": null, "text": "The time of travel along the many sailing routes could vary widely. Navigation in ancient Rome did not rely on sophisticated instruments such as compasses but on experience, local knowledge and observation of natural phenomena. In conditions of good visibility, seamen in the Mediterranean often had the mainland or islands in sight, which greatly facilitated navigation. They sailed by noting their position relative to a succession of recognisable landmarks. When weather conditions were not good or where land was no longer visible, Roman mariners estimated directions from the pole star or, with less accuracy, from the Sun at noon. They also estimated directions relative to the wind and swell. Overall, shipping in ancient Roman times resembled shipping today with large vessels regularly crossing the seas and bringing supplies from their Empire."}], "groups": [{"kind": "tfng", "title": "Questions 1–5", "instr": "Do the following statements agree with the information given in Reading Passage 1? TRUE if the statement agrees with the information · FALSE if the statement contradicts the information · NOT GIVEN if there is no information on this.", "qs": [1, 2, 3, 4, 5]}, {"kind": "summary", "title": "Questions 6–13", "instr": "Complete the summary below. Choose ONE WORD ONLY from the passage for each answer.", "qs": [6, 7, 8, 9, 10, 11, 12, 13], "summary": {"title": "Warships and merchant ships", "paras": ["Warships were designed so that they were {6} and moved quickly. They often remained afloat after battles and were able to sail close to land as they lacked any additional weight. A battering ram made of {7} was included in the design for attacking and damaging the timber and oars of enemy ships. Warships, such as the ‘trireme’, had rowers on three different {8}.", "Unlike warships, merchant ships had a broad {9} that lay far below the surface of the sea. Merchant ships were steered through the water with the help of large rudders and a tiller bar. They had both square and {10} sails. On merchant ships and warships, {11} was used to ensure rowers moved their oars in and out of the water at the same time.", "Quantities of agricultural goods such as {12} were transported by merchant ships to two main ports in Italy. The ships were pulled to the shore by {13}. When the weather was clear and they could see islands or land, sailors used landmarks that they knew to help them navigate their route."], "styles": ["", "", ""]}}]}, {"title": "Climate change reveals ancient artefacts in Norway’s glaciers", "subtitle": null, "paras": [{"label": "A", "sec": "A", "text": "Well above the treeline in Norway’s highest mountains, ancient fields of ice are shrinking as Earth’s climate warms. As the ice has vanished, it has been giving up the treasures it has preserved in cold storage for the last 6,000 years - items such as ancient arrows and skis from Viking Age* traders. And those artefacts have provided archaeologists with some surprising insights into how ancient Norwegians made their livings."}, {"label": null, "sec": "A", "text": "*Viking Age: a period of European history from around 700 CE to around 1050 CE when Scandinavian Vikings migrated throughout Europe by means of trade and warfare"}, {"label": "B", "sec": "B", "text": "Organic materials like textiles and hides are relatively rare finds at archaeological sites. This is because unless they’re protected from the microorganisms that cause decay, they tend not to last long. Extreme cold is one reliable way to keep artefacts relatively fresh for a few thousand years, but once thawed out, these materials experience degradation relatively swiftly."}, {"label": null, "sec": "B", "text": "With climate change shrinking ice cover around the world, glacial archaeologists need to race the clock to find newly revealed artefacts, preserve them, and study them. If something fragile dries and is windblown it might very soon be lost to science, or an arrow might be exposed and then covered again by the next snow and remain well-preserved. The unpredictability means that glacial archaeologists have to be systematic in their approach to fieldwork."}, {"label": "C", "sec": "C", "text": "Over a nine-year period, a team of archaeologists, which included Lars Pilø of Oppland County Council, Norway, and James Barrett of the McDonald Institute for Archaeological Research, surveyed patches of ice in Oppland, an area of south-central Norway that is home to some of the country’s highest mountains. Reindeer once congregated on these ice patches in the later summer months to escape biting insects, and from the late Stone Age**, hunters followed. In addition, trade routes threaded through the mountain passes of Oppland, linking settlements in Norway to the rest of Europe."}, {"label": null, "sec": "C", "text": "The slow but steady movement of glaciers tends to destroy anything at their bases, so the team focused on stationary patches of ice, mostly above 1,400 metres. That ice is found amid fields of frost-weathered boulders, fallen rocks, and exposed bedrock that for nine months of the year is buried beneath snow."}, {"label": null, "sec": "C", "text": "‘Fieldwork is hard work - hiking with all our equipment, often camping on permafrost - but very rewarding. You’re rescuing the archaeology, bringing the melting ice to wider attention, discovering a unique environmental history and really connecting with the natural environment,’ says Barrett."}, {"label": null, "sec": "C", "text": "**The Stone Age: a period in early history that began about 3.4 million years ago"}, {"label": "D", "sec": "D", "text": "At the edges of the contracting ice patches, archaeologists found more than 2,000 artefacts, which formed a material record that ran from 4,000 BCE to the beginnings of the Renaissance in the 14th century. Many of the artefacts are associated with hunting. Hunters would have easily misplaced arrows and they often discarded broken bows rather than take them all the way home. Other items could have been used by hunters traversing the high mountain passes of Oppland: all-purpose items like tools, skis, and horse tack."}, {"label": "E", "sec": "E", "text": "Barrett’s team radiocarbon-dated 153 of the artefacts and compared those dates to the timing of major environmental changes in the region - such as periods of cooling or warming - and major social and economic shifts - such as the growth of farming settlements and the spread of international trade networks leading up to the Viking Age. They found that some periods had produced lots of artefacts, which indicates that people had been pretty active in the mountains during those times. But there were few or no signs of activity during other periods."}, {"label": "F", "sec": "F", "text": "What was surprising, according to Barrett, was the timing of these periods. Oppland’s mountains present daunting terrain and in periods of extreme cold, glaciers could block the higher mountain passes and make travel in the upper reaches of the mountains extremely difficult. Archaeologists assumed people would stick to lower elevations during a time like the Late Antique Little Ice Age, a short period of deeper-than-usual cold from about 536-600 CE. But it turned out that hunters kept regularly venturing into the mountains even when the climate turned cold, based on the amount of stuff they had apparently dropped there."}, {"label": null, "sec": "F", "text": "‘Remarkably, though, the finds from the ice may have continued through this period, perhaps suggesting that the importance of mountain hunting increased to supplement failing agricultural harvests in times of low temperatures,’ says Barrett. A colder turn in the Scandinavian climate would likely have meant widespread crop failures, so more people would have depended on hunting to make up for those losses."}, {"label": "G", "sec": "G", "text": "Many of the artefacts Barrett’s team recovered date from the beginning of the Viking Age, the 700s through to the 900s CE. Trade networks connecting Scandinavia with Europe and the Middle East were expanding around this time. Although we usually think of ships when we think of Scandinavian expansion, these recent discoveries show that plenty of goods travelled on overland routes, like the mountain passes of Oppland. And growing Norwegian towns, along with export markets, would have created a booming demand for hides to fight off the cold, as well as antlers to make useful things like combs. Business must have been good for hunters."}, {"label": "H", "sec": "H", "text": "Norway’s mountains are probably still hiding a lot of history - and prehistory - in remote ice patches. When Barrett’s team looked at the dates for their sample of 153 artefacts, they noticed a gap with almost no artefacts from about 3,800 to 2,200 BCE. In fact, archaeological finds from that period are rare all over Norway. The researchers say that could be because many of those artefacts have already disintegrated or are still frozen in the ice. That means archaeologists could be extracting some of those artefacts from retreating ice in years to come."}], "groups": [{"kind": "match", "title": "Questions 14–19", "instr": "Reading Passage 2 has eight sections, A–H. Which section contains the following information? Write the correct letter, A–H. NB You may use any letter more than once.", "qs": [14, 15, 16, 17, 18, 19]}, {"kind": "summary", "title": "Questions 20–22", "instr": "Complete the summary below. Choose ONE WORD ONLY from the passage for each answer.", "qs": [20, 21, 22], "summary": {"title": "Interesting finds at an archaeological site", "paras": ["Organic materials such as animal skins and textiles are not discovered very often at archaeological sites. They have little protection against {20}, which means that they decay relatively quickly. But this is not always the case. If temperatures are low enough, fragile artefacts can be preserved for thousands of years.", "A team of archaeologists have been working in the mountains in Oppland in Norway to recover artefacts revealed by shrinking ice cover. In the past, there were trade routes through these mountains and {21} gathered there in the summer months to avoid being attacked by {22} on lower ground. The people who used these mountains left things behind and it is those objects that are of interest to archaeologists."], "styles": ["", ""]}}, {"kind": "mcq2", "title": "Questions 23 and 24", "instr": "Choose TWO letters, A–E.", "qs": [23, 24]}, {"kind": "mcq2", "title": "Questions 25 and 26", "instr": "Choose TWO letters, A–E.", "qs": [25, 26]}]}, {"title": "Plant ‘thermometer’ triggers springtime growth by measuring night-time heat", "subtitle": "A photoreceptor molecule in plant cells has been found to have a second job as a thermometer after dark - allowing plants to read seasonal temperature changes. Scientists say the discovery could help breed crops that are more resilient to the temperatures expected to result from climate change", "paras": [{"label": "A", "sec": "A", "text": "An international team of scientists led by the University of Cambridge has discovered that the ‘thermometer’ molecule in plants enables them to develop according to seasonal temperature changes. Researchers have revealed that molecules called phytochromes - used by plants to detect light during the day - actually change their function in darkness to become cellular temperature gauges that measure the heat of the night."}, {"label": null, "sec": "A", "text": "The new findings, published in the journal Science, show that phytochromes control genetic switches in response to temperature as well as light to dictate plant development."}, {"label": "B", "sec": "B", "text": "At night, these molecules change states, and the pace at which they change is ‘directly proportional to temperature’, say scientists, who compare phytochromes to mercury in a thermometer. The warmer it is, the faster the molecular change - stimulating plant growth."}, {"label": "C", "sec": "C", "text": "Farmers and gardeners have known for hundreds of years how responsive plants are to temperature: warm winters cause many trees and flowers to bud early, something humans have long used to predict weather and harvest times for the coming year. The latest research pinpoints for the first time a molecular mechanism in plants that reacts to temperature - often triggering the buds of spring we long to see at the end of winter."}, {"label": "D", "sec": "D", "text": "With weather and temperatures set to become ever more unpredictable due to climate change, researchers say the discovery that this light-sensing molecule also functions as the internal thermometer in plant cells could help us breed tougher crops. ‘It is estimated that agricultural yields will need to double by 2050, but climate change is a major threat to achieving this. Key crops such as wheat and rice are sensitive to high temperatures. Thermal stress reduces crop yields by around 10% for every one degree increase in temperature,’ says lead researcher Dr Philip Wigge from Cambridge’s Sainsbury Laboratory. ‘Discovering the molecules that allow plants to sense temperature has the potential to accelerate the breeding of crops resilient to thermal stress and climate change.’"}, {"label": "E", "sec": "E", "text": "In their active state, phytochrome molecules bind themselves to DNA to restrict plant growth. During the day, sunlight activates the molecules, slowing down growth. If a plant finds itself in shade, phytochromes are quickly inactivated - enabling it to grow faster to find sunlight again. This is how plants compete to escape each other’s shade. ‘Light-driven changes to phytochrome activity occur very fast, in less than a second,’ says Wigge."}, {"label": null, "sec": "E", "text": "At night, however, it’s a different story. Instead of a rapid deactivation following sundown, the molecules gradually change from their active to inactive state. This is called ‘dark reversion’. ‘Just as mercury rises in a thermometer, the rate at which phytochromes revert to their inactive state during the night is a direct measure of temperature,’ says Wigge."}, {"label": "F", "sec": "F", "text": "‘The lower the temperature, the slower the rate at which phytochromes revert to inactivity, so the molecules spend more time in their active, growth-suppressing state. This is why plants are slower to grow in winter. Warm temperatures accelerate dark reversion, so that phytochromes rapidly reach an inactive state and detach themselves from the plant’s DNA - allowing genes to be expressed and plant growth to resume.’ Wigge believes phytochrome thermo-sensing evolved at a later stage, and co-opted the biological network already used for light-based growth during the downtime of night."}, {"label": "G", "sec": "G", "text": "Some plants mainly use day length as an indicator of the season. Other species, such as daffodils, have considerable temperature sensitivity, and can flower months in advance during a warm winter. In fact, the discovery of the dual role of phytochromes provides the science behind a well-known rhyme long used to predict the coming season: oak before ash we’ll have a plash, ash before oak we’re in for a soak."}, {"label": null, "sec": "G", "text": "Wigge explains: ‘Oak trees rely much more on temperature, likely using phytochromes as thermometers to dictate development, whereas ash trees rely on measuring day length to determine their seasonal timing. A warmer spring, and consequently a higher likeliness of a hot summer, will result in oak leafing before ash. A cold spring will see the opposite. As the British know only too well, a colder summer is likely to be a rain-soaked one.’"}, {"label": "H", "sec": "H", "text": "The new findings are the culmination of twelve years of research involving scientists from Germany, Argentina and the US, as well as the Cambridge team. The work was done in a model system, using a mustard plant called Arabidopsis, but Wigge says the phytochrome genes necessary for temperature sensing are found in crop plants as well. ‘Recent advances in plant genetics now mean that scientists are able to rapidly identify the genes controlling these processes in crop plants, and even alter their activity using precise molecular “scalpels”,’ adds Wigge. ‘Cambridge is uniquely well-positioned to do this kind of research as we have outstanding collaborators nearby who work on more applied aspects of plant biology, and can help us transfer this new knowledge into the field.’"}], "groups": [{"kind": "tfng", "title": "Questions 27–32", "instr": "Do the following statements agree with the information given in Reading Passage 3? TRUE if the statement agrees with the information · FALSE if the statement contradicts the information · NOT GIVEN if there is no information on this.", "qs": [27, 28, 29, 30, 31, 32]}, {"kind": "match", "title": "Questions 33–37", "instr": "Reading Passage 3 has eight sections, A–H. Which section contains the following information? Write the correct letter, A–H. NB You may use any letter more than once.", "qs": [33, 34, 35, 36, 37]}, {"kind": "summary", "title": "Questions 38–40", "instr": "Complete the sentences below. Choose NO MORE THAN TWO WORDS from the passage for each answer.", "qs": [38, 39, 40], "summary": {"title": null, "paras": ["Daffodils are likely to flower early in response to {38} weather.", "If ash trees come into leaf before oak trees, the weather in {39} will probably be wet.", "The research was carried out using a particular species of {40}."], "styles": ["", "", ""]}}]}], "questions": {"1": {"exp": "Paragraph 1: người La Mã “learned to build ships from the people that they conquered, namely the Greeks and the Egyptians” → chính người La Mã học đóng tàu từ người Hy Lạp và Ai Cập, chứ không phải truyền kỹ năng cho họ. Câu hỏi nói ngược chiều → FALSE.", "ev": [{"p": 0, "s": 227, "e": 399, "hl": [[303, 398]], "blue": []}], "ansShow": "FALSE", "text": "The Romans’ shipbuilding skills were passed on to the Greeks and the Egyptians.", "qhl": [[32, 78]]}, "2": {"exp": "Paragraph 2: bài chỉ nói phương pháp mortise and tenon nghĩa là một tấm ván khóa vào tấm khác mà không cần khâu (“one plank locked into another without the need for stitching”). Không có thông tin nào về việc cần thợ thủ công lành nghề (skilled craftsmen) → NOT GIVEN.", "ev": [{"p": 1, "s": 439, "e": 600, "hl": [[496, 529]], "blue": []}], "ansShow": "NOT GIVEN", "text": "Skilled craftsmen were needed for the mortise and tenon method of fixing planks.", "qhl": [[0, 29], [38, 62]]}, "3": {"exp": "Paragraph 2: thợ đóng tàu Địa Trung Hải sau này chuyển sang phương pháp “building the frame first and then proceeding with the hull” → làm khung trước rồi mới đến thân tàu. Câu hỏi nói làm thân (hull) trước khung (frame) → ngược lại → FALSE.", "ev": [{"p": 1, "s": 601, "e": 851, "hl": [[755, 813]], "blue": []}], "ansShow": "FALSE", "text": "The later practice used by Mediterranean shipbuilders involved building the hull before the frame.", "qhl": [[63, 97]]}, "4": {"exp": "Paragraph 3: “Rome’s navy became the largest and most powerful in the Mediterranean, and the Romans had control over what they therefore called Mare Nostrum” → họ gọi biển là Mare Nostrum (“therefore” = vì thế) vì họ kiểm soát/thống trị nó → TRUE.", "ev": [{"p": 2, "s": 492, "e": 665, "hl": [[579, 646]], "blue": []}], "ansShow": "TRUE", "text": "The Romans called the Mediterranean Sea Mare Nostrum because they dominated its use.", "qhl": [[53, 83]]}, "5": {"exp": "Paragraph 4: “rowers were not slaves but mostly Roman citizens enrolled in the military” → phần lớn người chèo thuyền là công dân La Mã nhập ngũ (≈ people from the Roman army) → TRUE.", "ev": [{"p": 3, "s": 358, "e": 488, "hl": [[441, 487]], "blue": []}], "ansShow": "TRUE", "text": "Most rowers on ships were people from the Roman army.", "qhl": [[0, 11], [26, 52]]}, "6": {"exp": "Paragraph 3: “Warships were built to be lightweight and very speedy” → tàu chiến được thiết kế nhẹ và nhanh (designed so that they were lightweight and moved quickly) → lightweight.", "ev": [{"p": 2, "s": 0, "e": 54, "hl": [[14, 53]], "blue": []}], "ansShow": "lightweight", "gapShow": "lightweight", "qp": 0, "qhl": [[14, 40], [45, 62]]}, "7": {"exp": "Paragraph 3: “They had a bronze battering ram, which was used to pierce the timber hulls or break the oars of enemy vessels” → mũi đâm làm bằng đồng thiếc (bronze) để phá thân gỗ và mái chèo tàu địch → bronze.", "ev": [{"p": 2, "s": 293, "e": 403, "hl": [[302, 324]], "blue": []}], "ansShow": "bronze", "gapShow": "bronze", "qp": 0, "qhl": [[179, 202], [265, 295]]}, "8": {"exp": "Paragraph 4: trireme “had rowers in the top, middle and lower levels” → người chèo ở ba tầng/cấp khác nhau (three different levels) → levels.", "ev": [{"p": 3, "s": 106, "e": 198, "hl": [[113, 155]], "blue": []}], "ansShow": "levels", "gapShow": "levels", "qp": 0, "qhl": [[334, 359]]}, "9": {"exp": "Paragraph 5: tàu buôn “had a wider hull” và “their V-shaped hull was deep underwater, meaning that they could not sail too close to the coast” → thân tàu rộng, nằm sâu dưới mặt nước (broad … lay far below the surface) → hull.", "ev": [{"p": 4, "s": 99, "e": 294, "hl": [[108, 120], [197, 236]], "blue": []}], "ansShow": "hull", "gapShow": "hull", "qp": 1, "qhl": [[17, 43], [53, 89]]}, "10": {"exp": "Paragraph 5: “They had from one to three masts with large square sails and a small triangular sail at the bow” → buồm vuông lớn và buồm tam giác nhỏ (both square and triangular sails) → triangular.", "ev": [{"p": 4, "s": 426, "e": 522, "hl": [[464, 510]], "blue": []}], "ansShow": "triangular", "gapShow": "triangular", "qp": 1, "qhl": [[195, 210]]}, "11": {"exp": "Paragraph 5: để điều phối hàng trăm người chèo, “music would be played on an instrument, and oars would then keep time with this” → nhạc được dùng để mái chèo nhịp nhàng cùng lúc → music. (“Just like warships” → áp dụng cho cả tàu buôn lẫn tàu chiến.)", "ev": [{"p": 4, "s": 523, "e": 761, "hl": [[681, 760]], "blue": []}], "ansShow": "music", "gapShow": "music", "qp": 1, "qhl": [[272, 343]]}, "12": {"exp": "Paragraph 6: hàng hóa gồm “agricultural products (e.g. grain from Egypt’s Nile valley)” → nông sản như ngũ cốc (grain) → grain.", "ev": [{"p": 5, "s": 0, "e": 161, "hl": [[101, 160]], "blue": []}], "ansShow": "grain", "gapShow": "grain", "qp": 2, "qhl": [[14, 40]]}, "13": {"exp": "Paragraph 6: tàu buôn lớn “be intercepted by a number of towboats that would drag them to the quay” → được các tàu kéo (towboats) kéo vào bến → towboats.", "ev": [{"p": 5, "s": 464, "e": 615, "hl": [[573, 614]], "blue": []}], "ansShow": "towboats", "gapShow": "towboats", "qp": 2, "qhl": [[109, 146]]}, "14": {"exp": "Section D: “Hunters would have easily misplaced arrows and they often discarded broken bows rather than take them all the way home” → giải thích vì sao vũ khí (cung, tên) bị bỏ lại trên núi: dễ làm rơi tên và thường vứt cung gãy thay vì mang về nhà → D.", "ev": [{"p": 8, "s": 257, "e": 376, "hl": [[257, 375]], "blue": []}], "ansShow": "D", "text": "an explanation for weapons being left behind in the mountains", "qhl": [[0, 61]]}, "15": {"exp": "Section C: Barrett nói “Fieldwork is hard work - hiking with all our equipment, often camping on permafrost” → đề cập đến khó khăn về thể chất của chuyến thám hiểm khảo cổ (đi bộ mang thiết bị, cắm trại trên đất đóng băng vĩnh cửu) → C.", "ev": [{"p": 6, "s": 1, "e": 106, "hl": [[1, 84]], "blue": []}], "ansShow": "C", "text": "a reference to the physical difficulties involved in an archaeological expedition", "qhl": [[15, 81]]}, "16": {"exp": "Sec function renderParagraph(text,ev){
  if(!ev) return esc(text);

    let out='',last=a;

  let inner='',last=ev.s;
  [...ev.hl].sort((a,b)=>a[0]-b[0]).forEach(([hs,he])=>{inner+=seg(last,hs)+'<mark class="answer-hl">'+seg(hs,he)+'</mark>';last=he});
  inner+=seg(last,ev.e);
  return esc(text.slice(0,ev.s))+'<span class="context-box">'+inner+'</span>'+esc(text.slice(ev.e));
}
// question side: yellow + bold on the phrases that map to the passage evidence
function markRanges(text,ranges){
  let out='',last=0;
  [...(ranges||[])].sort((a,b)=>a[0]-b[0]).forEach(([s0,e0])=>{out+=esc(text.slice(last,s0))+'<mark class="answer-hl">'+esc(text.slice(s0,e0))+'</mark>';last=e0});
  return out+esc(text.slice(last));
}
let ACTIVE=null;                           // question currently selected
const OPEN_ANS=new Set();                  // summary gaps whose inline answer is open
function clearPassage(part){
  $$('.passage-p',$('#r'+part)).forEach((el,i)=>{el.classList.remove('active-context');$('.paragraph-text',el).innerHTML=esc(DATA.parts[part].paras[i].text)});
}

/* ------------------------------------------------------------------ page construction */
function paragraphsHTML(part){
  return DATA.parts[part].paras.map((p,i)=>
    '<div class="passage-p" id="para-'+part+'-'+i+'" data-part="'+part+'" data-idx="'+i+'">'+
    (p.hq?'<button type="button" class="head-box" data-q="'+p.hq+'" aria-label="Heading '+p.hq+' – xem giải thích"><span class="hb-n">'+p.hq+'</span><span class="hb-sec">Section '+esc(p.sec)+'</span><span class="hb-ans">'+esc(Q[p.hq].hdText)+'</span></button>':p.label?'<div class="para-label">Section '+esc(p.label)+'</div>':'')+
    '<div class="paragraph-text">'+esc(p.text)+'</div></div>').join('');
}
const GROUP_OF={};DATA.parts.forEach(p=>p.groups.forEach(g=>g.qs.forEach(q=>GROUP_OF[q]=g)));
const isSummaryGroup=g=>g.kind==='summary'||g.kind==='wordlist';
function evidenceQuotes(q){
  const part=PART_OF[q];
  return Q[q].ev.map(e=>{
    const par=DATA.parts[part].paras[e.p],t=par.text;
    const label=par.sec?('Section '+par.sec):par.label?('Paragraph '+par.label):('Paragraph '+(e.p+1));
    return [...e.hl].sort((a,b)=>a[0]-b[0]).map(([s0,e0])=>'<span class="ie-quote"><span class="ie-loc">'+esc(label)+'</span>“<mark class="answer-hl">'+esc(t.slice(s0,e0))+'</mark>”</span>').join('');
  }).join('');
}
function inlineExp(q){
  return '<span class="inline-exp" id="ans'+q+'"><span class="ie-head">Evidence / Explanation</span><span class="ie-ans">Đáp án: '+esc(Q[q].ansShow)+'</span>'+evidenceQuotes(q)+'<span class="ie-body">'+esc(Q[q].exp)+'</span></span>';
}
function gapHTML(q){
  const open=OPEN_ANS.has(q);
  return '<span class="gap-wrap" data-q="'+q+'"><button type="button" class="summary-gap'+(open?' filled':'')+(ACTIVE===q?' active-gap':'')+'" data-q="'+q+'" aria-label="Question '+q+': xem bằng chứng"><strong>'+q+'</strong> <span class="blank-space" id="b'+q+'">'+(open?esc(Q[q].gapShow):'__________')+'</span></button> <button type="button" class="ans-btn" data-q="'+q+'" aria-expanded="'+open+'" aria-label="Answer '+q+'">(Ans)</button></span>'+(open?inlineExp(q):'');
}
function summaryParaHTML(g,pi){
  const text=g.summary.paras[pi];
  const act=(ACTIVE&&g.qs.includes(ACTIVE)&&Q[ACTIVE].qp===pi)?Q[ACTIVE].qhl:[];
  let out='',last=0;
  const re=/\{(\d+)\}/g;let m;
  const chunk=(a,b)=>{                    // text[a,b) with the yellow ranges that fall inside it
    const rs=act.map(([s0,e0])=>[Math.max(s0,a)-a,Math.min(e0,b)-a]).filter(([s0,e0])=>s0<e0);
    return markRanges(text.slice(a,b),rs);
  };
  while((m=re.exec(text))){out+=chunk(last,m.index)+gapHTML(+m[1]);last=m.index+m[0].length}
  return out+chunk(last,text.length);
}
function summaryInnerHTML(g){
  const st=g.summary.styles||[];
  return '<div class="summary-prose">'+(g.summary.title?'<h3>'+esc(g.summary.title)+'</h3>':'')+g.summary.paras.map((_,pi)=>'<p'+(st[pi]==='h'?' class="notes-h"':st[pi]==='li'?' class="notes-li"':st[pi]==='li2'?' class="notes-li notes-li2"':'')+'>'+summaryParaHTML(g,pi)+'</p>').join('')+'</div>';
}
function summaryHTML(g){return '<div class="summary-group" data-g="'+g.qs[0]+'">'+summaryInnerHTML(g)+'</div>'}
function refreshSummary(g,focusQ){
  const el=$('.summary-group[data-g="'+g.qs[0]+'"]');if(!el)return;
  el.innerHTML=summaryInnerHTML(g);
  if(focusQ){const b=$('.ans-btn[data-q="'+focusQ+'"]',el);if(b)b.focus({preventScroll:true})}
}
function answerBlock(q){
  const d=Q[q];
  return '<div class="explanation-box" id="ans'+q+'"><span class="ans">Đáp án: '+esc(d.ansShow)+'</span><p><em>Giải thích:</em> '+esc(d.exp)+'</p></div>';
}
function cardHTML(q,g){
  const d=Q[q];
  let body='';
  if(g.kind==='mcq'||g.kind==='mcq2'){
    const qLabel=g.kind==='mcq2'?(g.qs[0]+'–'+g.qs[g.qs.length-1]):q;
    body='<p><strong class="question-number">'+qLabel+'</strong><span class="q-text" data-q="'+q+'">'+esc(d.text)+'</span></p>'+d.opts.map((o,k)=>
      '<div class="choice-item" tabindex="0" data-k="'+k+'" role="button"><span class="cl">'+'ABCDE'[k]+'</span><span class="ct">'+esc(o)+'</span><div class="mcq-info-box">'+esc(d.optExp[k])+'</div></div>').join('');
  }else{
    body='<p><strong class="question-number">'+q+'</strong><span class="q-text" data-q="'+q+'">'+esc(d.text)+'</span></p>';
  }
  return '<div class="question-block" data-q="'+q+'" tabindex="0" aria-label="Câu '+q+' — định vị ngữ cảnh">'+body+
    '<button class="btn-answer" type="button" aria-expanded="false">Answer</button>'+answerBlock(q)+'</div>';
}
function refreshCard(q){
  const d=Q[q],block=$('.question-block[data-q="'+q+'"]');if(!block)return;
  const t=$('.q-text',block);if(t)t.innerHTML=markRanges(d.text,ACTIVE===q?d.qhl:[]);
  if(d.opts){
    const on=ACTIVE===q&&$('.explanation-box',block).classList.contains('show');
    $$('.choice-item',block).forEach((c,k)=>{const r=d.ohls?(d.ohls[k]?[d.ohls[k]]:[]):(d.ohl&&k===d.correctIdx?[d.ohl]:[]);$('.ct',c).innerHTML=markRanges(d.opts[k],on?r:[])});
  }
}
function groupHTML(g){
  let h='<div class="section-title" role="heading" aria-level="3">'+esc(g.title)+'</div><p class="q-instr">'+esc(g.instr)+'</p>';
  if(g.bank){
    h+='<div class="word-box"><div class="word-box-title">'+esc(g.bank.title.toUpperCase())+'</div><table class="word-options"><tbody>'+
      Array.from({length:Math.ceil(g.bank.items.length/2)},(_,j)=>'<tr>'+g.bank.items.slice(j*2,j*2+2).map((w,k)=>'<td><span class="option-letter'+(g.bank.labels?' lbl':'')+'">'+(g.bank.labels?g.bank.labels[j*2+k]:String.fromCharCode(65+j*2+k))+'</span>'+esc(w)+'</td>').join('')+(g.bank.items.slice(j*2,j*2+2).length<2?'<td></td>':'')+'</tr>').join('')+'</tbody></table></div>';
  }
  if(g.summary) h+=summaryHTML(g);
  if(g.kind==='mcq2') h+=cardHTML(g.qs[0],g);
  else if(!isSummaryGroup(g)) h+=g.qs.map(q=>cardHTML(q,g)).join('');   // summary questions are corrected inline, next to their blank
  return h;
}
DATA.parts.forEach((p,i)=>{

for(const type of ['v','r'])for(let i=0;i<3;i++){const b=document.createElement('button');b.dataset.view=type+i;b.textContent=(type==='v'?'Vocabulary ':'Part ')+(i+1);b.onclick=()=>selectView(type+i);$('.dock').append(b)}

/* ------------------------------------------------------------------ navigation */
let activeView='r0';
function selectView(id){
  activeView=id;const part=+id.slice(1);
  $$('.page').forEach(p=>p.classList.toggle('active',p.id===id));

/* ------------------------------------------------------------------ selecting a question */
function jump(part,i){
  const el=$('#para-'+part+'-'+i),pane=el.closest('.pane');
  if(matchMedia('(max-width:900px)').matches)el.scrollIntoView({behavior:'smooth',block:'start'});
  else pane.scrollTo({top:el.getBoundingClientRect().top-pane.getBoundingClientRect().top+pane.scrollTop-14,behavior:'smooth'});
}
function selectQuestion(q){
  q=+q;const part=PART_OF[q],d=Q[q],prev=ACTIVE;ACTIVE=q;
  $$('.active-question').forEach(x=>x.classList.remove('active-question'));
  const block=$('#r'+part+' .question-block[data-q="'+q+'"]');if(block)block.classList.add('active-question');
  $$('.head-box').forEach(h=>h.classList.toggle('active',+h.dataset.q===q));
  if(prev&&prev!==q){const pg=GROUP_OF[prev];isSummaryGroup(pg)?refreshSummary(pg):refreshCard(prev)}
  const g=GROUP_OF[q];isSummaryGroup(g)?refreshSummary(g):refreshCard(q);
  const byPara={};d.ev.forEach(e=>{byPara[e.p]=e});
  $$('.passage-p',$('#r'+part)).forEach((el,i)=>{
    el.classList.toggle('active-context',!!byPara[i]);
    $('.paragraph-text',el).innerHTML=renderParagraph(DATA.parts[part].paras[i].text,byPara[i]);
  });
  if(d.ev.length)jump(part,d.ev[0].p);
}
function toggleAnswer(block){
  const q=+block.dataset.q;
  if(!block.classList.contains('active-question'))selectQuestion(q);
  const box=$('.explanation-box',block),show=!box.classList.contains('show');
  box.classList.toggle('show',show);
  $('.btn-answer',block).setAttribute('aria-expanded',show);
  if(Q[q].opts){
    $$('.choice-item',block).forEach((c,k)=>{c.classList.toggle('is-correct',show&&isCorrectIdx(Q[q],k));c.classList.toggle('is-wrong',show&&c.classList.contains('selected')&&!isCorrectIdx(Q[q],k))});
    refreshCard(q);
  }
}
function toggleGap(q){                       // inline (Ans) for summary blanks
  q=+q;const g=GROUP_OF[q];
  OPEN_ANS.has(q)?OPEN_ANS.delete(q):OPEN_ANS.add(q);
  selectQuestion(q);                          // also re-renders the summary with the new state
  refreshSummary(g,q);
}
$('#app').addEventListener('click',e=>{
  const hb=e.target.closest('.head-box');
  if(hb){const q=+hb.dataset.q;selectQuestion(q);const blk=$('#r'+PART_OF[q]+' .question-block[data-q="'+q+'"]');
    if(blk){if(!$('.explanation-box',blk).classList.contains('show'))toggleAnswer(blk);blk.scrollIntoView({behavior:'smooth',block:'nearest'})}return}
  const ansBtn=e.target.closest('.ans-btn');
  if(ansBtn){e.stopPropagation();toggleGap(ansBtn.dataset.q);return}
  const answerBtn=e.target.closest('.btn-answer');
  if(answerBtn){e.stopPropagation();toggleAnswer(answerBtn.closest('.question-block'));return}
  const choice=e.target.closest('.choice-item');
  if(choice){
    const block=choice.closest('.question-block');selectQuestion(block.dataset.q);
    if(Q[+block.dataset.q].correctIdxs){                       // Choose TWO: pick / un-pick each option on its own
      const on=!choice.classList.contains('selected'),k=+choice.dataset.k;
      choice.classList.toggle('selected',on);$('.mcq-info-box',choice).classList.toggle('show',on);
      choice.classList.toggle('is-wrong',on&&$('.explanation-box',block).classList.contains('show')&&!isCorrectIdx(Q[+block.dataset.q],k));
      return;
    }
    $$('.choice-item',block).forEach(c=>{c.classList.remove('selected');$('.mcq-info-box',c).classList.remove('show');c.classList.remove('is-wrong')});
    choice.classList.add('selected');$('.mcq-info-box',choice).classList.add('show');
    if($('.explanation-box',block).classList.contains('show')){const k=+choice.dataset.k;choice.classList.toggle('is-wrong',!isCorrectIdx(Q[+block.dataset.q],k))}
    return;
  }
  const gap=e.target.closest('.summary-gap');
  if(gap){selectQuestion(gap.dataset.q);return}
  const block=e.target.closest('.question-block');
  if(block)selectQuestion(block.dataset.q);
});
$('#app').addEventListener('keydown',e=>{
  if(!['Enter',' '].includes(e.key))return;
  const choice=e.target.closest&&e.target.closest('.choice-item');
  if(choice){e.preventDefault();choice.click();return}
  if(e.target.classList&&e.target.classList.contains('question-block')){e.preventDefault();selectQuestion(e.target.dataset.q)}

/* ------------------------------------------------------------------ theme / reset */
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').textContent=dark?'☀ Light mode':'◐ Dark mode';$('#theme').setAttribute('aria-pressed',dark);try{localStorage.setItem('c16r3-theme',dark?'dark':'light')}catch(e){}}
let theme,savedView;try{theme=localStorage.getItem('c16r3-theme');savedView=localStorage.getItem('c16r3-view')}catch(e){}
setTheme(theme?theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches);

  $$('.choice-item').forEach(c=>{c.classList.remove('selected','is-correct','is-wrong');$('.mcq-info-box',c).classList.remove('show')});
  $$('.active-question').forEach(x=>x.classList.remove('active-question'));

/* ------------------------------------------------------------------ vocabulary look-up (offline; two steps) */
const LOOKUP=DATA.parts.map(()=>({}));
VOCAB.forEach(e=>e.f.forEach(f=>{if(!LOOKUP[e.part][f])LOOKUP[e.part][f]=e}));
const WORD_CH=/[\p{L}\p{M}’'\-]/u;
function cleanWord(raw){return (raw||'').normalize('NFC').replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'').replace(/[’']s$/i,'')}
function findEntry(part,word){
  const w=word.toLowerCase(),map=LOOKUP[part];
  const c=[w,w.replace(/ies$/,'y'),w.replace(/(es|s)$/,''),w.replace(/(ed|d)$/,''),w.replace(/ing$/,''),w.replace(/ing$/,'e'),w.replace(/ly$/,''),w.replace(/ment$/,'')];
  for(const k of c)if(k&&map[k])return map[k];
  return null;
}
function wordAtPoint(x,y){
  let node,off;
  if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y);if(p){node=p.offsetNode;off=p.offset}}
  else if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);if(r){node=r.startContainer;off=r.startOffset}}
  if(!node||node.nodeType!==3)return '';
  const t=node.textContent;let s=Math.min(off,t.length),e=s;
  while(s>0&&WORD_CH.test(t[s-1]))s--;
  while(e<t.length&&WORD_CH.test(t[e]))e++;
  return t.slice(s,e);
}
let vocabOpener=null,vocabEntry=null;
function openVocab(part,rawWord){
  const word=cleanWord(rawWord);if(!word)return;
  vocabEntry=findEntry(part,word);
  vocabOpener=document.activeElement;
  $('#vm-word').textContent=word;
  const ex=$('#vm-example'),mean=$('#vm-meaning'),none=$('#vm-none'),btn=$('#vm-reveal');
  mean.hidden=true;btn.textContent='Reveal meaning';
  if(vocabEntry){
    // step 1: the selected word + one natural English example — NO Vietnamese yet
    let exHtml=esc(vocabEntry.ex);
    for(const f of [...vocabEntry.f].sort((a,b)=>b.length-a.length)){
      const re=new RegExp('\\b'+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
      if(re.test(vocabEntry.ex)){exHtml=esc(vocabEntry.ex).replace(re,m=>'<strong>'+m+'</strong>');break}
    }
    ex.innerHTML='<span class="k">Example:</span>'+exHtml;ex.hidden=false;none.hidden=true;btn.hidden=false;
  }else{
    // no reliable data for this word in this passage: say so, never invent a meaning or example
    ex.hidden=true;none.hidden=false;btn.hidden=true;
    none.textContent='Chưa có dữ liệu từ vựng cho từ này trong bài đọc. (Bạn có thể nhờ giáo viên bổ sung.)';
  }
  $('#vmodal').hidden=false;
  (vocabEntry?btn:$('#vm-close')).focus();
}
function closeVocab(){
  if($('#vmodal').hidden)return;
  $('#vmodal').hidden=true;
  try{getSelection().removeAllRanges()}catch(e){}
  if(vocabOpener&&vocabOpener.focus){try{vocabOpener.focus({preventScroll:true})}catch(e){}}
  vocabOpener=null;
}
$('#vm-reveal').onclick=()=>{
  const mean=$('#vm-meaning');
  if(mean.hidden&&vocabEntry){mean.innerHTML='<span class="k">Meaning:</span>'+esc(vocabEntry.vn);mean.hidden=false;$('#vm-reveal').textContent='Hide meaning'}
  else{mean.hidden=true;$('#vm-reveal').textContent='Reveal meaning'}
};
$('#vm-close').onclick=closeVocab;
$('#vmodal').addEventListener('click',e=>{if(e.target.id==='vmodal')closeVocab()});
document.addEventListener('keydown',e=>{
  if($('#vmodal').hidden)return;
  if(e.key==='Escape'){e.preventDefault();closeVocab();return}
  if(e.key==='Tab'){  // keep focus inside the pop-up
    const f=$$('#vmodal button').filter(b=>!b.hidden&&b.offsetParent!==null);
    if(!f.length)return;const i=f.indexOf(document.activeElement);
    if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}
    else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}
  }
});
function partOfEl(el){const pg=el.closest('.page');return pg?+pg.id.slice(1):0}
$('#app').addEventListener('dblclick',e=>{
  const pt=e.target.closest&&e.target.closest('.paragraph-text');if(!pt)return;
  let w=wordAtPoint(e.clientX,e.clientY);
  if(!cleanWord(w))w=String(getSelection()||'');
  openVocab(partOfEl(pt),w);
});
// long-press (touch devices)
let lpTimer=null,lpX=0,lpY=0;
$('#app').addEventListener('touchstart',e=>{
  const pt=e.target.closest&&e.target.closest('.paragraph-text');if(!pt||e.touches.length!==1)return;
  const t=e.touches[0];lpX=t.clientX;lpY=t.clientY;
  clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{const w=wordAtPoint(lpX,lpY);if(cleanWord(w))openVocab(partOfEl(pt),w)},550);
},{passive:true});
['touchmove','touchend','touchcancel'].forEach(ev=>$('#app').addEventListener(ev,e=>{
  if(ev==='touchmove'&&e.touches[0]&&Math.hypot(e.touches[0].clientX-lpX,e.touches[0].clientY-lpY)<10)return;
  clearTimeout(lpTimer);
},{passive:true}));
