<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C16 R T4 Correction</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/theme.css">
<style>
:root{
  color-scheme:light;
  --font-heading:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;
  --brand:#15934E;--brand-dark:#119446;--brand-tint:#ECF6F1;
  --bg:#f5f6f5;--card:#ffffff;--text:#202020;--muted:#6f7771;--line:#dce0dc;--soft:#f4f5f3;--edge:#b2ada3;--focus:#8a7534;
  --gold:#ffe563;--goldtext:#000000;
  --ref:#2563EB;--ref-strong:#1D4ED8;--ref-bg:#2563eb1f;
  --ctx-bg:#fbe4e1;--ctx-border:#000000;
  --shadow:0 8px 28px #24312a12;
  --correct-bg:#e3f4ea;--wrong-bg:#fdecea;--wrong:#c0392b;
}
[data-theme=dark]{
  color-scheme:dark;
  --brand:#34D399;--brand-dark:#10B981;--brand-tint:#113124;
  --bg:#191b1a;--card:#222523;--text:#eeeeee;--muted:#afb7b0;--line:#404640;--soft:#292d29;--edge:#867f73;--focus:#d2b960;
  --ctx-bg:#4b2a28;--ctx-border:#e6e6e6;
  --ref:#60A5FA;--ref-bg:#3b82f633;
  --shadow:0 8px 28px #0006;
  --correct-bg:#173a29;--wrong-bg:#3a1f20;--wrong:#ef5350;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.65 Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--edge)}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- header ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px;padding:12px 26px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--brand)}
h1{margin:2px 0 0;font:700 21px/1.25 var(--font-heading)}
header small{color:var(--muted);font-size:12.5px}
.toolbar{display:flex;gap:10px}

/* ---------- pages / panes ---------- */
.page{display:none}
.page.active{display:block}
.workspace{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;padding:18px 22px 108px;height:calc(100vh - 84px)}
.pane{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-y:auto;padding:22px 26px;min-height:0}
.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--brand)}
.passage-title{margin:4px 0 8px;font:700 24px/1.3 var(--font-heading)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 16px;font-size:12.5px;color:var(--muted);align-items:center}
.legend .lg-box{display:inline-block;width:18px;height:12px;vertical-align:-1px;margin-right:6px;background:var(--ctx-bg);border:1px solid var(--ctx-border);border-radius:3px}
.legend mark.answer-hl{padding:0 4px}

/* ---------- passage paragraphs ---------- */
.passage-p{margin:0 0 14px;padding:10px 12px 8px;border-radius:12px;border-left:3px solid transparent;scroll-margin-top:12px}
.passage-p.active-context{border-left-color:var(--brand);background:var(--soft)}
.paragraph-text{font-size:17.5px;line-height:1.85;text-align:left;color:var(--text)}

/* Paragraph labels — SAME values as the Test file (size / weight / shape / colour) */
.para-label{
  display:flex;align-items:center;width:fit-content;
  font-family:var(--font-heading);font-size:16px;font-weight:700;letter-spacing:.02em;line-height:1.3;
  color:var(--brand-dark);background:var(--brand-tint);border:1px solid var(--brand);border-radius:999px;
  padding:4px 14px;margin:4px 0 10px 0;text-align:left;-webkit-user-select:none;user-select:none;
}

/* Layer 1: Context Box — thin black rectangle, light-red fill, around the whole context.
   Layer 2: Answer Highlight — yellow, black text, only the decisive words. Both show together. */
.context-box{
  display:block;margin:8px 0;padding:9px 14px;
  background:var(--ctx-bg);border:1px solid var(--ctx-border);border-radius:6px;
}
mark.answer-hl{background:var(--gold);color:var(--goldtext);border-radius:4px;padding:1px 3px;font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone}
/* Layer 3 (Matching Names only): person / reference chain — medium blue, never green, never louder than the yellow */
.ref-name{color:var(--ref);background:var(--ref-bg);border-bottom:2px solid var(--ref);border-radius:3px;padding:0 2px;font-weight:700}
mark.answer-hl .ref-name{color:var(--ref-strong);background:transparent}
[data-theme=dark] mark.answer-hl .ref-name{color:#1D4ED8}
.legend .ref-name{font-weight:700}

/* ---------- question pane ---------- */
.hint{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.section-title{font:700 18px/1.4 var(--font-heading);border-bottom:1px solid var(--line);border-left:3px solid var(--brand);padding:6px 0 6px 10px;margin:22px 0 6px}
.section-title:first-of-type{margin-top:6px}
.q-instr{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.word-box{margin:10px 0 14px;border:1px solid var(--edge);border-radius:8px;overflow:hidden;background:var(--soft)}
.word-box-title{padding:8px 12px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:1.4px;font-weight:700}
.word-options{border-collapse:collapse;width:100%;table-layout:fixed;font-size:14px}
.word-options td{width:50%;border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;overflow-wrap:anywhere}
.word-options td+td{border-left:1px solid var(--line)}
.word-options tr:last-child td{border-bottom:0}
.option-letter{display:inline-block;font-size:12px;font-weight:700;min-width:22px;color:var(--focus)}

.question-block{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px;background:var(--card);transition:border-color .18s,box-shadow .18s}
.question-block:hover{border-color:var(--edge)}
.question-block.active-question{border:1.5px solid var(--brand);box-shadow:0 0 0 5px #15934e0f}
.question-block p{margin:0 0 8px}
.question-number{display:inline-block;background:#202020;color:#fff;border-radius:6px;padding:1px 8px;margin-right:6px;font-weight:700;line-height:1.6}
[data-theme=dark] .question-number{background:#e7e7e7;color:#202020}
.q-label{font-size:12.5px;color:var(--muted)}
.btn-answer{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;padding:5px 14px;border-radius:8px;font-size:13.5px}
[data-theme=dark] .btn-answer{color:#0b1a12}
.btn-answer:hover{filter:brightness(1.1);border-color:var(--brand)}
.explanation-box{display:none;margin-top:10px;padding:10px 14px;background:var(--soft);border-left:3px solid var(--brand);border-radius:8px;font-size:14.5px}
.explanation-box.show{display:block}
.explanation-box .ans{font-weight:700}
.explanation-box p{margin:6px 0 0}

/* MCQ */
.choice-item{border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:7px 0;cursor:pointer;font-size:14.5px;display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap}
.choice-item:hover{border-color:var(--edge)}
.choice-item .cl{display:inline-flex;align-items:center;justify-content:center;flex:0 0 26px;width:26px;height:26px;border:1.5px solid var(--edge);border-radius:50%;font-weight:600;font-size:12.5px;color:var(--muted)}
.choice-item .ct{flex:1 1 200px}
.choice-item.selected{border-color:var(--brand);box-shadow:0 0 0 2px #15934e14}
.choice-item.is-correct{border-color:var(--brand);background:var(--correct-bg)}
.choice-item.is-correct .cl{background:var(--brand);border-color:var(--brand);color:#fff}
.choice-item.is-wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.mcq-info-box{display:none;flex-basis:100%;margin:4px 0 0 35px;padding:7px 10px;border-left:2px solid var(--edge);background:var(--soft);border-radius:6px;font-size:13.5px}
.mcq-info-box.show{display:block}

/* summary with gaps — inline correction */
.gap-wrap{white-space:nowrap}
.ans-btn{display:inline;font-size:11.5px;font-weight:700;line-height:1.5;padding:0 7px;margin-left:3px;border-radius:6px;color:var(--brand-dark);background:var(--brand-tint);border:1px solid var(--brand);vertical-align:baseline}
.ans-btn:hover{filter:brightness(.96);border-color:var(--brand)}
.ans-btn[aria-expanded=true]{background:var(--brand);color:#fff}
[data-theme=dark] .ans-btn[aria-expanded=true]{color:#08130d}
.inline-exp{display:block;margin:8px 0 12px;padding:10px 14px;background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;font-size:14.5px;line-height:1.65;white-space:normal}
.inline-exp .ie-head{display:block;font:700 12px/1.4 var(--font-heading);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.inline-exp .ie-ans{display:block;font-weight:700;margin-bottom:4px}
.inline-exp .ie-quote{display:block;margin:2px 0 4px}
.inline-exp .ie-loc{font-size:12px;font-weight:700;color:var(--brand-dark);margin-right:6px}
.inline-exp .ie-body{display:block;margin-top:4px}
/* summary with gaps */
.summary-group{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 16px;background:var(--card)}
.summary-prose{padding:14px 16px;font-size:15px;line-height:1.95}
.summary-prose h3{font:700 17px/1.5 var(--font-heading);margin:0 0 8px}
.summary-prose p{margin:0 0 12px}
.summary-gap{display:inline;border:0;border-bottom:1px solid var(--edge);border-radius:3px;padding:1px 4px;font:inherit;line-height:inherit;background:transparent;color:inherit}
.summary-gap strong{font-size:12px;margin-right:3px}
.summary-gap:hover,.summary-gap.active-gap{background:var(--soft);border-bottom-color:var(--brand)}
.summary-gap.filled{color:var(--brand-dark);font-weight:700;border-bottom-color:var(--brand)}
.summary-gap.filled .blank-space{font-weight:700}
.pending-note{font-size:12.5px;color:var(--muted);margin:0 0 8px}
/* notes completion: section headings + bullet lines, same card as a summary */
.summary-prose p.notes-h{font:700 15px/1.5 var(--font-heading);color:var(--brand-dark);margin:14px 0 2px}
.summary-prose p.notes-h:first-of-type{margin-top:2px}
.summary-prose p.notes-li{position:relative;margin:0 0 6px;padding-left:20px}
.summary-prose p.notes-li::before{content:'•';position:absolute;left:5px;color:var(--muted)}
/* matching headings: the dashed box at the head of each section shows the correct heading */
.head-box{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 10px;width:100%;box-sizing:border-box;margin:0 0 10px;padding:8px 12px;border:1.5px dashed var(--brand);border-radius:8px;background:var(--brand-tint);color:var(--text);font:inherit;cursor:pointer;text-align:center}
.head-box:hover{filter:brightness(.97)}
.head-box.active{border-style:solid;box-shadow:0 0 0 4px #15934e1f}
.head-box .hb-n{font:800 16px var(--font-heading)}
.head-box .hb-sec{font-size:12.5px;font-weight:600;color:var(--muted)}
.head-box .hb-ans{font-weight:700;color:var(--brand-dark)}
.option-letter.lbl{min-width:34px}
.summary-prose p.notes-li2{padding-left:42px}
.summary-prose p.notes-li2::before{content:'\25E6';left:26px}

/* ---------- vocabulary pages ---------- */
.vocab-wrap{max-width:900px;margin:0 auto;padding:22px 22px 120px}
.vocab-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.vocab-head h2{margin:0;font:700 22px var(--font-heading)}
.vocab-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.vocab-list details{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 8px;padding:0}
.vocab-list summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.vocab-list summary::-webkit-details-marker{display:none}
.vocab-list summary .pos{font-weight:400;color:var(--muted);font-size:13px}
.vocab-list details[open]{border-color:var(--brand)}
.vocab-list .vbody{padding:0 14px 12px;font-size:14.5px}
.vocab-list .vbody p{margin:4px 0}
.vocab-list .ex{color:var(--muted)}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;width:780px;max-width:calc(100% - 24px);padding:7px;background:#202020;border-radius:999px;box-shadow:0 10px 28px #0003}
.dock button{background:transparent;border:0;color:#c6c6c6;border-radius:999px;padding:10px 8px;font-weight:600;font-size:13px}
.dock button:hover{background:#303030;color:#fff}
.dock button[aria-current=page]{background:var(--brand);color:#fff}
[data-theme=dark] .dock button[aria-current=page]{color:#08130d}

/* ---------- vocabulary pop-up (centre of screen) ---------- */
.vmodal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(20,27,46,.5);padding:16px}
.vmodal[hidden]{display:none}
.vcard{position:relative;width:100%;max-width:440px;background:var(--card);color:var(--text);border-radius:16px;box-shadow:0 18px 50px #0005;padding:24px 24px 18px;border-top:5px solid var(--brand)}
.vclose{position:absolute;right:10px;top:10px;width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;background:transparent}
.vword{font:700 26px/1.25 var(--font-heading);margin:0 34px 10px 0;overflow-wrap:anywhere}
.vexample{font-size:16px;line-height:1.6;margin:0 0 14px}
.vexample .k{color:var(--muted);font-weight:600;margin-right:4px}
.vexample strong{background:var(--gold);color:var(--goldtext);border-radius:3px;padding:0 3px}
.vmeaning{font-size:16px;line-height:1.6;margin:0 0 14px;padding:10px 12px;background:var(--soft);border-left:3px solid var(--brand);border-radius:8px}
.vmeaning .k{font-weight:700;margin-right:4px}
.vnone{font-size:15px;color:var(--muted);margin:0 0 12px}
.vactions{display:flex;justify-content:flex-end;gap:8px}
.btn-reveal{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
[data-theme=dark] .btn-reveal{color:#08130d}

/* ---------- responsive / print ---------- */
@media(max-width:900px){
  header{padding:12px 16px}
  h1{font-size:17px}
  .workspace{display:block;height:auto;padding:12px 12px 108px}
  .pane{overflow:visible;margin-bottom:14px;padding:16px}
  .paragraph-text{font-size:16.5px}
  .dock{width:380px;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:24px}
  .dock button{padding:8px;font-size:12px}
}
@media print{
  header,.dock,.btn-answer,.vmodal{display:none!important}
  .page.active{display:block}
  .workspace{display:block;height:auto}
  .pane{overflow:visible;border:0;box-shadow:none}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">LEVEL UP · READING STUDIO</div>
    <h1>Cambridge 16 · Reading Test 4</h1>
    <small id="subtitle">Reading correction · 3 passages / 40 questions</small>
  </div>
  <div class="toolbar">
    <button id="reset" type="button">Ẩn lời giải</button>
    <button id="theme" type="button" aria-pressed="false">◐ Dark mode</button>
  </div>
</header>
<main id="app"></main>
<nav class="dock" aria-label="Điều hướng bài đọc và từ vựng"></nav>

<div class="vmodal" id="vmodal" hidden role="dialog" aria-modal="true" aria-labelledby="vm-word">
  <div class="vcard">
    <button type="button" class="vclose" id="vm-close" aria-label="Đóng">×</button>
    <div class="vword" id="vm-word"></div>
    <div class="vexample" id="vm-example"></div>
    <div class="vmeaning" id="vm-meaning" hidden></div>
    <div class="vnone" id="vm-none" hidden></div>
    <div class="vactions"><button type="button" class="btn-reveal" id="vm-reveal">Reveal meaning</button></div>
  </div>
</div>

<script>
const DATA={"parts": [{"title": "Roman tunnels", "subtitle": "The Romans, who once controlled areas of Europe, North Africa and Asia Minor, adopted the construction techniques of other civilizations to build tunnels in their territories", "paras": [{"label": null, "text": "The Persians, who lived in present-day Iran, were one of the first civilizations to build tunnels that provided a reliable supply of water to human settlements in dry areas. In the early first millennium BCE, they introduced the qanat method of tunnel construction, which consisted of placing posts over a hill in a straight line, to ensure that the tunnel kept to its route, and then digging vertical shafts down into the ground at regular intervals. Underground, workers removed the earth from between the ends of the shafts, creating a tunnel. The excavated soil was taken up to the surface using the shafts, which also provided ventilation during the work. Once the tunnel was completed, it allowed water to flow from the top of a hillside down towards a canal, which supplied water for human use. Remarkably, some qanats built by the Persians 2,700 years ago are still in use today."}, {"label": null, "text": "They later passed on their knowledge to the Romans, who also used the qanat method to construct water-supply tunnels for agriculture. Roman qanat tunnels were constructed with vertical shafts dug at intervals of between 30 and 60 meters. The shafts were equipped with handholds and footholds to help those climbing in and out of them and were covered with a wooden or stone lid. To ensure that the shafts were vertical, Romans hung a plumb line from a rod placed across the top of each shaft and made sure that the weight at the end of it hung in the center of the shaft. Plumb lines were also used to measure the depth of the shaft and to determine the slope of the tunnel. The 5.6-kilometer-long Claudius tunnel, built in 41 CE to drain the Fucine Lake in central Italy, had shafts that were up to 122 meters deep, took 11 years to build and involved approximately 30,000 workers."}, {"label": null, "text": "By the 6th century BCE, a second method of tunnel construction appeared called the counter-excavation method, in which the tunnel was constructed from both ends. It was used to cut through high mountains when the qanat method was not a practical alternative. This method required greater planning and advanced knowledge of surveying, mathematics and geometry as both ends of a tunnel had to meet correctly at the center of the mountain. Adjustments to the direction of the tunnel also had to be made whenever builders encountered geological problems or when it deviated from its set path. They constantly checked the tunnel’s advancing direction, for example, by looking back at the light that penetrated through the tunnel mouth, and made corrections whenever necessary. Large deviations could happen, and they could result in one end of the tunnel not being usable. An inscription written on the side of a 428-meter tunnel, built by the Romans as part of the Saldae aqueduct system in modern-day Algeria, describes how the two teams of builders missed each other in the mountain and how the later construction of a lateral link between both corridors corrected the initial error."}, {"label": null, "text": "The Romans dug tunnels for their roads using the counter-excavation method, whenever they encountered obstacles such as hills or mountains that were too high for roads to pass over. An example is the 37-meter-long, 6-meter-high, Furlo Pass Tunnel built in Italy in 69-79 CE. Remarkably, a modern road still uses this tunnel today. Tunnels were also built for mineral extraction. Miners would locate a mineral vein and then pursue it with shafts and tunnels underground. Traces of such tunnels used to mine gold can still be found at the Dolaucothi mines in Wales. When the sole purpose of a tunnel was mineral extraction, construction required less planning, as the tunnel route was determined by the mineral vein."}, {"label": null, "text": "Roman tunnel projects were carefully planned and carried out. The length of time it took to construct a tunnel depended on the method being used and the type of rock being excavated. The qanat construction method was usually faster than the counter-excavation method as it was more straightforward. This was because the mountain could be excavated not only from the tunnel mouths but also from shafts. The type of rock could also influence construction times. When the rock was hard, the Romans employed a technique called fire quenching which consisted of heating the rock with fire, and then suddenly cooling it with cold water so that it would crack. Progress through hard rock could be very slow, and it was not uncommon for tunnels to take years, if not decades, to be built. Construction marks left on a Roman tunnel in Bologna show that the rate of advance through solid rock was 30 centimeters per day. In contrast, the rate of advance of the Claudius tunnel can be calculated at 1.4 meters per day. Most tunnels had inscriptions showing the names of patrons who ordered construction and sometimes the name of the architect. For example, the 1.4-kilometer Çevlik tunnel in Turkey, built to divert the floodwater threatening the harbor of the ancient city of Seleuceia Pieria, had inscriptions on the entrance, still visible today, that also indicate that the tunnel was started in 69 CE and was completed in 81 CE."}], "groups": [{"kind": "match", "title": "Questions 1–6", "instr": "Label the diagrams below. Choose ONE WORD ONLY from the passage for each answer.", "qs": [1, 2, 3, 4, 5, 6]}, {"kind": "tfng", "title": "Questions 7–10", "instr": "Do the following statements agree with the information given in Reading Passage 1? TRUE if the statement agrees with the information · FALSE if the statement contradicts the information · NOT GIVEN if there is no information on this.", "qs": [7, 8, 9, 10]}, {"kind": "match", "title": "Questions 11–13", "instr": "Answer the questions below. Choose NO MORE THAN TWO WORDS from the passage for each answer.", "qs": [11, 12, 13]}]}, {"title": "Changes in reading habits", "subtitle": "What are the implications of the way we read today?", "paras": [{"label": null, "text": "Look around on your next plane trip. The iPad is the new pacifier for babies and toddlers. Younger school-aged children read stories on smartphones; older kids don’t read at all, but hunch over video games. Parents and other passengers read on tablets or skim a flotilla of email and news feeds. Unbeknown to most of us, an invisible, game-changing transformation links everyone in this picture: the neuronal circuit that underlies the brain’s ability to read is subtly, rapidly changing and this has implications for everyone from the pre-reading toddler to the expert adult."}, {"label": null, "text": "As work in neurosciences indicates, the acquisition of literacy necessitated a new circuit in our species’ brain more than 6,000 years ago. That circuit evolved from a very simple mechanism for decoding basic information, like the number of goats in one’s herd, to the present, highly elaborated reading brain. My research depicts how the present reading brain enables the development of some of our most important intellectual and affective processes: internalized knowledge, analogical reasoning, and inference; perspective-taking and empathy; critical analysis and the generation of insight. Research surfacing in many parts of the world now cautions that each of these essential ‘deep reading’ processes may be under threat as we move into digital-based modes of reading."}, {"label": null, "text": "This is not a simple, binary issue of print versus digital reading and technological innovations. As MIT scholar Sherry Turkle has written, we do not err as a society when we innovate but when we ignore what we disrupt or diminish while innovating. In this hinge moment between print and digital cultures, society needs to confront what is diminishing in the expert reading circuit, what our children and older students are not developing, and what we can do about it."}, {"label": null, "text": "We know from research that the reading circuit is not given to human beings through a genetic blueprint like vision or language; it needs an environment to develop. Further, it will adapt to that environment’s requirements - from different writing systems to the characteristics of whatever medium is used. If the dominant medium advantages processes that are fast, multi-task oriented and well-suited for large volumes of information, like the current digital medium, so will the reading circuit. As UCLA psychologist Patricia Greenfield writes, the result is that less attention and time will be allocated to slower, time-demanding deep reading processes."}, {"label": null, "text": "Increasing reports from educators and from researchers in psychology and the humanities bear this out. English literature scholar and teacher Mark Edmundson describes how many college students actively avoid the classic literature of the 19th and 20th centuries in favour of something simpler as they no longer have the patience to read longer, denser, more difficult texts. We should be less concerned with students’ ‘cognitive impatience’, however, than by what may underlie it: the potential inability of large numbers of students to read with a level of critical analysis sufficient to comprehend the complexity of thought and argument found in more demanding texts."}, {"label": null, "text": "Multiple studies show that digital screen use may be causing a variety of troubling downstream effects on reading comprehension in older high school and college students. In Stavanger, Norway, psychologist Anne Mangen and colleagues studied how high school students comprehend the same material in different mediums. Mangen’s group asked subjects questions about a short story whose plot had universal student appeal; half of the students read the story on a tablet, the other half in paperback. Results indicated that students who read on print were superior in their comprehension to screen-reading peers, particularly in their ability to sequence detail and reconstruct the plot in chronological order."}, {"label": null, "text": "Ziming Liu from San Jose State University has conducted a series of studies which indicate that the ‘new norm’ in reading is skimming, involving word-spotting and browsing through the text. Many readers now use a pattern when reading in which they sample the first line and then word-spot through the rest of the text. When the reading brain skims like this, it reduces time allocated to deep reading processes. In other words, we don’t have time to grasp complexity, to understand another’s feelings, to perceive beauty, and to create thoughts of the reader’s own."}, {"label": null, "text": "The possibility that critical analysis, empathy and other deep reading processes could become the unintended ‘collateral damage’ of our digital culture is not a straightforward binary issue about print versus digital reading. It is about how we all have begun to read on various mediums and how that changes not only what we read, but also the purposes for which we read. Nor is it only about the young. The subtle atrophy of critical analysis and empathy affects us all equally. It affects our ability to navigate a constant bombardment of information. It incentivizes a retreat to the most familiar stores of unchecked information, which require and receive no analysis, leaving us susceptible to false information and irrational ideas."}, {"label": null, "text": "There’s an old rule in neuroscience that does not alter with age: use it or lose it. It is a very hopeful principle when applied to critical thought in the reading brain because it implies choice. The story of the changing reading brain is hardly finished. We possess both the science and the technology to identify and redress the changes in how we read before they become entrenched. If we work to understand exactly what we will lose, alongside the extraordinary new capacities that the digital world has brought us, there is as much reason for excitement as caution."}], "groups": [{"kind": "mcq", "title": "Questions 14–17", "instr": "Choose the correct letter, A, B, C or D.", "qs": [14, 15, 16, 17]}, {"kind": "wordlist", "title": "Questions 18–22", "instr": "Complete the summary using the list of words, A–H, below. Write the correct letter, A–H.", "qs": [18, 19, 20, 21, 22], "summary": {"title": "Studies on digital screen use", "paras": ["There have been many studies on digital screen use, showing some {18} trends. Psychologist Anne Mangen gave high-school students a short story to read, half using digital and half using print mediums. Her team then used a question-and-answer technique to find out how {19} each group’s understanding of the plot was. The findings showed a clear pattern in the responses, with those who read screens finding the order of information {20} to recall.", "Studies by Ziming Liu show that students are tending to read {21} words and phrases in a text to save time. This approach, she says, gives the reader a superficial understanding of the {22} content of material, leaving no time for thought."], "styles": ["", ""]}, "bank": {"title": "List of Words", "items": ["fast", "isolated", "emotional", "worrying", "many", "hard", "combined", "thorough"]}}, {"kind": "tfng", "title": "Questions 23–26", "instr": "Do the following statements agree with the views of the writer in Reading Passage 2? YES if the statement agrees with the views of the writer · NO if the statement contradicts the views of the writer · NOT GIVEN if it is impossible to say what the writer thinks about this.", "qs": [23, 24, 25, 26]}]}, {"title": "Attitudes towards Artificial Intelligence", "subtitle": null, "paras": [{"label": null, "sec": "A", "text": "Artificial intelligence (AI) can already predict the future. Police forces are using it to map when and where crime is likely to occur. Doctors can use it to predict when a patient is most likely to have a heart attack or stroke. Researchers are even trying to give AI imagination so it can plan for unexpected consequences.", "hq": 27}, {"label": null, "sec": "A", "text": "Many decisions in our lives require a good forecast, and AI is almost always better at forecasting than we are. Yet for all these technological advances, we still seem to deeply lack confidence in AI predictions. Recent cases show that people don’t like relying on AI and prefer to trust human experts, even if these experts are wrong."}, {"label": null, "sec": "A", "text": "If we want AI to really benefit people, we need to find a way to get people to trust it. To do that, we need to understand why people are so reluctant to trust AI in the first place."}, {"label": null, "sec": "B", "text": "Take the case of Watson for Oncology, one of technology giant IBM’s supercomputer programs. Their attempt to promote this program to cancer doctors was a PR disaster. The AI promised to deliver top-quality recommendations on the treatment of 12 cancers that accounted for 80% of the world’s cases. But when doctors first interacted with Watson, they found themselves in a rather difficult situation. On the one hand, if Watson provided guidance about a treatment that coincided with their own opinions, physicians did not see much point in Watson’s recommendations. The supercomputer was simply telling them what they already knew, and these recommendations did not change the actual treatment.", "hq": 28}, {"label": null, "sec": "B", "text": "On the other hand, if Watson generated a recommendation that contradicted the experts’ opinion, doctors would typically conclude that Watson wasn’t competent. And the machine wouldn’t be able to explain why its treatment was plausible because its machine-learning algorithms were simply too complex to be fully understood by humans. Consequently, this has caused even more suspicion and disbelief, leading many doctors to ignore the seemingly outlandish AI recommendations and stick to their own expertise."}, {"label": null, "sec": "C", "text": "This is just one example of people’s lack of confidence in AI and their reluctance to accept what AI has to offer. Trust in other people is often based on our understanding of how others think and having experience of their reliability. This helps create a psychological feeling of safety. AI, on the other hand, is still fairly new and unfamiliar to most people. Even if it can be technically explained (and that’s not always the case), AI’s decision-making process is usually too difficult for most people to comprehend. And interacting with something we don’t understand can cause anxiety and give us a sense that we’re losing control.", "hq": 29}, {"label": null, "sec": "C", "text": "Many people are also simply not familiar with many instances of AI actually working, because it often happens in the background. Instead, they are acutely aware of instances where AI goes wrong. Embarrassing AI failures receive a disproportionate amount of media attention, emphasising the message that we cannot rely on technology. Machine learning is not foolproof, in part because the humans who design it aren’t."}, {"label": null, "sec": "D", "text": "Feelings about AI run deep. In a recent experiment, people from a range of backgrounds were given various sci-fi films about AI to watch and then asked questions about automation in everyday life. It was found that, regardless of whether the film they watched depicted AI in a positive or negative light, simply watching a cinematic vision of our technological future polarised the participants’ attitudes. Optimists became more extreme in their enthusiasm for AI and sceptics became even more guarded.", "hq": 30}, {"label": null, "sec": "D", "text": "This suggests people use relevant evidence about AI in a biased manner to support their existing attitudes, a deep-rooted human tendency known as “confirmation bias”. As AI is represented more and more in media and entertainment, it could lead to a society split between those who benefit from AI and those who reject it. More pertinently, refusing to accept the advantages offered by AI could place a large group of people at a serious disadvantage."}, {"label": null, "sec": "E", "text": "Fortunately, we already have some ideas about how to improve trust in AI. Simply having previous experience with AI can significantly improve people’s opinions about the technology, as was found in the study mentioned above. Evidence also suggests the more you use other technologies such as the internet, the more you trust them.", "hq": 31}, {"label": null, "sec": "E", "text": "Another solution may be to reveal more about the algorithms which AI uses and the purposes they serve. Several high-profile social media companies and online marketplaces already release transparency reports about government requests and surveillance disclosures. A similar practice for AI could help people have a better understanding of the way algorithmic decisions are made."}, {"label": null, "sec": "F", "text": "Research suggests that allowing people some control over AI decision-making could also improve trust and enable AI to learn from human experience. For example, one study showed that when people were allowed the freedom to slightly modify an algorithm, they felt more satisfied with its decisions, more likely to believe it was superior and more likely to use it in the future.", "hq": 32}, {"label": null, "sec": "F", "text": "We don’t need to understand the intricate inner workings of AI systems, but if people are given a degree of responsibility for how they are implemented, they will be more willing to accept AI into their lives."}], "groups": [{"kind": "match", "title": "Questions 27–32", "instr": "Reading Passage 3 has six sections, A–F. Choose the correct heading for each section from the list of headings below. Write the correct number, i–viii. The answer boxes are at the start of each section in the passage.", "qs": [27, 28, 29, 30, 31, 32], "bank": {"title": "List of Headings", "items": ["An increasing divergence of attitudes towards AI", "Reasons why we have more faith in human judgement than in AI", "The superiority of AI projections over those made by humans", "The process by which AI can help us make good decisions", "The advantages of involving users in AI processes", "Widespread distrust of an AI innovation", "Encouraging openness about how AI functions", "A surprisingly successful AI application"], "labels": ["i", "ii", "iii", "iv", "v", "vi", "vii", "viii"]}}, {"kind": "mcq", "title": "Questions 33–35", "instr": "Choose the correct letter, A, B, C or D.", "qs": [33, 34, 35]}, {"kind": "tfng", "title": "Questions 36–40", "instr": "Do the following statements agree with the claims of the writer in Reading Passage 3? YES if the statement agrees with the claims of the writer · NO if the statement contradicts the claims of the writer · NOT GIVEN if it is impossible to say what the writer thinks about this.", "qs": [36, 37, 38, 39, 40]}]}], "questions": {"1": {"exp": "Paragraph 1: người Ba Tư đặt “posts over a hill in a straight line, to ensure that the tunnel kept to its route” → các cột mốc (posts) dùng để định hướng cho việc đào đường hầm (to direct the tunnelling) → posts.", "ev": [{"p": 0, "s": 174, "e": 451, "hl": [[285, 374]], "blue": []}], "ansShow": "posts", "text": "Sơ đồ The Persian Qanat Method: ______ to direct the tunnelling", "qhl": [[39, 63]]}, "2": {"exp": "Paragraph 1: đường hầm hoàn thành “allowed water to flow from the top of a hillside down towards a canal, which supplied water for human use” → nước chảy vào một con kênh (canal) để người dân địa phương sử dụng → canal.", "ev": [{"p": 0, "s": 661, "e": 801, "hl": [[744, 800]], "blue": []}], "ansShow": "canal", "text": "Sơ đồ The Persian Qanat Method: water runs into a ______ used by local people", "qhl": [[32, 49], [57, 77]]}, "3": {"exp": "Paragraph 1: “The excavated soil was taken up to the surface using the shafts, which also provided ventilation during the work” → các giếng đứng dùng để đưa đất lên và để thông gió (ventilation) → ventilation.", "ev": [{"p": 0, "s": 547, "e": 660, "hl": [[612, 659]], "blue": []}], "ansShow": "ventilation", "text": "Sơ đồ The Persian Qanat Method: vertical shafts to remove earth and for ______", "qhl": [[32, 71]]}, "4": {"exp": "Paragraph 2: giếng của người La Mã “were covered with a wooden or stone lid” → nắp (lid) làm bằng gỗ hoặc đá → lid.", "ev": [{"p": 1, "s": 238, "e": 378, "hl": [[338, 377]], "blue": []}], "ansShow": "lid", "text": "Sơ đồ Cross-section of a Roman Qanat Shaft: ______ made of wood or stone", "qhl": [[51, 72]]}, "5": {"exp": "Paragraph 2: “Romans hung a plumb line from a rod … and made sure that the weight at the end of it hung in the center of the shaft” → vật nặng (weight) gắn ở đầu dây dọi → weight.", "ev": [{"p": 1, "s": 379, "e": 571, "hl": [[511, 570]], "blue": []}], "ansShow": "weight", "text": "Sơ đồ Cross-section of a Roman Qanat Shaft: ______ attached to the plumb line", "qhl": [[51, 77]]}, "6": {"exp": "Paragraph 2: “The shafts were equipped with handholds and footholds to help those climbing in and out of them” → chỗ bám tay và chỗ đặt chân dùng để leo (climbing) lên xuống → climbing.", "ev": [{"p": 1, "s": 238, "e": 333, "hl": [[292, 333]], "blue": []}], "ansShow": "climbing", "text": "Sơ đồ Cross-section of a Roman Qanat Shaft: handholds and footholds used for ______", "qhl": [[44, 76]]}, "7": {"exp": "Paragraph 3: phương pháp counter-excavation “was used to cut through high mountains when the qanat method was not a practical alternative” → chỉ dùng khi qanat không khả thi. Paragraph 2: đường hầm Claudius (41 CE) vẫn có các giếng sâu tới 122 m → vẫn dùng qanat sau thế kỷ 6 TCN. Vậy phương pháp mới không thay thế hoàn toàn qanat → FALSE.", "ev": [{"p": 1, "s": 675, "e": 882, "hl": [[773, 815]], "blue": []}, {"p": 2, "s": 0, "e": 258, "hl": [[162, 257]], "blue": []}], "ansShow": "FALSE", "text": "The counter-excavation method completely replaced the qanat method in the 6th century BCE.", "qhl": [[30, 66]]}, "8": {"exp": "Paragraph 3: bài chỉ nói phương pháp này “required greater planning and advanced knowledge of surveying, mathematics and geometry”. Không nói chỉ những thợ xây có kinh nghiệm mới được thuê → NOT GIVEN.", "ev": [{"p": 2, "s": 259, "e": 436, "hl": [[259, 358]], "blue": []}], "ansShow": "NOT GIVEN", "text": "Only experienced builders were employed to construct a tunnel using the counter-excavation method.", "qhl": [[0, 39]]}, "9": {"exp": "Paragraph 3: thông tin về sự cố ở hệ thống dẫn nước Saldae đến từ “An inscription written on the side of a 428-meter tunnel” – dòng chữ khắc trên thành đường hầm, không phải từ một cuốn sách cổ → FALSE.", "ev": [{"p": 2, "s": 868, "e": 1181, "hl": [[868, 924]], "blue": []}], "ansShow": "FALSE", "text": "The information about a problem that occurred during the construction of the Saldae aqueduct system was found in an ancient book.", "qhl": [[100, 128]]}, "10": {"exp": "Paragraph 3: dòng chữ khắc “describes how the two teams of builders missed each other in the mountain” → hai nhóm thợ không gặp nhau (two parts failed to meet), về sau phải làm thêm đường nối ngang để sửa lỗi → TRUE.", "ev": [{"p": 2, "s": 868, "e": 1181, "hl": [[1007, 1080]], "blue": []}], "ansShow": "TRUE", "text": "The mistake made by the builders of the Saldae aqueduct system was that the two parts of the tunnel failed to meet.", "qhl": [[72, 114]]}, "11": {"exp": "Paragraph 4: “Traces of such tunnels used to mine gold can still be found at the Dolaucothi mines in Wales” → khoáng sản được khai thác ở mỏ Dolaucothi là vàng (gold) → gold.", "ev": [{"p": 3, "s": 470, "e": 563, "hl": [[470, 562]], "blue": []}], "ansShow": "gold", "text": "What type of mineral were the Dolaucothi mines in Wales built to extract?", "qhl": [[0, 20], [30, 55]]}, "12": {"exp": "Paragraph 5: “Most tunnels had inscriptions showing the names of patrons who ordered construction and sometimes the name of the architect” → ngoài tên người bảo trợ (patron), đôi khi còn khắc tên kiến trúc sư (architect) → architect (đáp án chấp nhận: the architect / architect’s name…).", "ev": [{"p": 4, "s": 1008, "e": 1132, "hl": [[1096, 1131]], "blue": []}], "ansShow": "(the) architect(’s) (name)", "text": "In addition to the patron, whose name might be carved onto a tunnel?", "qhl": [[0, 25], [38, 67]]}, "13": {"exp": "Paragraph 5: “the 1.4-kilometer Çevlik tunnel in Turkey, built to divert the floodwater threatening the harbor of the ancient city of Seleuceia Pieria” → đường hầm được xây để bảo vệ bến cảng (harbour/harbor) → harbour / harbor.", "ev": [{"p": 4, "s": 1133, "e": 1283, "hl": [[1189, 1282]], "blue": []}], "ansShow": "(the) harbour / harbor", "text": "What part of Seleuceia Pieria was the Çevlik tunnel built to protect?", "qhl": [[0, 29], [52, 68]]}, "14": {"exp": "Paragraph 1: người viết mô tả cảnh trên máy bay rồi nói “Unbeknown to most of us, an invisible, game-changing transformation links everyone in this picture: the neuronal circuit that underlies the brain’s ability to read is subtly, rapidly changing” → công nghệ đang tác động ngầm lên chúng ta (hidden effect) → A.", "ev": [{"p": 0, "s": 296, "e": 576, "hl": [[296, 363], [396, 487]], "blue": []}], "ansShow": "A — Our use of technology is having a hidden effect on us.", "text": "What is the writer’s main point in the first paragraph?", "opts": ["Our use of technology is having a hidden effect on us.", "Technology can be used to help youngsters to read.", "Travellers should be encouraged to use technology on planes.", "Playing games is a more popular use of technology than reading."], "optExp": ["Đúng: “invisible, game-changing transformation” ≈ a hidden effect.", "Sai: đoạn nói công nghệ đang làm thay đổi não đọc, không nói công nghệ giúp trẻ học đọc.", "Sai: đoạn không khuyến khích hành khách dùng công nghệ; chỉ miêu tả cảnh trên máy bay.", "Sai: chơi game chỉ là một chi tiết minh họa, không phải ý chính và không so sánh mức độ phổ biến với việc đọc."], "correctIdx": 0, "qhl": [], "ohl": [0, 54]}, "15": {"exp": "Paragraph 3: “As MIT scholar Sherry Turkle has written, we do not err as a society when we innovate but when we ignore what we disrupt or diminish while innovating” → cần chú ý đến những gì có thể bị mất đi khi đổi mới → B.", "ev": [{"p": 2, "s": 98, "e": 248, "hl": [[140, 247]], "blue": [[113, 126]]}], "ansShow": "B — We should pay attention to what might be lost when innovation occurs.", "text": "What main point does Sherry Turkle make about innovation?", "opts": ["Technological innovation has led to a reduction in print reading.", "We should pay attention to what might be lost when innovation occurs.", "We should encourage more young people to become involved in innovation.", "There is a difference between developing products and developing ideas."], "optExp": ["Sai: bài nói đây không phải vấn đề đơn giản của “print versus digital”; Turkle không nói về việc đọc sách in giảm.", "Đúng: “ignore what we disrupt or diminish while innovating” ≈ pay attention to what might be lost.", "Sai: Turkle không nói cần khuyến khích thanh niên tham gia đổi mới.", "Sai: bài không phân biệt phát triển sản phẩm và phát triển ý tưởng."], "correctIdx": 1, "qhl": [], "ohl": [0, 69]}, "16": {"exp": "Paragraph 4: “the reading circuit is not given to human beings through a genetic blueprint … it needs an environment to develop. Further, it will adapt to that environment’s requirements” → mạch não đọc thích nghi với những gì môi trường đòi hỏi → D.", "ev": [{"p": 3, "s": 0, "e": 306, "hl": [[174, 222]], "blue": []}], "ansShow": "D — Some brain circuits adjust to whatever is required of them.", "text": "What point is the writer making in the fourth paragraph?", "opts": ["Humans have an inborn ability to read and write.", "Reading can be done using many different mediums.", "Writing systems make unexpected demands on the brain.", "Some brain circuits adjust to whatever is required of them."], "optExp": ["Sai: bài nói ngược lại — mạch đọc không có sẵn trong gen như thị giác hay ngôn ngữ.", "Sai: đoạn không chủ yếu nói đọc được bằng nhiều phương tiện khác nhau.", "Sai: đề cập hệ thống chữ viết chỉ là ví dụ về môi trường mà não thích nghi, không phải “unexpected demands”.", "Đúng: “it will adapt to that environment’s requirements” ≈ adjust to whatever is required of them."], "correctIdx": 3, "qhl": [], "ohl": [0, 59]}, "17": {"exp": "Paragraph 5: Edmundson mô tả “many college students actively avoid the classic literature of the 19th and 20th centuries in favour of something simpler as they no longer have the patience” → thái độ thiếu kiên nhẫn của sinh viên ảnh hưởng đến thứ họ chọn đọc → B.", "ev": [{"p": 4, "s": 103, "e": 374, "hl": [[193, 292]], "blue": [[142, 156]]}], "ansShow": "B — has influenced what they select to read.", "text": "According to Mark Edmundson, the attitude of college students", "opts": ["has changed the way he teaches.", "has influenced what they select to read.", "does not worry him as much as it does others.", "does not match the views of the general public."], "optExp": ["Sai: bài không nói thái độ của sinh viên làm Edmundson thay đổi cách dạy.", "Đúng: sinh viên tránh văn học kinh điển và chọn thứ đơn giản hơn ≈ influenced what they select to read.", "Sai: người viết (“We should be less concerned…”) mới là người nói nên bớt lo về sự thiếu kiên nhẫn; Edmundson thì mô tả hiện tượng.", "Sai: bài không đề cập quan điểm của công chúng."], "correctIdx": 1, "qhl": [], "ohl": [0, 40]}, "18": {"exp": "Paragraph 6: “digital screen use may be causing a variety of troubling downstream effects on reading comprehension” → các xu hướng đáng lo ngại (worrying trends) → D. (troubling ≈ worrying).", "ev": [{"p": 5, "s": 0, "e": 170, "hl": [[61, 102]], "blue": []}], "ansShow": "D  "hw": "competent", "pos": "adj", "f": ["competent"], "vn": "có năng lực", "ex": "The manager is competent and well trained.", "core": true}, {"part": 2, "hw": "plausible", "pos": "adj", "f": ["plausible"], "vn": "có vẻ hợp lý, đáng tin", "ex": "He gave a plausible explanation.", "core": true}, {"part": 2, "hw": "outlandish", "pos": "adj", "f": ["outlandish"], "vn": "kỳ quặc, khó tin", "ex": "The idea sounded outlandish at first.", "core": true}, {"part": 2, "hw": "comprehend", "pos": "v", "f": ["comprehend"], "vn": "hiểu, lĩnh hội", "ex": "Few people comprehend how the algorithm works.", "core": true}, {"part": 2, "hw": "foolproof", "pos": "adj", "f": ["foolproof"], "vn": "không thể sai sót", "ex": "No system is completely foolproof.", "core": true}, {"part": 2, "hw": "disproportionate", "pos": "adj", "f": ["disproportionate"], "vn": "không cân xứng, quá mức", "ex": "The media gave disproportionate attention to the failure.", "core": true}, {"part": 2, "hw": "polarise", "pos": "v", "f": ["polarised"], "vn": "phân cực, chia rẽ thành hai phe", "ex": "The debate polarised the public.", "core": true}, {"part": 2, "hw": "sceptic", "pos": "n", "f": ["sceptics"], "vn": "người hoài nghi", "ex": "Sceptics doubted the new technology.", "core": true}, {"part": 2, "hw": "confirmation bias", "pos": "n", "f": ["confirmation bias"], "vn": "thiên kiến xác nhận", "ex": "Confirmation bias makes us ignore opposing evidence.", "core": true}, {"part": 2, "hw": "pertinently", "pos": "adv", "f": ["pertinently"], "vn": "một cách thích đáng, đáng chú ý hơn cả", "ex": "More pertinently, the cost was very high.", "core": true}, {"part": 2, "hw": "transparency", "pos": "n", "f": ["transparency"], "vn": "sự minh bạch", "ex": "Companies publish transparency reports.", "core": true}, {"part": 2, "hw": "surveillance", "pos": "n", "f": ["surveillance"], "vn": "sự giám sát", "ex": "Surveillance cameras are common in cities.", "core": true}, {"part": 2, "hw": "intricate", "pos": "adj", "f": ["intricate"], "vn": "phức tạp, tinh vi", "ex": "We do not need to understand the intricate workings.", "core": true}, {"part": 2, "hw": "implement", "pos": "v", "f": ["implemented"], "vn": "triển khai, thực hiện", "ex": "The system was implemented last year.", "core": true}];

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Q=DATA.questions;                      // n -> question object
DATA.parts.forEach(p=>p.groups.forEach(g=>{if(g.kind==='mcq2')g.qs.slice(1).forEach(q=>{Q[q]=Q[g.qs[0]]})}));   // Choose TWO: both numbers share one card
const isCorrectIdx=(d,k)=>d.correctIdxs?d.correctIdxs.includes(k):k===d.correctIdx;
const PART_OF={};DATA.parts.forEach((p,i)=>p.groups.forEach(g=>g.qs.forEach(q=>PART_OF[q]=i)));

/* ------------------------------------------------------------------ passage rendering: Context Box + Answer Highlight */
function renderParagraph(text,ev){
  if(!ev) return esc(text);
  const blue=ev.blue||[];
  const seg=(a,b)=>{                      // text[a,b) with the blue person/reference spans
    let out='',last=a;
    blue.forEach(([bs,be])=>{const s0=Math.max(bs,a),e0=Math.min(be,b);if(s0<e0){out+=esc(text.slice(last,s0))+'<span class="ref-name">'+esc(text.slice(s0,e0))+'</span>';last=e0}});
    return out+esc(text.slice(last,b));
  };
  let inner='',last=ev.s;
  [...ev.hl].sort((a,b)=>a[0]-b[0]).forEach(([hs,he])=>{inner+=seg(last,hs)+'<mark class="answer-hl">'+seg(hs,he)+'</mark>';last=he});
  inner+=seg(last,ev.e);
  return esc(text.slice(0,ev.s))+'<span class="context-box">'+inner+'</span>'+esc(text.slice(ev.e));
}
// question side: yellow + bold on the phrases that map to the passage evidence
function markRanges(text,ranges){
  let out='',last=0;
  [...(ranges||[])].sort((a,b)=>a[0]-b[0]).forEach(([s0,e0])=>{out+=esc(text.slice(last,s0))+'<mark class="answer-hl">'+esc(text.slice(s0,e0))+'</mark>';last=e0});
  return out+esc(text.slice(last));
}
let ACTIVE=null;                           // question currently selected
const OPEN_ANS=new Set();                  // summary gaps whose inline answer is open
function clearPassage(part){
  $$('.passage-p',$('#r'+part)).forEach((el,i)=>{el.classList.remove('active-context');$('.paragraph-text',el).innerHTML=esc(DATA.parts[part].paras[i].text)});
}

/* ------------------------------------------------------------------ page construction */
function paragraphsHTML(part){
  return DATA.parts[part].paras.map((p,i)=>
    '<div class="passage-p" id="para-'+part+'-'+i+'" data-part="'+part+'" data-idx="'+i+'">'+
    (p.hq?'<button type="button" class="head-box" data-q="'+p.hq+'" aria-label="Heading '+p.hq+' – xem giải thích"><span class="hb-n">'+p.hq+'</span><span class="hb-sec">Section '+esc(p.sec)+'</span><span class="hb-ans">'+esc(Q[p.hq].hdText)+'</span></button>':p.label?'<div class="para-label">Section '+esc(p.label)+'</div>':'')+
    '<div class="paragraph-text">'+esc(p.text)+'</div></div>').join('');
}
const GROUP_OF={};DATA.parts.forEach(p=>p.groups.forEach(g=>g.qs.forEach(q=>GROUP_OF[q]=g)));
const isSummaryGroup=g=>g.kind==='summary'||g.kind==='wordlist';
function evidenceQuotes(q){
  const part=PART_OF[q];
  return Q[q].ev.map(e=>{
    const par=DATA.parts[part].paras[e.p],t=par.text;
    const label=par.sec?('Section '+par.sec):par.label?('Paragraph '+par.label):('Paragraph '+(e.p+1));
    return [...e.hl].sort((a,b)=>a[0]-b[0]).map(([s0,e0])=>'<span class="ie-quote"><span class="ie-loc">'+esc(label)+'</span>“<mark class="answer-hl">'+esc(t.slice(s0,e0))+'</mark>”</span>').join('');
  }).join('');
}
function inlineExp(q){
  return '<span class="inline-exp" id="ans'+q+'"><span class="ie-head">Evidence / Explanation</span><span class="ie-ans">Đáp án: '+esc(Q[q].ansShow)+'</span>'+evidenceQuotes(q)+'<span class="ie-body">'+esc(Q[q].exp)+'</span></span>';
}
function gapHTML(q){
  const open=OPEN_ANS.has(q);
  return '<span class="gap-wrap" data-q="'+q+'"><button type="button" class="summary-gap'+(open?' filled':'')+(ACTIVE===q?' active-gap':'')+'" data-q="'+q+'" aria-label="Question '+q+': xem bằng chứng"><strong>'+q+'</strong> <span class="blank-space" id="b'+q+'">'+(open?esc(Q[q].gapShow):'__________')+'</span></button> <button type="button" class="ans-btn" data-q="'+q+'" aria-expanded="'+open+'" aria-label="Answer '+q+'">(Ans)</button></span>'+(open?inlineExp(q):'');
}
function summaryParaHTML(g,pi){
  const text=g.summary.paras[pi];
  const act=(ACTIVE&&g.qs.includes(ACTIVE)&&Q[ACTIVE].qp===pi)?Q[ACTIVE].qhl:[];
  let out='',last=0;
  const re=/\{(\d+)\}/g;let m;
  const chunk=(a,b)=>{                    // text[a,b) with the yellow ranges that fall inside it
    const rs=act.map(([s0,e0])=>[Math.max(s0,a)-a,Math.min(e0,b)-a]).filter(([s0,e0])=>s0<e0);
    return markRanges(text.slice(a,b),rs);
  };
  while((m=re.exec(text))){out+=chunk(last,m.index)+gapHTML(+m[1]);last=m.index+m[0].length}
  return out+chunk(last,text.length);
}
function summaryInnerHTML(g){
  const st=g.summary.styles||[];
  return '<div class="summary-prose">'+(g.summary.title?'<h3>'+esc(g.summary.title)+'</h3>':'')+g.summary.paras.map((_,pi)=>'<p'+(st[pi]==='h'?' class="notes-h"':st[pi]==='li'?' class="notes-li"':st[pi]==='li2'?' class="notes-li notes-li2"':'')+'>'+summaryParaHTML(g,pi)+'</p>').join('')+'</div>';
}
function summaryHTML(g){return '<div class="summary-group" data-g="'+g.qs[0]+'">'+summaryInnerHTML(g)+'</div>'}
function refreshSummary(g,focusQ){
  const el=$('.summary-group[data-g="'+g.qs[0]+'"]');if(!el)return;
  el.innerHTML=summaryInnerHTML(g);
  if(focusQ){const b=$('.ans-btn[data-q="'+focusQ+'"]',el);if(b)b.focus({preventScroll:true})}
}
function answerBlock(q){
  const d=Q[q];
  return '<div class="explanation-box" id="ans'+q+'"><span class="ans">Đáp án: '+esc(d.ansShow)+'</span><p><em>Giải thích:</em> '+esc(d.exp)+'</p></div>';
}
function cardHTML(q,g){
  const d=Q[q];
  let body='';
  if(g.kind==='mcq'||g.kind==='mcq2'){
    const qLabel=g.kind==='mcq2'?(g.qs[0]+'–'+g.qs[g.qs.length-1]):q;
    body='<p><strong class="question-number">'+qLabel+'</strong><span class="q-text" data-q="'+q+'">'+esc(d.text)+'</span></p>'+d.opts.map((o,k)=>
      '<div class="choice-item" tabindex="0" data-k="'+k+'" role="button"><span class="cl">'+'ABCDE'[k]+'</span><span class="ct">'+esc(o)+'</span><div class="mcq-info-box">'+esc(d.optExp[k])+'</div></div>').join('');
  }else{
    body='<p><strong class="question-number">'+q+'</strong><span class="q-text" data-q="'+q+'">'+esc(d.text)+'</span></p>';
  }
  return '<div class="question-block" data-q="'+q+'" tabindex="0" aria-label="Câu '+q+' — định vị ngữ cảnh">'+body+
    '<button class="btn-answer" type="button" aria-expanded="false">Answer</button>'+answerBlock(q)+'</div>';
}
function refreshCard(q){
  const d=Q[q],block=$('.question-block[data-q="'+q+'"]');if(!block)return;
  const t=$('.q-text',block);if(t)t.innerHTML=markRanges(d.text,ACTIVE===q?d.qhl:[]);
  if(d.opts){
    const on=ACTIVE===q&&$('.explanation-box',block).classList.contains('show');
    $$('.choice-item',block).forEach((c,k)=>{const r=d.ohls?(d.ohls[k]?[d.ohls[k]]:[]):(d.ohl&&k===d.correctIdx?[d.ohl]:[]);$('.ct',c).innerHTML=markRanges(d.opts[k],on?r:[])});
  }
}
function groupHTML(g){
  let h='<div class="section-title" role="heading" aria-level="3">'+esc(g.title)+'</div><p class="q-instr">'+esc(g.instr)+'</p>';
  if(g.bank){
    h+='<div class="word-box"><div class="word-box-title">'+esc(g.bank.title.toUpperCase())+'</div><table class="word-options"><tbody>'+
      Array.from({length:Math.ceil(g.bank.items.length/2)},(_,j)=>'<tr>'+g.bank.items.slice(j*2,j*2+2).map((w,k)=>'<td><span class="option-letter'+(g.bank.labels?' lbl':'')+'">'+(g.bank.labels?g.bank.labels[j*2+k]:String.fromCharCode(65+j*2+k))+'</span>'+esc(w)+'</td>').join('')+(g.bank.items.slice(j*2,j*2+2).length<2?'<td></td>':'')+'</tr>').join('')+'</tbody></table></div>';
  }
  if(g.summary) h+=summaryHTML(g);
  if(g.kind==='mcq2') h+=cardHTML(g.qs[0],g);
  else if(!isSummaryGroup(g)) h+=g.qs.map(q=>cardHTML(q,g)).join('');   // summary questions are corrected inline, next to their blank
  return h;
}
DATA.parts.forEach((p,i)=>{
  const hasBlue=p.groups.some(g=>g.qs.some(q=>Q[q].ev.some(e=>e.blue&&e.blue.length)));
  const reading=document.createElement('section');reading.id='r'+i;reading.className='page';
  reading.innerHTML='<div class="workspace"><article class="pane reading"><div class="eyebrow">PASSAGE '+(i+1)+'</div><h2 class="passage-title">'+esc(p.title)+'</h2>'+
    (p.subtitle?'<p class="hint"><em>'+esc(p.subtitle)+'</em></p>':'')+
    '<div class="legend"><span><span class="lg-box"></span>Khung đỏ nhạt: ngữ cảnh chứa đáp án</span><span><mark class="answer-hl">Vàng đậm</mark> thông tin được hỏi: câu hỏi ↔ passage</span>'+(hasBlue?'<span><span class="ref-name">Xanh dương</span> tên người / đại từ chỉ người</span>':'')+'<span>Nhấp đúp vào một từ để tra từ vựng</span></div>'+
    paragraphsHTML(i)+'</article><aside class="pane questions"><p class="hint">Chọn câu hỏi → passage hiện khung ngữ cảnh + highlight vàng đậm (và phần tương ứng trong câu hỏi) → bấm Answer / (Ans) để mở lời giải.</p>'+
    p.groups.map(groupHTML).join('')+'</aside></div>';
  $('#app').append(reading);

  const vocab=document.createElement('section');vocab.id='v'+i;vocab.className='page';
  const core=VOCAB.filter(e=>e.part===i&&e.core);
  vocab.innerHTML='<div class="vocab-wrap"><div class="eyebrow">VOCABULARY '+(i+1)+' · '+esc(p.title)+'</div><div class="vocab-head"><div><h2>Core Vocabulary Spine</h2><p>'+core.length+' từ / cụm từ trọng tâm · Học theo ngữ cảnh bài đọc</p></div><button class="all-meanings" type="button">Hiện tất cả nghĩa</button></div><div class="vocab-list">'+
    core.map(e=>'<details><summary><span>'+esc(e.hw)+' <span class="pos">('+esc(e.pos)+')</span></span></summary><div class="vbody"><p><strong>Nghĩa:</strong> '+esc(e.vn)+'</p><p class="ex"><em>Example:</em> '+esc(e.ex)+'</p></div></details>').join('')+'</div></div>';
  $('#app').append(vocab);
  $('.all-meanings',vocab).onclick=e=>{const show=!$$('details',vocab).every(x=>x.open);$$('details',vocab).forEach(x=>x.open=show);e.target.textContent=show?'Ẩn tất cả nghĩa':'Hiện tất cả nghĩa'};
});
for(const type of ['v','r'])for(let i=0;i<3;i++){const b=document.createElement('button');b.dataset.view=type+i;b.textContent=(type==='v'?'Vocabulary ':'Part ')+(i+1);b.onclick=()=>selectView(type+i);$('.dock').append(b)}

/* ------------------------------------------------------------------ navigation */
let activeView='r0';
function selectView(id){
  activeView=id;const part=+id.slice(1);
  $$('.page').forEach(p=>p.classList.toggle('active',p.id===id));
  $$('.dock button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===id?'page':'false'));
  $('#subtitle').textContent=(id[0]==='v'?'Vocabulary ':'Part ')+(part+1)+' · '+DATA.parts[part].title;
  try{localStorage.setItem('c16r4-view',id)}catch(e){}
  window.scrollTo(0,0);
}

/* ------------------------------------------------------------------ selecting a question */
function jump(part,i){
  const el=$('#para-'+part+'-'+i),pane=el.closest('.pane');
  if(matchMedia('(max-width:900px)').matches)el.scrollIntoView({behavior:'smooth',block:'start'});
  else pane.scrollTo({top:el.getBoundingClientRect().top-pane.getBoundingClientRect().top+pane.scrollTop-14,behavior:'smooth'});
}
function selectQuestion(q){
  q=+q;const part=PART_OF[q],d=Q[q],prev=ACTIVE;ACTIVE=q;
  $$('.active-question').forEach(x=>x.classList.remove('active-question'));
  const block=$('#r'+part+' .question-block[data-q="'+q+'"]');if(block)block.classList.add('active-question');
  $$('.head-box').forEach(h=>h.classList.toggle('active',+h.dataset.q===q));
  if(prev&&prev!==q){const pg=GROUP_OF[prev];isSummaryGroup(pg)?refreshSummary(pg):refreshCard(prev)}
  const g=GROUP_OF[q];isSummaryGroup(g)?refreshSummary(g):refreshCard(q);
  const byPara={};d.ev.forEach(e=>{byPara[e.p]=e});
  $$('.passage-p',$('#r'+part)).forEach((el,i)=>{
    el.classList.toggle('active-context',!!byPara[i]);
    $('.paragraph-text',el).innerHTML=renderParagraph(DATA.parts[part].paras[i].text,byPara[i]);
  });
  if(d.ev.length)jump(part,d.ev[0].p);
}
function toggleAnswer(block){
  const q=+block.dataset.q;
  if(!block.classList.contains('active-question'))selectQuestion(q);
  const box=$('.explanation-box',block),show=!box.classList.contains('show');
  box.classList.toggle('show',show);
  $('.btn-answer',block).setAttribute('aria-expanded',show);
  if(Q[q].opts){
    $$('.choice-item',block).forEach((c,k)=>{c.classList.toggle('is-correct',show&&isCorrectIdx(Q[q],k));c.classList.toggle('is-wrong',show&&c.classList.contains('selected')&&!isCorrectIdx(Q[q],k))});
    refreshCard(q);
  }
}
function toggleGap(q){                       // inline (Ans) for summary blanks
  q=+q;const g=GROUP_OF[q];
  OPEN_ANS.has(q)?OPEN_ANS.delete(q):OPEN_ANS.add(q);
  selectQuestion(q);                          // also re-renders the summary with the new state
  refreshSummary(g,q);
}
$('#app').addEventListener('click',e=>{
  const hb=e.target.closest('.head-box');
  if(hb){const q=+hb.dataset.q;selectQuestion(q);const blk=$('#r'+PART_OF[q]+' .question-block[data-q="'+q+'"]');
    if(blk){if(!$('.explanation-box',blk).classList.contains('show'))toggleAnswer(blk);blk.scrollIntoView({behavior:'smooth',block:'nearest'})}return}
  const ansBtn=e.target.closest('.ans-btn');
  if(ansBtn){e.stopPropagation();toggleGap(ansBtn.dataset.q);return}
  const answerBtn=e.target.closest('.btn-answer');
  if(answerBtn){e.stopPropagation();toggleAnswer(answerBtn.closest('.question-block'));return}
  const choice=e.target.closest('.choice-item');
  if(choice){
    const block=choice.closest('.question-block');selectQuestion(block.dataset.q);
    if(Q[+block.dataset.q].correctIdxs){                       // Choose TWO: pick / un-pick each option on its own
      const on=!choice.classList.contains('selected'),k=+choice.dataset.k;
      choice.classList.toggle('selected',on);$('.mcq-info-box',choice).classList.toggle('show',on);
      choice.classList.toggle('is-wrong',on&&$('.explanation-box',block).classList.contains('show')&&!isCorrectIdx(Q[+block.dataset.q],k));
      return;
    }
    $$('.choice-item',block).forEach(c=>{c.classList.remove('selected');$('.mcq-info-box',c).classList.remove('show');c.classList.remove('is-wrong')});
    choice.classList.add('selected');$('.mcq-info-box',choice).classList.add('show');
    if($('.explanation-box',block).classList.contains('show')){const k=+choice.dataset.k;choice.classList.toggle('is-wrong',!isCorrectIdx(Q[+block.dataset.q],k))}
    return;
  }
  const gap=e.target.closest('.summary-gap');
  if(gap){selectQuestion(gap.dataset.q);return}
  const block=e.target.closest('.question-block');
  if(block)selectQuestion(block.dataset.q);
});
$('#app').addEventListener('keydown',e=>{
  if(!['Enter',' '].includes(e.key))return;
  const choice=e.target.closest&&e.target.closest('.choice-item');
  if(choice){e.preventDefault();choice.click();return}
  if(e.target.classList&&e.target.classList.contains('question-block')){e.preventDefault();selectQuestion(e.target.dataset.q)}
});

/* ------------------------------------------------------------------ theme / reset */
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').textContent=dark?'☀ Light mode':'◐ Dark mode';$('#theme').setAttribute('aria-pressed',dark);try{localStorage.setItem('c16r4-theme',dark?'dark':'light')}catch(e){}}
let theme,savedView;try{theme=localStorage.getItem('c16r4-theme');savedView=localStorage.getItem('c16r4-view')}catch(e){}
setTheme(theme?theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches);
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme!=='dark');
$('#reset').onclick=()=>{
  ACTIVE=null;OPEN_ANS.clear();
  $$('.explanation-box.show').forEach(x=>x.classList.remove('show'));
  $$('.btn-answer').forEach(x=>x.setAttribute('aria-expanded','false'));
  DATA.parts.forEach(p=>p.groups.forEach(g=>{if(isSummaryGroup(g))refreshSummary(g);else g.qs.forEach(refreshCard)}));
  $$('.choice-item').forEach(c=>{c.classList.remove('selected','is-correct','is-wrong');$('.mcq-info-box',c).classList.remove('show')});
  $$('.active-question').forEach(x=>x.classList.remove('active-question'));
  $$('.head-box.active').forEach(x=>x.classList.remove('active'));
  DATA.parts.forEach((_,i)=>clearPassage(i));
  closeVocab();
};

/* ------------------------------------------------------------------ vocabulary look-up (offline; two steps) */
const LOOKUP=DATA.parts.map(()=>({}));
VOCAB.forEach(e=>e.f.forEach(f=>{if(!LOOKUP[e.part][f])LOOKUP[e.part][f]=e}));
const WORD_CH=/[\p{L}\p{M}’'\-]/u;
function cleanWord(raw){return (raw||'').normalize('NFC').replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'').replace(/[’']s$/i,'')}
function findEntry(part,word){
  const w=word.toLowerCase(),map=LOOKUP[part];
  const c=[w,w.replace(/ies$/,'y'),w.replace(/(es|s)$/,''),w.replace(/(ed|d)$/,''),w.replace(/ing$/,''),w.replace(/ing$/,'e'),w.replace(/ly$/,''),w.replace(/ment$/,'')];
  for(const k of c)if(k&&map[k])return map[k];
  return null;
}
function wordAtPoint(x,y){
  let node,off;
  if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y);if(p){node=p.offsetNode;off=p.offset}}
  else if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);if(r){node=r.startContainer;off=r.startOffset}}
  if(!node||node.nodeType!==3)return '';
  const t=node.textContent;let s=Math.min(off,t.length),e=s;
  while(s>0&&WORD_CH.test(t[s-1]))s--;
  while(e<t.length&&WORD_CH.test(t[e]))e++;
  return t.slice(s,e);
}
let vocabOpener=null,vocabEntry=null;
function openVocab(part,rawWord){
  const word=cleanWord(rawWord);if(!word)return;
  vocabEntry=findEntry(part,word);
  vocabOpener=document.activeElement;
  $('#vm-word').textContent=word;
  const ex=$('#vm-example'),mean=$('#vm-meaning'),none=$('#vm-none'),btn=$('#vm-reveal');
  mean.hidden=true;btn.textContent='Reveal meaning';
  if(vocabEntry){
    // step 1: the selected word + one natural English example — NO Vietnamese yet
    let exHtml=esc(vocabEntry.ex);
    for(const f of [...vocabEntry.f].sort((a,b)=>b.length-a.length)){
      const re=new RegExp('\\b'+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
      if(re.test(vocabEntry.ex)){exHtml=esc(vocabEntry.ex).replace(re,m=>'<strong>'+m+'</strong>');break}
    }
    ex.innerHTML='<span class="k">Example:</span>'+exHtml;ex.hidden=false;none.hidden=true;btn.hidden=false;
  }else{
    // no reliable data for this word in this passage: say so, never invent a meaning or example
    ex.hidden=true;none.hidden=false;btn.hidden=true;
    none.textContent='Chưa có dữ liệu từ vựng cho từ này trong bài đọc. (Bạn có thể nhờ giáo viên bổ sung.)';
  }
  $('#vmodal').hidden=false;
  (vocabEntry?btn:$('#vm-close')).focus();
}
function closeVocab(){
  if($('#vmodal').hidden)return;
  $('#vmodal').hidden=true;
  try{getSelection().removeAllRanges()}catch(e){}
  if(vocabOpener&&vocabOpener.focus){try{vocabOpener.focus({preventScroll:true})}catch(e){}}
  vocabOpener=null;
}
$('#vm-reveal').onclick=()=>{
  const mean=$('#vm-meaning');
  if(mean.hidden&&vocabEntry){mean.innerHTML='<span class="k">Meaning:</span>'+esc(vocabEntry.vn);mean.hidden=false;$('#vm-reveal').textContent='Hide meaning'}
  else{mean.hidden=true;$('#vm-reveal').textContent='Reveal meaning'}
};
$('#vm-close').onclick=closeVocab;
$('#vmodal').addEventListener('click',e=>{if(e.target.id==='vmodal')closeVocab()});
document.addEventListener('keydown',e=>{
  if($('#vmodal').hidden)return;
  if(e.key==='Escape'){e.preventDefault();closeVocab();return}
  if(e.key==='Tab'){  // keep focus inside the pop-up
    const f=$$('#vmodal button').filter(b=>!b.hidden&&b.offsetParent!==null);
    if(!f.length)return;const i=f.indexOf(document.activeElement);
    if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}
    else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}
  }
});
function partOfEl(el){const pg=el.closest('.page');return pg?+pg.id.slice(1):0}
$('#app').addEventListener('dblclick',e=>{
  const pt=e.target.closest&&e.target.closest('.paragraph-text');if(!pt)return;
  let w=wordAtPoint(e.clientX,e.clientY);
  if(!cleanWord(w))w=String(getSelection()||'');
  openVocab(partOfEl(pt),w);
});
// long-press (touch devices)
let lpTimer=null,lpX=0,lpY=0;
$('#app').addEventListener('touchstart',e=>{
  const pt=e.target.closest&&e.target.closest('.paragraph-text');if(!pt||e.touches.length!==1)return;
  const t=e.touches[0];lpX=t.clientX;lpY=t.clientY;
  clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{const w=wordAtPoint(lpX,lpY);if(cleanWord(w))openVocab(partOfEl(pt),w)},550);
},{passive:true});
['touchmove','touchend','touchcancel'].forEach(ev=>$('#app').addEventListener(ev,e=>{
  if(ev==='touchmove'&&e.touches[0]&&Math.hypot(e.touches[0].clientX-lpX,e.touches[0].clientY-lpY)<10)return;
  clearTimeout(lpTimer);
},{passive:true}));

selectView(/^[rv][012]$/.test(savedView||'')?savedView:'r0');
</script>
